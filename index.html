    ["אֵילוּ תּוּתִים קוֹטְפִים?","רַק אֶת הָאֲדֻמִּים",["רַק אֶת הַיְּרֻקִּים","אֶת כֻּלָּם","אֶת הַגְּדוֹלִים בִּלְבַד"]]]},
  {title:"הַלַּיְלָה בַּמַּחֲנֶה", text:"יְלָדֵי הַצּוֹפִים יָצְאוּ לְמַחֲנֶה בַּיַּעַר. בָּעֶרֶב הֵם הִדְלִיקוּ מְדוּרָה וְצָלוּ תַּפּוּחֵי אֲדָמָה. הַמַּדְרִיכָה סִפְּרָה סִפּוּר מַפְחִיד. אַחַר כָּךְ כֻּלָּם נִכְנְסוּ לְשַׂקֵּי הַשֵּׁנָה. אַף אֶחָד לֹא נִרְדַּם מַהֵר.", qs:[
    ["לְאָן יָצְאוּ הַיְּלָדִים?","לְמַחֲנֶה בַּיַּעַר",["לְחוֹף הַיָּם","לְמוּזֵאוֹן","לְגַן הַחַיּוֹת"]],
    ["מָה צָלוּ עַל הַמְּדוּרָה?","תַּפּוּחֵי אֲדָמָה",["נַקְנִיקִיּוֹת","תִּירָס","דָּגִים"]],
    ["אֵיפֹה יָשְׁנוּ הַיְּלָדִים?","בְּשַׂקֵּי שֵׁנָה",["בְּמִטּוֹת","בָּאוֹטוֹבּוּס","בְּעַרְסָלִים"]]]},
  {title:"הַדּוֹלְפִין הַסַּקְרָן", text:"סִירָה קְטַנָּה שָׁטָה לְיַד הַחוֹף. פִּתְאוֹם קָפַץ לְיָדָהּ דּוֹלְפִין אָפֹר. הוּא שָׂחָה סְבִיב הַסִּירָה שָׁלוֹשׁ פְּעָמִים וְהִשְׁמִיעַ קוֹלוֹת שְׁרִיקָה. הַדַּיָּג אָמַר שֶׁדּוֹלְפִינִים אוֹהֲבִים לְשַׂחֵק וְאֵינָם מְסֻכָּנִים לִבְנֵי אָדָם.", qs:[
    ["מִי קָפַץ לְיַד הַסִּירָה?","דּוֹלְפִין אָפֹר",["כָּרִישׁ","צַב יָם","דָּג גָּדוֹל"]],
    ["כַּמָּה פְּעָמִים שָׂחָה הַדּוֹלְפִין סְבִיב הַסִּירָה?","שָׁלוֹשׁ",["פַּעַם אַחַת","עֶשֶׂר","חָמֵשׁ"]],
    ["מָה אָמַר הַדַּיָּג עַל דּוֹלְפִינִים?","שֶׁהֵם אוֹהֲבִים לְשַׂחֵק",["שֶׁהֵם מְסֻכָּנִים","שֶׁהֵם אוֹכְלִים סִירוֹת","שֶׁהֵם פּוֹחֲדִים מֵאֲנָשִׁים"]]]},
  {title:"הַחֻלְצָה הַוְּרֻדָּה", text:"אַבָּא הִכְנִיס אֶת הַכְּבִיסָה לַמְּכוֹנָה. הוּא לֹא שָׂם לֵב שֶׁבֵּין הַחֻלְצוֹת הַלְּבָנוֹת יֵשׁ גֶּרֶב אֲדֻמָּה. כְּשֶׁהַמְּכוֹנָה סִיְּמָה, כָּל הַחֻלְצוֹת יָצְאוּ וְרֻדּוֹת. אִמָּא צָחֲקָה וְאָמְרָה: מֵעַכְשָׁו כֻּלָּנוּ לוֹבְשִׁים וָרֹד.", qs:[
    ["מָה הָיָה בֵּין הַחֻלְצוֹת הַלְּבָנוֹת?","גֶּרֶב אֲדֻמָּה",["כּוֹבַע כָּחֹל","מַגֶּבֶת צְהֻבָּה","עִפָּרוֹן"]],
    ["מָה קָרָה לַחֻלְצוֹת?","הֵן נִהְיוּ וְרֻדּוֹת",["הֵן הִתְכַּוְּצוּ","הֵן נִקְרְעוּ","הֵן נֶעֶלְמוּ"]],
    ["אֵיךְ הֵגִיבָה אִמָּא?","הִיא צָחֲקָה",["הִיא כָּעֲסָה","הִיא בָּכְתָה","הִיא קָנְתָה חֻלְצוֹת חֲדָשׁוֹת"]]]},
  {title:"הַדֹּאַר שֶׁל הַיּוֹנִים", text:"לִפְנֵי שֶׁהָיוּ טֶלֶפוֹנִים, אֲנָשִׁים שָׁלְחוּ הוֹדָעוֹת בְּעֶזְרַת יוֹנִים. קָשְׁרוּ פֶּתֶק קָטָן לְרֶגֶל הַיּוֹנָה וְשִׁחְרְרוּ אוֹתָהּ. הַיּוֹנָה יוֹדַעַת תָּמִיד לַחְזֹר לַבַּיִת שֶׁלָּהּ, גַּם מִמֶּרְחָק שֶׁל מֵאוֹת קִילוֹמֶטְרִים.", qs:[
    ["בְּמָה שָׁלְחוּ הוֹדָעוֹת לִפְנֵי שֶׁהָיוּ טֶלֶפוֹנִים?","בְּעֶזְרַת יוֹנִים",["בְּעֶזְרַת כְּלָבִים","בְּעֶזְרַת דָּגִים","בְּעֶזְרַת נְמָלִים"]],
    ["לְאֵיפֹה קָשְׁרוּ אֶת הַפֶּתֶק?","לְרֶגֶל הַיּוֹנָה",["לַכָּנָף","לַמַּקּוֹר","לַצַּוָּאר"]],
    ["מָה מְיֻחָד בַּיּוֹנָה?","הִיא יוֹדַעַת לַחְזֹר לְבֵיתָהּ מֵרָחוֹק",["הִיא יוֹדַעַת לְדַבֵּר","הִיא עָפָה רַק בַּלַּיְלָה","הִיא אֵינָהּ אוֹכֶלֶת"]]]},
  {title:"הַמַּגָּפַיִם שֶׁל אֲחוֹתִי", text:"יוּבָל קִבֵּל אֶת הַמַּגָּפַיִם הַיְּשָׁנִים שֶׁל אֲחוֹתוֹ הַגְּדוֹלָה. הֵם הָיוּ צְהֻבִּים עִם פְּרָחִים. יוּבָל לֹא רָצָה לִנְעֹל אוֹתָם. אֲבָל כְּשֶׁיָּרַד גֶּשֶׁם, רַק לוֹ הָיוּ רַגְלַיִם יְבֵשׁוֹת, וְהוּא קָפַץ בְּכָל הַשְּׁלוּלִיּוֹת.", qs:[
    ["מִמִּי קִבֵּל יוּבָל אֶת הַמַּגָּפַיִם?","מֵאֲחוֹתוֹ הַגְּדוֹלָה",["מִסָּבְתָא","מֵחָבֵר","מֵהַחֲנוּת"]],
    ["אֵיךְ נִרְאוּ הַמַּגָּפַיִם?","צְהֻבִּים עִם פְּרָחִים",["שְׁחֹרִים וַחֲלָקִים","כְּחֻלִּים עִם כּוֹכָבִים","אֲדֻמִּים"]],
    ["מָה קָרָה כְּשֶׁיָּרַד גֶּשֶׁם?","רַק לְיוּבָל הָיוּ רַגְלַיִם יְבֵשׁוֹת",["יוּבָל נִרְטַב","הַמַּגָּפַיִם נִקְרְעוּ","יוּבָל נִשְׁאַר בַּבַּיִת"]]]},
  {title:"הַשּׁוּק", text:"בְּיוֹם שִׁשִּׁי בַּבֹּקֶר הַשּׁוּק מָלֵא אֲנָשִׁים. הַמּוֹכְרִים צוֹעֲקִים: עַגְבָנִיּוֹת טְרִיּוֹת! אֲבַטִּיחַ מָתוֹק! נֹעַם וְסָבְתָא קָנוּ יְרָקוֹת, חַלָּה וּפְרָחִים. נֹעַם קִבֵּל מֵהַמּוֹכֵר פֶּלַח אֲבַטִּיחַ לִטְעֹם.", qs:[
    ["מָתַי הַשּׁוּק מָלֵא אֲנָשִׁים?","בְּיוֹם שִׁשִּׁי בַּבֹּקֶר",["בְּשַׁבָּת בָּעֶרֶב","בְּיוֹם רִאשׁוֹן בַּלַּיְלָה","בְּכָל לַיְלָה"]],
    ["מָה קָנוּ נֹעַם וְסָבְתָא?","יְרָקוֹת, חַלָּה וּפְרָחִים",["בְּגָדִים וְנַעֲלַיִם","סְפָרִים","דָּגִים וּבָשָׂר"]],
    ["מָה קִבֵּל נֹעַם מֵהַמּוֹכֵר?","פֶּלַח אֲבַטִּיחַ",["עַגְבָנִיָּה","פֶּרַח","חַלָּה"]]]},
  {title:"הַזִּקִּית שֶׁל שַׁחַר", text:"שַׁחַר מָצָא זִקִּית עַל שִׂיחַ בַּגִּנָּה. הִיא הָיְתָה יְרֻקָּה כְּמוֹ הֶעָלִים, וְקָשֶׁה הָיָה לִרְאוֹת אוֹתָהּ. שַׁחַר רָצָה לָקַחַת אוֹתָהּ הַבַּיְתָה, אֲבָל אַבָּא הִסְבִּיר שֶׁזִּקִּית הִיא חַיַּת בָּר. הֵם צִלְּמוּ אוֹתָהּ וְהִשְׁאִירוּ אוֹתָהּ עַל הַשִּׂיחַ.", qs:[
    ["אֵיפֹה מָצָא שַׁחַר אֶת הַזִּקִּית?","עַל שִׂיחַ בַּגִּנָּה",["בְּתוֹךְ הַבַּיִת","עַל הַכְּבִישׁ","בַּחֲנוּת חַיּוֹת"]],
    ["לָמָּה הָיָה קָשֶׁה לִרְאוֹת אֶת הַזִּקִּית?","כִּי הִיא הָיְתָה יְרֻקָּה כְּמוֹ הֶעָלִים",["כִּי הִיא קְטַנָּה מְאוֹד","כִּי הָיָה חֹשֶׁךְ","כִּי הִיא זָזָה מַהֵר"]],
    ["מָה עָשׂוּ שַׁחַר וְאַבָּא בַּסּוֹף?","צִלְּמוּ אוֹתָהּ וְהִשְׁאִירוּ אוֹתָהּ",["לָקְחוּ אוֹתָהּ הַבַּיְתָה","נָתְנוּ אוֹתָהּ לַשָּׁכֵן","שָׂמוּ אוֹתָהּ בִּכְלוּב"]]]},
  {title:"הָרַכֶּבֶת הַקַּלָּה", text:"בָּעִיר שֶׁל דָּנָה יֵשׁ רַכֶּבֶת קַלָּה. הִיא נוֹסַעַת עַל פַּסִּים בְּאֶמְצַע הָרְחוֹב, וְהִיא פּוֹעֶלֶת בְּחַשְׁמַל. דָּנָה אוֹהֶבֶת לָשֶׁבֶת לְיַד הַחַלּוֹן. לִפְנֵי כָּל תַּחֲנָה נִשְׁמָע צִלְצוּל, וְקוֹל אוֹמֵר אֶת שֵׁם הַתַּחֲנָה.", qs:[
    ["עַל מָה נוֹסַעַת הָרַכֶּבֶת הַקַּלָּה?","עַל פַּסִּים",["עַל כְּבִישׁ רָגִיל","עַל מַיִם","עַל גֶּשֶׁר בִּלְבַד"]],
    ["בְּמָה פּוֹעֶלֶת הָרַכֶּבֶת?","בְּחַשְׁמַל",["בְּדֶלֶק","בְּפֶחָם","בְּרוּחַ"]],
    ["מָה נִשְׁמָע לִפְנֵי כָּל תַּחֲנָה?","צִלְצוּל וְשֵׁם הַתַּחֲנָה",["שִׁיר","צְפִירָה אֲרֻכָּה","שֶׁקֶט"]]]},
  {title:"הָעוּגִיּוֹת שֶׁנֶּעֶלְמוּ", text:"אִמָּא אָפְתָה עֶשֶׂר עוּגִיּוֹת וְשָׂמָה אוֹתָן עַל הַשַּׁיִשׁ. כְּשֶׁחָזְרָה, נִשְׁאֲרוּ רַק שֵׁשׁ. עַל הָרִצְפָּה הָיוּ פֵּרוּרִים, וְהֵם הוֹבִילוּ אֶל הַמִּטָּה שֶׁל הַכֶּלֶב. בּוֹנִי שָׁכַב שָׁם וְלִקֵּק אֶת הַשְּׂפָתַיִם.", qs:[
    ["כַּמָּה עוּגִיּוֹת אָפְתָה אִמָּא?","עֶשֶׂר",["שֵׁשׁ","אַרְבַּע","עֶשְׂרִים"]],
    ["כַּמָּה עוּגִיּוֹת נֶעֶלְמוּ?","אַרְבַּע",["שֵׁשׁ","עֶשֶׂר","שְׁתַּיִם"]],
    ["מִי אָכַל אֶת הָעוּגִיּוֹת?","הַכֶּלֶב בּוֹנִי",["הֶחָתוּל","אַבָּא","הַשָּׁכֵן"]]]},
  {title:"הַצִּפּוֹר בַּכִּתָּה", text:"בְּאֶמְצַע הַשִּׁעוּר נִכְנְסָה צִפּוֹר קְטַנָּה דֶּרֶךְ הַחַלּוֹן. הִיא עָפָה מִקִּיר לְקִיר וְלֹא מָצְאָה אֶת הַיְּצִיאָה. הַמּוֹרָה בִּקְּשָׁה מִכֻּלָּם לָשֶׁבֶת בְּשֶׁקֶט. הִיא כִּבְּתָה אֶת הָאוֹר וּפָתְחָה אֶת כָּל הַחַלּוֹנוֹת. הַצִּפּוֹר רָאֲתָה אֶת הָאוֹר בַּחוּץ וְעָפָה הַחוּצָה.", qs:[
    ["אֵיךְ נִכְנְסָה הַצִּפּוֹר לַכִּתָּה?","דֶּרֶךְ הַחַלּוֹן",["דֶּרֶךְ הַדֶּלֶת","בְּתוֹךְ תִּיק","דֶּרֶךְ הַגַּג"]],
    ["מָה בִּקְּשָׁה הַמּוֹרָה מֵהַיְּלָדִים?","לָשֶׁבֶת בְּשֶׁקֶט",["לִתְפֹּס אֶת הַצִּפּוֹר","לָצֵאת מֵהַכִּתָּה","לִצְעֹק"]],
    ["לָמָּה כִּבְּתָה הַמּוֹרָה אֶת הָאוֹר?","כְּדֵי שֶׁהַצִּפּוֹר תִּרְאֶה אֶת הָאוֹר שֶׁבַּחוּץ",["כְּדֵי שֶׁהַצִּפּוֹר תֵּרָדֵם","כִּי הִגִּיעַ הַלַּיְלָה","כְּדֵי לַחְסֹךְ חַשְׁמַל"]]]},
  {title:"הַלֶּחֶם שֶׁל שַׁבָּת", text:"בְּכָל יוֹם חֲמִישִׁי סָבְתָא רָחֵל אוֹפָה חַלּוֹת. הִיא קוֹלַעַת אֶת הַבָּצֵק לְצַמָּה שֶׁל שָׁלוֹשׁ רְצוּעוֹת. לִפְנֵי הָאֲפִיָּה הִיא מוֹרַחַת בֵּיצָה וּמְפַזֶּרֶת שֻׁמְשׁוּם. הַנְּכָדִים מְחַכִּים לְיַד הַתַּנּוּר, כִּי הַחַלָּה הֲכִי טְעִימָה כְּשֶׁהִיא חַמָּה.", qs:[
    ["מָתַי אוֹפָה סָבְתָא חַלּוֹת?","בְּיוֹם חֲמִישִׁי",["בְּשַׁבָּת","בְּיוֹם רִאשׁוֹן","בְּכָל בֹּקֶר"]],
    ["מִכַּמָּה רְצוּעוֹת עֲשׂוּיָה הַצַּמָּה?","שָׁלוֹשׁ",["שְׁתַּיִם","חָמֵשׁ","שֵׁשׁ"]],
    ["מָה מְפַזֶּרֶת סָבְתָא עַל הַחַלָּה?","שֻׁמְשׁוּם",["סֻכָּר","מֶלַח","שׁוֹקוֹלָד"]]]},
  {title:"הָאַרְנֶבֶת הַלְּבָנָה", text:"בַּפִּנַּת הַחַי שֶׁל בֵּית הַסֵּפֶר יֵשׁ אַרְנֶבֶת לְבָנָה. בְּכָל שָׁבוּעַ כִּתָּה אַחֶרֶת מְטַפֶּלֶת בָּהּ. הַשָּׁבוּעַ זֶה הַתּוֹר שֶׁל כִּתָּה ב'. הַיְּלָדִים מְבִיאִים לָהּ גֶּזֶר וְחַסָּה, מַחְלִיפִים אֶת הַמַּיִם וּמְנַקִּים אֶת הַכְּלוּב.", qs:[
    ["אֵיפֹה נִמְצֵאת הָאַרְנֶבֶת?","בְּפִנַּת הַחַי שֶׁל בֵּית הַסֵּפֶר",["בַּבַּיִת שֶׁל הַמּוֹרָה","בְּגַן הַחַיּוֹת","בַּיַּעַר"]],
    ["מִי מְטַפֵּל בָּהּ הַשָּׁבוּעַ?","כִּתָּה ב'",["כִּתָּה א'","הַמְּנַהֶלֶת","הַשּׁוֹמֵר"]],
    ["מָה אוֹכֶלֶת הָאַרְנֶבֶת?","גֶּזֶר וְחַסָּה",["לֶחֶם וּגְבִינָה","בָּשָׂר","שׁוֹקוֹלָד"]]]},
  {title:"הַמָּטוֹס שֶׁל נְיָר", text:"עִילַי קִפֵּל מָטוֹס מִנְּיָר. בַּפַּעַם הָרִאשׁוֹנָה הַמָּטוֹס צָלַל מִיָּד לָרִצְפָּה. עִילַי קִפֵּל אֶת הַכְּנָפַיִם קְצָת לְמַעְלָה וְנִסָּה שׁוּב. הַפַּעַם הַמָּטוֹס רִחֵף לְכָל אֹרֶךְ הַחֶדֶר וְנָחַת עַל הַסַּפָּה.", qs:[
    ["מִמָּה עָשָׂה עִילַי אֶת הַמָּטוֹס?","מִנְּיָר",["מֵעֵץ","מִפְּלַסְטִיק","מִקַּרְטוֹן עָבֶה"]],
    ["מָה קָרָה בַּפַּעַם הָרִאשׁוֹנָה?","הַמָּטוֹס צָלַל לָרִצְפָּה",["הַמָּטוֹס עָף רָחוֹק","הַמָּטוֹס נִקְרַע","הַמָּטוֹס עָף מֵהַחַלּוֹן"]],
    ["אֵיפֹה נָחַת הַמָּטוֹס בַּפַּעַם הַשְּׁנִיָּה?","עַל הַסַּפָּה",["עַל הָרִצְפָּה","עַל הַשֻּׁלְחָן","עַל הַמְּנוֹרָה"]]]},
  {title:"הַדְּבוֹרָה בַּמְּכוֹנִית", text:"הַמִּשְׁפָּחָה נָסְעָה לְטִיּוּל. פִּתְאוֹם נִכְנְסָה דְּבוֹרָה דֶּרֶךְ הַחַלּוֹן הַפָּתוּחַ. מִיכַל צָעֲקָה וְנוֹפְפָה בַּיָּדַיִם. אִמָּא אָמְרָה: אַל תָּזוּזִי. דְּבוֹרָה עוֹקֶצֶת רַק כְּשֶׁהִיא מְפַחֶדֶת. אַבָּא עָצַר בַּצַּד וּפָתַח אֶת הַדֶּלֶת, וְהַדְּבוֹרָה עָפָה הַחוּצָה.", qs:[
    ["אֵיךְ נִכְנְסָה הַדְּבוֹרָה לַמְּכוֹנִית?","דֶּרֶךְ הַחַלּוֹן הַפָּתוּחַ",["דֶּרֶךְ הַגַּג","בְּתוֹךְ תִּיק","דֶּרֶךְ הַמַּזְגָן"]],
    ["מָתַי דְּבוֹרָה עוֹקֶצֶת?","כְּשֶׁהִיא מְפַחֶדֶת",["תָּמִיד","כְּשֶׁהִיא רְעֵבָה","רַק בַּלַּיְלָה"]],
    ["מָה עָשָׂה אַבָּא?","עָצַר בַּצַּד וּפָתַח אֶת הַדֶּלֶת",["הִמְשִׁיךְ לִנְסֹעַ מַהֵר","סָגַר אֶת כָּל הַחַלּוֹנוֹת","תָּפַס אֶת הַדְּבוֹרָה בַּיָּד"]]]},
  {title:"הַקֹּטֶב הַצְּפוֹנִי", text:"בַּקֹּטֶב הַצְּפוֹנִי קַר מְאוֹד כָּל הַשָּׁנָה, וְהַיָּם מְכֻסֶּה קֶרַח. חַי שָׁם הַדֹּב הַלָּבָן. הַפַּרְוָה הָעָבָה שֶׁלּוֹ שׁוֹמֶרֶת עָלָיו מֵהַקֹּר. בַּקַּיִץ הַשֶּׁמֶשׁ שָׁם אֵינָהּ שׁוֹקַעַת בִּכְלָל, וּבַחֹרֶף חָשׁוּךְ גַּם בַּיּוֹם.", qs:[
    ["בְּמָה מְכֻסֶּה הַיָּם בַּקֹּטֶב הַצְּפוֹנִי?","בְּקֶרַח",["בְּחוֹל","בְּעֵשֶׂב","בְּעָלִים"]],
    ["מָה שׁוֹמֵר עַל הַדֹּב הַלָּבָן מֵהַקֹּר?","הַפַּרְוָה הָעָבָה",["הַמְּעָרָה","הַשֶּׁמֶשׁ","הַמַּיִם"]],
    ["מָה קוֹרֶה שָׁם בַּקַּיִץ?","הַשֶּׁמֶשׁ אֵינָהּ שׁוֹקַעַת",["חָשׁוּךְ כָּל הַיּוֹם","הַקֶּרַח נֶעֱלָם לְגַמְרֵי","יוֹרֵד גֶּשֶׁם חַם"]]]},
  {title:"הַחַלּוֹן הַשָּׁבוּר", text:"רוֹעִי וְאָסָף שִׂחֲקוּ בְּכַדּוּר בֶּחָצֵר. רוֹעִי בָּעַט חָזָק, וְהַכַּדּוּר שָׁבַר אֶת הַחַלּוֹן שֶׁל הַשְּׁכֵנָה. אָסָף רָצָה לִבְרֹחַ. רוֹעִי אָמַר: לֹא, צָרִיךְ לְסַפֵּר. הֵם דָּפְקוּ בַּדֶּלֶת וְהִתְנַצְּלוּ. הַשְּׁכֵנָה אָמְרָה: טוֹב שֶׁבָּאתֶם לְסַפֵּר.", qs:[
    ["מָה שָׁבַר הַכַּדּוּר?","אֶת הַחַלּוֹן שֶׁל הַשְּׁכֵנָה",["אֶת הָעֲצִיץ","אֶת הַדֶּלֶת","אֶת הַמְּנוֹרָה"]],
    ["מָה רָצָה אָסָף לַעֲשׂוֹת?","לִבְרֹחַ",["לְסַפֵּר לַשְּׁכֵנָה","לְתַקֵּן אֶת הַחַלּוֹן","לְהַמְשִׁיךְ לְשַׂחֵק"]],
    ["מָה עָשׂוּ הַיְּלָדִים בַּסּוֹף?","דָּפְקוּ בַּדֶּלֶת וְהִתְנַצְּלוּ",["הִתְחַבְּאוּ","הָלְכוּ הַבַּיְתָה","הֶאֱשִׁימוּ יֶלֶד אַחֵר"]]]},
  {title:"הָעֵז שֶׁל הָרוֹעֶה", text:"הָרוֹעֶה יוֹצֵא עִם הָעִזִּים אֶל הַגִּבְעָה מֻקְדָּם בַּבֹּקֶר. הָעִזִּים אוֹכְלוֹת עֲשָׂבִים וְקוֹצִים. לָעֵז הַמְּבֻגֶּרֶת יֵשׁ פַּעֲמוֹן עַל הַצַּוָּאר, וְכָל הָעֵדֶר הוֹלֵךְ אַחֲרֶיהָ. בָּעֶרֶב הָרוֹעֶה חוֹלֵב אֶת הָעִזִּים וּמֵכִין גְּבִינָה.", qs:[
    ["מָתַי יוֹצֵא הָרוֹעֶה עִם הָעִזִּים?","מֻקְדָּם בַּבֹּקֶר",["בַּלַּיְלָה","בַּצָּהֳרַיִם","בָּעֶרֶב"]],
    ["בִּשְׁבִיל מָה הַפַּעֲמוֹן?","כְּדֵי שֶׁהָעֵדֶר יֵלֵךְ אַחֲרֵי הָעֵז",["כְּדֵי לְהַפְחִיד זְאֵבִים","כְּדֵי לְקַשֵּׁט אוֹתָהּ","כְּדֵי לְהָעִיר אֶת הָרוֹעֶה"]],
    ["מָה מֵכִין הָרוֹעֶה מֵהֶחָלָב?","גְּבִינָה",["לֶחֶם","דְּבַשׁ","מִיץ"]]]},
  {title:"הַחֲבֵרָה מֵרָחוֹק", text:"לְשַׁי יֵשׁ חֲבֵרָה שֶׁגָּרָה בְּאֶרֶץ אַחֶרֶת. קוֹרְאִים לָהּ אֶמָּה. הֵן מְדַבְּרוֹת בְּשִׂיחַת וִידֵאוֹ פַּעַם בְּשָׁבוּעַ. כְּשֶׁאֵצֶל שַׁי עֶרֶב, אֵצֶל אֶמָּה רַק בֹּקֶר. שַׁי מְלַמֶּדֶת אֶת אֶמָּה מִלִּים בְּעִבְרִית, וְאֶמָּה מְלַמֶּדֶת אוֹתָהּ אַנְגְּלִית.", qs:[
    ["אֵיפֹה גָּרָה אֶמָּה?","בְּאֶרֶץ אַחֶרֶת",["בָּרְחוֹב שֶׁל שַׁי","בְּאוֹתָהּ עִיר","בַּבִּנְיָן הַסָּמוּךְ"]],
    ["כַּמָּה פְּעָמִים הֵן מְדַבְּרוֹת?","פַּעַם בְּשָׁבוּעַ",["בְּכָל יוֹם","פַּעַם בְּשָׁנָה","פַּעַם בְּחֹדֶשׁ"]],
    ["מָה מְלַמֶּדֶת שַׁי אֶת אֶמָּה?","מִלִּים בְּעִבְרִית",["אַנְגְּלִית","חֶשְׁבּוֹן","לְצַיֵּר"]]]},
  {title:"הַכֶּסֶף שֶׁנָּפַל", text:"בַּדֶּרֶךְ לַחֲנוּת רָאֲתָה לִיָה שְׁטָר שֶׁל עֶשְׂרִים שְׁקָלִים עַל הַמִּדְרָכָה. לְפָנֶיהָ הָלַךְ אִישׁ מְבֻגָּר, וְהַכִּיס שֶׁלּוֹ הָיָה פָּתוּחַ. לִיָה הֵרִימָה אֶת הַשְּׁטָר וְרָצָה אַחֲרָיו. סְלִיחָה, זֶה נָפַל לְךָ! הָאִישׁ חִיֵּךְ וְאָמַר: אֵיזוֹ יַלְדָּה יְשָׁרָה.", qs:[
    ["מָה רָאֲתָה לִיָה עַל הַמִּדְרָכָה?","שְׁטָר שֶׁל עֶשְׂרִים שְׁקָלִים",["מַפְתֵּחַ","אַרְנָק","טֶלֶפוֹן"]],
    ["מִמִּי נָפַל הַכֶּסֶף?","מֵאִישׁ מְבֻגָּר שֶׁהָלַךְ לְפָנֶיהָ",["מֵאִמָּא שֶׁלָּהּ","מִיֶּלֶד קָטָן","מֵהַמּוֹכֵר"]],
    ["מָה עָשְׂתָה לִיָה?","הֶחְזִירָה לוֹ אֶת הַכֶּסֶף",["קָנְתָה מַמְתַּקִּים","שָׂמָה בַּכִּיס","הִשְׁאִירָה עַל הַמִּדְרָכָה"]]]},

  ["אֵיפֹה חַי הַפִּינְגְּוִין הַקֵּיסָרִי?","בַּקֹּטֶב הַדְּרוֹמִי",["בַּמִּדְבָּר","בְּיַעַר טְרוֹפִּי","בַּקֹּטֶב הַצְּפוֹנִי"]],
  ["לְאָן הוֹלֶכֶת הָאֵם אַחֲרֵי שֶׁהֵטִילָה בֵּיצָה?","אֶל הַיָּם, לֶאֱכֹל",["לִישֹׁן בִּמְעָרָה","לְחַפֵּשׂ קֵן","לְהָרִים"]],
  ["אֵיפֹה מַחֲזִיק הָאָב אֶת הַבֵּיצָה?","עַל כַּפּוֹת הָרַגְלַיִם, מִתַּחַת לְקֶפֶל עוֹר",["בְּתוֹךְ קֵן מֵאֲבָנִים","בַּמַּקּוֹר","מִתַּחַת לַכָּנָף"]],
  ["לָמָּה אָסוּר שֶׁהַבֵּיצָה תִּגַּע בַּקֶּרַח?","כִּי הִיא תִּקְפָּא",["כִּי הִיא תִּתְגַּלְגֵּל","כִּי הִיא תִּתְלַכְלֵךְ","כִּי הָאֵם לֹא תִּמְצָא אוֹתָהּ"]],
  ["כַּמָּה זְמַן עוֹמֵד הָאָב עִם הַבֵּיצָה?","חָדְשַׁיִם",["יוֹמַיִם","שָׁבוּעַ","שָׁנָה"]],
  ["אֵיךְ הָאָבוֹת שׁוֹמְרִים עַל הַחֹם?","עוֹמְדִים צְפוּפִים וּמִתְחַלְּפִים בַּמְּקוֹמוֹת",["מַדְלִיקִים אֵשׁ","נִכְנָסִים לַמַּיִם","חוֹפְרִים בּוֹרוֹת בַּשֶּׁלֶג"]],
  ["אֵיךְ הָאֵם מוֹצֵאת אֶת בֶּן הַזּוּג שֶׁלָּהּ?","לְפִי הַקּוֹל שֶׁלּוֹ",["לְפִי הַצֶּבַע שֶׁלּוֹ","לְפִי הָרֵיחַ","לְפִי הַמָּקוֹם שֶׁבּוֹ עָמַד"]],
  ["מָה אֶפְשָׁר לוֹמַר עַל הָאָב?","שֶׁהוּא מָסוּר מְאוֹד לַגּוֹזָל שֶׁלּוֹ",["שֶׁהוּא עַצְלָן","שֶׁהוּא אוֹכֵל הַרְבֵּה בַּחֹרֶף","שֶׁהוּא עוֹזֵב אֶת הַבֵּיצָה"]]

{id:"lighthouse", icon:"🗼", title:"הַמִּגְדַּלּוֹר",
 text:"עַל חוֹף הַיָּם, בְּמָקוֹם גָּבוֹהַּ, עוֹמֵד מִגְדָּל צַר וְגָבוֹהַּ. בָּרֹאשׁ שֶׁלּוֹ יֵשׁ פָּנָס עֲנָקִי. זֶהוּ הַמִּגְדַּלּוֹר.\nבַּלַּיְלָה הַיָּם חָשׁוּךְ, וְהַמַּלָּחִים שֶׁבָּאֳנִיּוֹת אֵינָם רוֹאִים אֶת הַחוֹף. לְיַד הַחוֹף יֵשׁ לִפְעָמִים סְלָעִים חַדִּים שֶׁמִּסְתַּתְּרִים מִתַּחַת לַמַּיִם. אֳנִיָּה שֶׁתִּפְגַּע בָּהֶם עֲלוּלָה לִטְבֹּעַ.\nהָאוֹר שֶׁל הַמִּגְדַּלּוֹר מִסְתּוֹבֵב וְנִרְאֶה לְמֶרְחַקִּים. הוּא אוֹמֵר לַמַּלָּחִים: כָּאן הַחוֹף, הִזָּהֲרוּ! לְכָל מִגְדַּלּוֹר יֵשׁ קֶצֶב הִבְהוּב מִשֶּׁלּוֹ. אֶחָד מְהַבְהֵב פַּעֲמַיִם וְנָח, אַחֵר מְהַבְהֵב שָׁלוֹשׁ פְּעָמִים. כָּךְ הַמַּלָּחִים יוֹדְעִים לְיַד אֵיזֶה חוֹף הֵם נִמְצָאִים.\nכְּשֶׁיֵּשׁ עֲרָפֶל כָּבֵד, גַּם אוֹר חָזָק אֵינוֹ נִרְאֶה. אָז הַמִּגְדַּלּוֹר מַשְׁמִיעַ צְפִירָה חֲזָקָה וַאֲרֻכָּה.\nפַּעַם גָּר בְּכָל מִגְדַּלּוֹר שׁוֹמֵר. בְּכָל עֶרֶב הוּא טִפֵּס בְּמַדְרֵגוֹת רַבּוֹת וְהִדְלִיק אֶת הָאֵשׁ בַּפָּנָס. זֹאת הָיְתָה עֲבוֹדָה בּוֹדֵדָה, כִּי הַמִּגְדַּלּוֹר רָחוֹק מֵהָעִיר.\nהַיּוֹם הַפָּנָס נִדְלָק לְבַד, בְּחַשְׁמַל, וְלָאֳנִיּוֹת יֵשׁ מַכְשִׁירֵי נִוּוּט. אֲבָל הַמִּגְדַּלּוֹרִים עֲדַיִן עוֹמְדִים וּמְאִירִים, לְיֶתֶר בִּטָּחוֹן.",
 qs:[
  ["אֵיפֹה עוֹמֵד הַמִּגְדַּלּוֹר?","עַל חוֹף הַיָּם, בְּמָקוֹם גָּבוֹהַּ",["בְּאֶמְצַע הָעִיר","בְּתוֹךְ יַעַר","עַל אֳנִיָּה"]],

  ["אֵיךְ יוֹדְעִים הַמַּלָּחִים לְיַד אֵיזֶה חוֹף הֵם?","לְפִי קֶצֶב הַהִבְהוּב שֶׁל הַמִּגְדַּלּוֹר",["לְפִי צֶבַע הַמִּגְדָּל","לְפִי גֹּבַהּ הַגַּלִּים","לְפִי הָרֵיחַ"]],
  ["מָה עוֹשֶׂה הַמִּגְדַּלּוֹר כְּשֶׁיֵּשׁ עֲרָפֶל?","מַשְׁמִיעַ צְפִירָה חֲזָקָה",["מְכַבֶּה אֶת הָאוֹר","מֵנִיף דֶּגֶל","יוֹרֶה זִקּוּקִים"]],
  ["מָה עָשָׂה פַּעַם שׁוֹמֵר הַמִּגְדַּלּוֹר?","טִפֵּס בְּכָל עֶרֶב וְהִדְלִיק אֶת הַפָּנָס",["שָׁט בַּסִּירָה","דָּג דָּגִים לַמַּלָּחִים","בָּנָה אֳנִיּוֹת"]],
  ["לָמָּה הָעֲבוֹדָה שֶׁל הַשּׁוֹמֵר הָיְתָה בּוֹדֵדָה?","כִּי הַמִּגְדַּלּוֹר רָחוֹק מֵהָעִיר",["כִּי אָסוּר הָיָה לוֹ לְדַבֵּר","כִּי הוּא עָבַד רַק בַּיּוֹם","כִּי לֹא הָיוּ אֳנִיּוֹת"]],
  ["לָמָּה הַמִּגְדַּלּוֹרִים עֲדַיִן פּוֹעֲלִים הַיּוֹם?","לְיֶתֶר בִּטָּחוֹן",["כִּי לָאֳנִיּוֹת אֵין מַכְשִׁירִים","כִּי גָּרִים בָּהֶם שׁוֹמְרִים","כְּדֵי לְהָאִיר אֶת הָעִיר"]]

{id:"losttrip", icon:"🧭", title:"אֲבוּדִים בַּטִּיּוּל",
 text:"כִּתָּה ג' יָצְאָה לְטִיּוּל בַּחֹרֶשׁ. לִפְנֵי הַיְּצִיאָה אָמְרָה הַמַּדְרִיכָה: אִם מִישֶׁהוּ מְאַבֵּד אֶת הַקְּבוּצָה, הוּא נִשְׁאָר בַּמָּקוֹם וְשׁוֹרֵק בַּמַּשְׁרוֹקִית. לֹא מַמְשִׁיכִים לָלֶכֶת.\nבְּאֶמְצַע הַדֶּרֶךְ רָאוּ עֹמֶר וְשָׁקֵד צָב קָטָן עַל הַשְּׁבִיל. הֵם הִתְכּוֹפְפוּ לְהִסְתַּכֵּל עָלָיו. כְּשֶׁהֵרִימוּ אֶת הָרֹאשׁ, הַקְּבוּצָה כְּבָר לֹא הָיְתָה שָׁם. הַשְּׁבִיל הִתְפַּצֵּל לִשְׁנַיִם.\nעֹמֶר אָמַר: בּוֹאִי נָרוּץ יָמִינָה, אֲנִי בָּטוּחַ שֶׁהֵם שָׁם. שָׁקֵד הִסְסָה. גַּם הִיא פָּחֲדָה, וְגַם הִיא רָצְתָה לָרוּץ. אֲבָל הִיא נִזְכְּרָה בְּדִבְרֵי הַמַּדְרִיכָה. אִם נִבְחַר בַּשְּׁבִיל הַלֹּא נָכוֹן, אָמְרָה, נִתְרַחֵק עוֹד יוֹתֵר. נִשְׁאָרִים כָּאן.\nהֵם יָשְׁבוּ עַל סֶלַע גָּדוֹל. שָׁקֵד שָׁרְקָה בַּמַּשְׁרוֹקִית שָׁלוֹשׁ פְּעָמִים, חִכְּתָה, וְשָׁרְקָה שׁוּב. עֹמֶר חִלֵּק אֶת הַמַּיִם שֶׁנִּשְׁאֲרוּ בַּבַּקְבּוּק שֶׁלּוֹ.\nאַחֲרֵי עֶשֶׂר דַּקּוֹת, שֶׁנִּרְאוּ לָהֶם כְּמוֹ שָׁעָה, נִשְׁמְעָה שְׁרִיקָה מֵרָחוֹק. אַחַר כָּךְ קוֹל: עֹמֶר! שָׁקֵד! הַמַּדְרִיכָה הוֹפִיעָה מֵהַשְּׁבִיל הַשְּׂמָאלִי.\nעֹמֶר הִסְתַּכֵּל עַל שָׁקֵד. הֵם בָּאוּ מִשְּׂמֹאל, הוּא אָמַר בְּשֶׁקֶט. טוֹב שֶׁלֹּא רַצְנוּ יָמִינָה.",
 qs:[
  ["מָה אָמְרָה הַמַּדְרִיכָה לִפְנֵי הַטִּיּוּל?","מִי שֶׁמְּאַבֵּד אֶת הַקְּבוּצָה נִשְׁאָר בַּמָּקוֹם וְשׁוֹרֵק",["מִי שֶׁמְּאַבֵּד אֶת הַקְּבוּצָה רָץ קָדִימָה","אָסוּר לְהִסְתַּכֵּל עַל חַיּוֹת","כֻּלָּם הוֹלְכִים בְּשֶׁקֶט"]],
  ["לָמָּה עֹמֶר וְשָׁקֵד נִשְׁאֲרוּ מֵאָחוֹר?","הֵם הִסְתַּכְּלוּ עַל צָב",["הֵם הָיוּ עֲיֵפִים","הֵם שָׁתוּ מַיִם","הֵם קָשְׁרוּ שְׂרוֹכִים"]],
  ["מָה הָיְתָה הַבְּעָיָה בַּשְּׁבִיל?","הוּא הִתְפַּצֵּל לִשְׁנַיִם",["הוּא נִגְמַר","הוּא הָיָה חָסוּם","הוּא הָיָה חָשׁוּךְ"]],

{id:"testcopy", icon:"✏️", title:"הַמִּבְחָן בְּחֶשְׁבּוֹן",
 text:"בְּיוֹם שְׁלִישִׁי הָיָה מִבְחָן בְּחֶשְׁבּוֹן. אִיתַי לֹא הִתְכּוֹנֵן. בָּעֶרֶב שֶׁלִּפְנֵי הוּא שִׂחֵק בַּמַּחְשֵׁב, וְאָמַר לְעַצְמוֹ שֶׁיִּלְמַד בַּבֹּקֶר. בַּבֹּקֶר הוּא קָם מְאֻחָר.\nכְּשֶׁהַמּוֹרָה חִלְּקָה אֶת הַדַּפִּים, אִיתַי הִסְתַּכֵּל עַל הַתַּרְגִּילִים וְהִרְגִּישׁ שֶׁהַבֶּטֶן שֶׁלּוֹ מִתְכַּוֶּצֶת. הוּא לֹא יָדַע לִפְתֹּר אֶת רֻבָּם.\nלְיָדוֹ יָשְׁבָה נֹגָה, הַתַּלְמִידָה הַטּוֹבָה בַּכִּתָּה. הַדַּף שֶׁלָּהּ הָיָה פָּתוּחַ, וְהַתְּשׁוּבוֹת נִרְאוּ בְּבֵרוּר. הַמּוֹרָה עָמְדָה עִם הַגַּב אֲלֵיהֶם. אִיתַי חָשַׁב: רַק מַבָּט אֶחָד. אַף אֶחָד לֹא יֵדַע.\nאֲבָל אָז הוּא חָשַׁב עוֹד: אִם אַעְתִּיק, הַמּוֹרָה תַּחְשֹׁב שֶׁאֲנִי מֵבִין. הִיא תַּמְשִׁיךְ לַחֹמֶר הַבָּא, וַאֲנִי אֵלֵךְ לְאִבּוּד עוֹד יוֹתֵר.\nהוּא הוֹרִיד אֶת הָעֵינַיִם אֶל הַדַּף שֶׁלּוֹ וּפָתַר רַק אֶת מָה שֶׁיָּדַע. אַרְבָּעָה תַּרְגִּילִים מִתּוֹךְ עֲשָׂרָה.\nכְּשֶׁהַמּוֹרָה הֶחְזִירָה אֶת הַמִּבְחָנִים, הִיא כָּתְבָה לוֹ: רָאִיתִי שֶׁהָיָה לְךָ קָשֶׁה. בּוֹא אֵלַי בַּהַפְסָקָה וְנִתְרַגֵּל יַחַד.\nאַחֲרֵי שְׁבוּעַיִם שֶׁל תִּרְגּוּל, בַּמִּבְחָן הַבָּא, אִיתַי פָּתַר נָכוֹן תִּשְׁעָה תַּרְגִּילִים. הַצִּיּוּן הַזֶּה הָיָה כֻּלּוֹ שֶׁלּוֹ.",
 qs:[
  ["לָמָּה אִיתַי לֹא הָיָה מוּכָן לַמִּבְחָן?","הוּא שִׂחֵק בַּמַּחְשֵׁב וְקָם מְאֻחָר",["הוּא הָיָה חוֹלֶה","הַמּוֹרָה לֹא הוֹדִיעָה","הוּא שָׁכַח אֶת הַסֵּפֶר בַּכִּתָּה"]],

  ["כַּמָּה תַּרְגִּילִים פָּתַר אִיתַי בַּמִּבְחָן הָרִאשׁוֹן?","אַרְבָּעָה מִתּוֹךְ עֲשָׂרָה",["תִּשְׁעָה מִתּוֹךְ עֲשָׂרָה","אֶת כֻּלָּם","אַף אֶחָד"]],
  ["מָה הִצִּיעָה הַמּוֹרָה?","לְתַרְגֵּל יַחַד בַּהַפְסָקָה",["לְהִבָּחֵן שׁוּב מִיָּד","לְהָבִיא אֶת הַהוֹרִים","לַעֲבֹר כִּתָּה"]],
  ["מָה קָרָה בַּמִּבְחָן הַבָּא?","אִיתַי פָּתַר נָכוֹן תִּשְׁעָה תַּרְגִּילִים",["אִיתַי שׁוּב נִכְשַׁל","אִיתַי הֶעְתִּיק","הַמִּבְחָן בֻּטַּל"]],
  ["מָה פֵּרוּשׁ הַמִּשְׁפָּט הַצִּיּוּן הָיָה כֻּלּוֹ שֶׁלּוֹ?","שֶׁהוּא הִשִּׂיג אוֹתוֹ בְּכֹחוֹת עַצְמוֹ",["שֶׁהוּא לָקַח אֶת הַדַּף הַבַּיְתָה","שֶׁאַף אֶחָד אַחֵר לֹא נִבְחַן","שֶׁהַמּוֹרָה נָתְנָה לוֹ מַתָּנָה"]]

{id:"salt", icon:"🧂", title:"מֵאֵיפֹה בָּא הַמֶּלַח?",
 text:"עַל כָּל שֻׁלְחָן יֵשׁ מִלְחִיָּה. אֲנַחְנוּ מְפַזְּרִים מֶלַח עַל הַסָּלָט וְעַל הַבֵּיצָה בְּלִי לַחְשֹׁב. אֲבָל מֵאֵיפֹה הוּא מַגִּיעַ?\nרֹב הַמֶּלַח מַגִּיעַ מֵהַיָּם. מֵי הַיָּם מְלוּחִים, כִּי מוּמַס בָּהֶם מֶלַח רַב. כְּדֵי לְהוֹצִיא אוֹתוֹ, מַזְרִימִים מֵי יָם לִבְרֵכוֹת רְחָבוֹת וּרְדוּדוֹת. הַשֶּׁמֶשׁ וְהָרוּחַ מְיַבְּשׁוֹת אֶת הַמַּיִם לְאַט לְאַט. הַמַּיִם מִתְאַדִּים, וְהַמֶּלַח נִשְׁאָר עַל הַקַּרְקָעִית כְּמוֹ שִׁכְבָה לְבָנָה וּמַבְרִיקָה. אוֹסְפִים אוֹתוֹ, מְנַקִּים וְטוֹחֲנִים.\nיֵשׁ גַּם מֶלַח שֶׁחוֹצְבִים מֵהָאֲדָמָה, בְּמִכְרוֹת עֲמֻקִּים. זֶה מֶלַח שֶׁנִּשְׁאַר מִיַּמִּים עַתִּיקִים שֶׁהִתְיַבְּשׁוּ לִפְנֵי מִילְיוֹנֵי שָׁנִים.\nהַגּוּף שֶׁלָּנוּ צָרִיךְ מְעַט מֶלַח כְּדֵי לִפְעֹל. אֲבָל יוֹתֵר מִדַּי מֶלַח אֵינוֹ בָּרִיא.\nלִפְנֵי שֶׁהָיוּ מְקָרְרִים, הַמֶּלַח הָיָה חָשׁוּב עוֹד יוֹתֵר. אֲנָשִׁים שָׁמְרוּ בְּעֶזְרָתוֹ דָּגִים, בָּשָׂר וִירָקוֹת, כִּי אֹכֶל מָלוּחַ אֵינוֹ מִתְקַלְקֵל מַהֵר.\nהַמֶּלַח הָיָה אָז יָקָר מְאוֹד. בְּרוֹמָא הָעַתִּיקָה חַיָּלִים קִבְּלוּ חֵלֶק מֵהַשָּׂכָר שֶׁלָּהֶם בְּמֶלַח.\nבַּחֹרֶף, בַּאֲרָצוֹת קָרוֹת, מְפַזְּרִים מֶלַח עַל הַכְּבִישִׁים. הַמֶּלַח מֵמִיס אֶת הַקֶּרַח, וְהַמְּכוֹנִיּוֹת אֵינָן מַחְלִיקוֹת.",
 qs:[
  ["מֵאֵיפֹה מַגִּיעַ רֹב הַמֶּלַח?","מֵהַיָּם",["מֵעֵצִים","מֵהֶעָנָנִים","מֵהַנְּהָרוֹת"]],
  ["אֵיךְ מוֹצִיאִים מֶלַח מִמֵּי הַיָּם?","נוֹתְנִים לַמַּיִם לְהִתְאַדּוֹת בִּבְרֵכוֹת רְדוּדוֹת",["מְסַנְּנִים אֶת הַמַּיִם בְּבַד","מַקְפִּיאִים אֶת הַמַּיִם","מַרְתִּיחִים אֶת הַיָּם"]],
  ["מָה מְיַבֵּשׁ אֶת הַמַּיִם בַּבְּרֵכוֹת?","הַשֶּׁמֶשׁ וְהָרוּחַ",["מְכוֹנוֹת גְּדוֹלוֹת","אֵשׁ","חוֹל"]],
  ["מֵאֵיפֹה בָּא הַמֶּלַח שֶׁבַּמִּכְרוֹת?","מִיַּמִּים עַתִּיקִים שֶׁהִתְיַבְּשׁוּ",["מֵהָרֵי גַּעַשׁ","מִגֶּשֶׁם","מֵעֲצָמוֹת שֶׁל דָּגִים"]],
  ["מָה נֶאֱמָר עַל מֶלַח וְהַבְּרִיאוּת?","צָרִיךְ מְעַט, אֲבָל יוֹתֵר מִדַּי אֵינוֹ בָּרִיא",["כְּכָל שֶׁאוֹכְלִים יוֹתֵר, טוֹב יוֹתֵר","אָסוּר לֶאֱכֹל מֶלַח בִּכְלָל","הַמֶּלַח אֵינוֹ מַשְׁפִּיעַ עַל הַגּוּף"]],
  ["לָמָּה הַמֶּלַח הָיָה חָשׁוּב לִפְנֵי שֶׁהָיוּ מְקָרְרִים?","כִּי שָׁמְרוּ בְּעֶזְרָתוֹ עַל אֹכֶל",["כִּי בָּנוּ מִמֶּנּוּ בָּתִּים","כִּי הִשְׁתַּמְּשׁוּ בּוֹ לְאוֹר","כִּי רָחֲצוּ בּוֹ"]],
  ["מָה קִבְּלוּ חַיָּלִים בְּרוֹמָא הָעַתִּיקָה?","חֵלֶק מֵהַשָּׂכָר בְּמֶלַח",["זָהָב בִּלְבַד","דָּגִים מְלוּחִים","בְּרֵכוֹת מֶלַח"]],
  ["לָמָּה מְפַזְּרִים מֶלַח עַל כְּבִישִׁים בַּחֹרֶף?","כְּדֵי לְהָמִיס אֶת הַקֶּרַח",["כְּדֵי לְקַשֵּׁט אוֹתָם","כְּדֵי שֶׁיִּהְיוּ לְבָנִים","כְּדֵי לְהַרְחִיק חַיּוֹת"]]

 text:"הַפִּילִים חַיִּים בְּמִשְׁפָּחוֹת גְּדוֹלוֹת. בְּכָל מִשְׁפָּחָה יֵשׁ אִמָּהוֹת, דּוֹדוֹת, אֲחָיוֹת וְגוּרִים. הַזְּכָרִים הַבּוֹגְרִים חַיִּים בְּדֶרֶךְ כְּלָל לְבַד.\nבְּרֹאשׁ הַמִּשְׁפָּחָה עוֹמֶדֶת הַפִּילָה הַזְּקֵנָה בְּיוֹתֵר. הִיא אֵינָהּ הַחֲזָקָה בְּיוֹתֵר, אֲבָל הִיא יוֹדַעַת הֲכִי הַרְבֵּה. לַפִּילִים יֵשׁ זִכָּרוֹן מְצֻיָּן. הַפִּילָה הַזְּקֵנָה זוֹכֶרֶת אֵיפֹה יֵשׁ מַיִם גַּם בְּשָׁנָה שֶׁל בַּצֹּרֶת, אֲפִלּוּ אִם הָיְתָה שָׁם רַק פַּעַם אַחַת, לִפְנֵי שָׁנִים רַבּוֹת. בִּזְמַן יֹבֶשׁ הִיא מוֹבִילָה אֶת כֻּלָּם, לִפְעָמִים יָמִים שְׁלֵמִים, אֶל בְּאֵר רְחוֹקָה.\nכְּשֶׁנּוֹלָד גּוּר, כָּל הַמִּשְׁפָּחָה עוֹזֶרֶת לְגַדֵּל אוֹתוֹ. אִם הוּא נִתְקָע בַּבֹּץ, הַדּוֹדוֹת דּוֹחֲפוֹת אוֹתוֹ בַּחֵדֶק. כְּשֶׁמִּתְקָרֵב אַרְיֵה, הַבּוֹגְרוֹת עוֹמְדוֹת בְּמַעְגָּל, וְהַגּוּרִים בָּאֶמְצַע.\nהַפִּילִים מְדַבְּרִים זֶה עִם זֶה. חֵלֶק מֵהַקּוֹלוֹת שֶׁלָּהֶם נְמוּכִים כָּל כָּךְ, שֶׁבְּנֵי אָדָם אֵינָם שׁוֹמְעִים אוֹתָם. הַקּוֹלוֹת הָאֵלֶּה עוֹבְרִים דֶּרֶךְ הָאֲדָמָה לְמֶרְחָק שֶׁל קִילוֹמֶטְרִים, וּפִילִים אֲחֵרִים מַרְגִּישִׁים אוֹתָם בְּכַפּוֹת הָרַגְלַיִם.\nחוֹקְרִים רָאוּ שֶׁפִּילִים עוֹצְרִים לְיַד עֲצָמוֹת שֶׁל פִּיל שֶׁמֵּת וְנוֹגְעִים בָּהֶן בְּעַדִינוּת. נִרְאֶה שֶׁהֵם זוֹכְרִים גַּם אֶת מִי שֶׁאֵינֶנּוּ.",
 qs:[
  ["מִי חַי בְּמִשְׁפָּחָה שֶׁל פִּילִים?","אִמָּהוֹת, דּוֹדוֹת, אֲחָיוֹת וְגוּרִים",["רַק זְכָרִים בּוֹגְרִים","רַק אֵם וְגוּר אֶחָד","פִּילִים וַאֲרָיוֹת"]],

  ["אֵיךְ מְגִנּוֹת הַבּוֹגְרוֹת עַל הַגּוּרִים מֵאַרְיֵה?","עוֹמְדוֹת בְּמַעְגָּל וְהַגּוּרִים בָּאֶמְצַע",["בּוֹרְחוֹת מַהֵר","מַחְבִּיאוֹת אוֹתָם בַּמַּיִם","מְטַפְּסוֹת עַל גִּבְעָה"]],

{id:"solo", icon:"🎤", title:"הַסּוֹלוֹ שֶׁל יָעֵל",
 text:"לִקְרַאת מְסִבַּת סוֹף הַשָּׁנָה, הַמּוֹרָה לְמוּסִיקָה בָּחֲרָה בְּיָעֵל לָשִׁיר סוֹלוֹ. לְיָעֵל יֵשׁ קוֹל יָפֶה, אֲבָל הִיא מֵעוֹלָם לֹא שָׁרָה לְבַד מוּל קָהָל.\nבַּחֲזָרוֹת הַכֹּל הָלַךְ טוֹב. אֲבָל בְּכָל פַּעַם שֶׁיָּעֵל דִּמְיְנָה אֶת הָאוּלָם מָלֵא הוֹרִים, הַיָּדַיִם שֶׁלָּהּ הִתְחִילוּ לְהַזִּיעַ. הִיא בִּקְּשָׁה מֵהַמּוֹרָה: אוּלַי מִישֶׁהִי אַחֶרֶת תָּשִׁיר?\nהַמּוֹרָה אָמְרָה: גַּם זַמָּרִים מְפֻרְסָמִים מִתְרַגְּשִׁים לִפְנֵי הוֹפָעָה. הַהִתְרַגְּשׁוּת לֹא נֶעֱלֶמֶת, אֲבָל אֶפְשָׁר לִלְמֹד לָשִׁיר יַחַד אִתָּהּ. הִיא לִמְּדָה אֶת יָעֵל שְׁלוֹשָׁה דְּבָרִים: לִנְשֹׁם לְאַט שָׁלוֹשׁ פְּעָמִים, לְהִסְתַּכֵּל עַל נְקֻדָּה אַחַת בְּסוֹף הָאוּלָם, וְלִזְכֹּר שֶׁהַקָּהָל רוֹצֶה שֶׁהִיא תַּצְלִיחַ.\nבְּעֶרֶב הַמְּסִבָּה יָעֵל עָמְדָה מֵאֲחוֹרֵי הַוִּילוֹן. הַלֵּב שֶׁלָּהּ דָּפַק כְּמוֹ תֹּף. הִיא נָשְׁמָה שָׁלוֹשׁ פְּעָמִים וְעָלְתָה לַבָּמָה.\nבַּשּׁוּרָה הָרִאשׁוֹנָה שֶׁל הַשִּׁיר הַקּוֹל שֶׁלָּהּ רָעַד מְעַט. הִיא מָצְאָה אֶת הַשָּׁעוֹן שֶׁעַל הַקִּיר הָרָחוֹק וְהִסְתַּכְּלָה רַק עָלָיו. בַּשּׁוּרָה הַשְּׁנִיָּה הַקּוֹל הִתְיַצֵּב. בַּפִּזְמוֹן הִיא כְּבָר שָׁכְחָה לְפַחֵד.\nכְּשֶׁהַשִּׁיר נִגְמַר, הָיָה רֶגַע שֶׁל שֶׁקֶט, וְאָז מְחִיאוֹת כַּפַּיִם חֲזָקוֹת. יָעֵל חִיְּכָה. הַיָּדַיִם שֶׁלָּהּ עֲדַיִן רָעֲדוּ, אֲבָל הַפַּעַם מִשִּׂמְחָה.",
 qs:[
  ["לְמָה נִבְחֲרָה יָעֵל?","לָשִׁיר סוֹלוֹ בִּמְסִבַּת סוֹף הַשָּׁנָה",["לְנַגֵּן בִּפְסַנְתֵּר","לִרְקֹד","לְהַנְחוֹת אֶת הַמְּסִבָּה"]],
  ["מִמָּה חָשְׁשָׁה יָעֵל?","לָשִׁיר לְבַד מוּל קָהָל",["לִשְׁכֹּחַ אֶת הַמַּנְגִּינָה בַּחֲזָרָה","לְאַחֵר לַמְּסִבָּה","שֶׁהַמּוֹרָה תִּכְעַס"]],
  ["מָה בִּקְּשָׁה יָעֵל מֵהַמּוֹרָה?","שֶׁמִּישֶׁהִי אַחֶרֶת תָּשִׁיר",["עוֹד חֲזָרוֹת","שִׁיר קַל יוֹתֵר","מִיקְרוֹפוֹן חָדָשׁ"]],
  ["מָה אָמְרָה הַמּוֹרָה עַל הִתְרַגְּשׁוּת?","שֶׁאֶפְשָׁר לִלְמֹד לָשִׁיר יַחַד אִתָּהּ",["שֶׁהִיא נֶעֱלֶמֶת לְגַמְרֵי","שֶׁרַק יְלָדִים מִתְרַגְּשִׁים","שֶׁהִיא סִימָן שֶׁלֹּא כְּדַאי לָשִׁיר"]],
  ["אֵיזוֹ עֵצָה נָתְנָה הַמּוֹרָה?","לִנְשֹׁם לְאַט וּלְהִסְתַּכֵּל עַל נְקֻדָּה רְחוֹקָה",["לַעֲצֹם עֵינַיִם כָּל הַשִּׁיר","לָשִׁיר מַהֵר מְאוֹד","לְהִסְתַּכֵּל עַל הַהוֹרִים"]],
  ["עַל מָה הִסְתַּכְּלָה יָעֵל בִּזְמַן הַשִּׁיר?","עַל הַשָּׁעוֹן שֶׁעַל הַקִּיר הָרָחוֹק",["עַל הָרִצְפָּה","עַל הַמּוֹרָה","עַל אִמָּא שֶׁלָּהּ"]],
  ["מָתַי הַקּוֹל שֶׁל יָעֵל הִתְיַצֵּב?","בַּשּׁוּרָה הַשְּׁנִיָּה",["מִיָּד בַּהַתְחָלָה","רַק בַּסּוֹף","הוּא לֹא הִתְיַצֵּב"]],
  ["לָמָּה רָעֲדוּ הַיָּדַיִם שֶׁל יָעֵל בַּסּוֹף?","מִשִּׂמְחָה",["מִפַּחַד","מִקֹּר","מֵעֲיֵפוּת"]]

 text:"בַּבִּנְיָן שֶׁל רוֹנִי הוֹפִיעַ פַּח חָדָשׁ, כָּתֹם. אַבָּא הִסְבִּיר שֶׁלְּתוֹכוֹ זוֹרְקִים אֲרִיזוֹת: בַּקְבּוּקֵי פְּלַסְטִיק, קֻפְסְאוֹת שִׁמּוּרִים, קַרְטוֹנֵי חָלָב וְשַׂקִּיּוֹת.\nרוֹנִי שָׁאֲלָה: מָה זֶה מְשַׁנֶּה לְאֵיזֶה פַּח זוֹרְקִים? הַכֹּל זֶבֶל.\nאַבָּא הֶרְאָה לָהּ סִרְטוֹן. אַשְׁפָּה רְגִילָה נוֹסַעַת לְאֲתַר הַטְמָנָה, שָׁם קוֹבְרִים אוֹתָהּ בָּאֲדָמָה. בַּקְבּוּק פְּלַסְטִיק שֶׁנִּקְבָּר שָׁם יִשָּׁאֵר מֵאוֹת שָׁנִים, כִּי פְּלַסְטִיק כִּמְעַט אֵינוֹ מִתְפָּרֵק. הָאֲתָרִים הָאֵלֶּה הוֹלְכִים וּמִתְמַלְּאִים.\nמָה שֶׁנִּזְרָק לַפַּח הַכָּתֹם נוֹסֵעַ לְמִפְעַל מִיּוּן. שָׁם מַפְרִידִים בֵּין הַחֳמָרִים: מַגְנֵט גָּדוֹל מוֹשֵׁךְ אֶת הַמַּתֶּכֶת, וְזֶרֶם אֲוִיר מֵעִיף אֶת הַפְּלַסְטִיק הַקַּל. אֶת הַפְּלַסְטִיק טוֹחֲנִים לִפְתִיתִים קְטַנִּים, מְמִיסִים, וְיוֹצְרִים מִמֶּנּוּ מוּצָרִים חֲדָשִׁים: סַפְסָלִים, צִנּוֹרוֹת וַאֲפִלּוּ בַּד לְמְעִילֵי פְלִיז.\nרוֹנִי הֻפְתְּעָה לִשְׁמֹעַ שֶׁהַמְּעִיל הֶחָם שֶׁלָּהּ הָיָה פַּעַם, אוּלַי, עֶשְׂרִים בַּקְבּוּקִים.\nמֵאוֹתוֹ יוֹם הִיא הָפְכָה לָאַחְרָאִית שֶׁל הַמִּשְׁפָּחָה. הִיא שׁוֹטֶפֶת אֶת הַקֻּפְסָאוֹת, מְשַׁטַּחַת אֶת הַקַּרְטוֹנִים כְּדֵי שֶׁיִּתְפְּסוּ פָּחוֹת מָקוֹם, וּמוֹרִידָה אֶת הַשַּׂקִּית לַפַּח הַכָּתֹם.\nאֲבָל אַבָּא אָמַר שֶׁיֵּשׁ דָּבָר טוֹב עוֹד יוֹתֵר מִמִּחְזוּר: לְהִשְׁתַּמֵּשׁ בְּפָחוֹת אֲרִיזוֹת מִלְּכַתְּחִלָּה. לָכֵן רוֹנִי לוֹקַחַת עַכְשָׁו לְבֵית הַסֵּפֶר בַּקְבּוּק שֶׁמְּמַלְּאִים שׁוּב וָשׁוּב.",

 text:"לְיוֹם הַהֻלֶּדֶת הַשִּׁבְעִים קִבְּלָה סָבְתָא שׁוֹשַׁנָּה טֶלֶפוֹן חָכָם. הִיא הֶחְזִיקָה אוֹתוֹ בִּזְהִירוּת, כְּאִלּוּ הוּא עָלוּל לְהִתְפּוֹצֵץ. אֲנִי כְּבָר זְקֵנָה מִדַּי לַדְּבָרִים הָאֵלֶּה, הִיא אָמְרָה.\nהַנֶּכֶד שֶׁלָּהּ, עִדּוֹ, בֶּן שְׁמוֹנֶה, אָמַר: סָבְתָא, אֲנִי אֲלַמֵּד אוֹתָךְ.\nבַּשִּׁעוּר הָרִאשׁוֹן עִדּוֹ הֶרְאָה לָהּ אֵיךְ לִפְתֹּחַ אֶת הַמָּסָךְ. הוּא עָשָׂה הַכֹּל מַהֵר מְאוֹד. סָבְתָא לֹא הִסְפִּיקָה לִרְאוֹת. הִיא לָחֲצָה בַּמָּקוֹם הַלֹּא נָכוֹן, וְהַטֶּלֶפוֹן הִתְחִיל לְנַגֵּן מוּסִיקָה. הִיא נִבְהֲלָה. עִדּוֹ נֶאֱנַח וְלָקַח לָהּ אֶת הַטֶּלֶפוֹן מֵהַיָּד: תְּנִי לִי, אֲנִי אֶעֱשֶׂה.\nסָבְתָא הִשְׁתַּתְּקָה. אַחֲרֵי רֶגַע הִיא אָמְרָה: אַתָּה זוֹכֵר מִי לִמֵּד אוֹתְךָ לִקְשֹׁר שְׂרוֹכִים? עִדּוֹ זָכַר. זֹאת הָיְתָה סָבְתָא. זֶה לָקַח שְׁלוֹשָׁה שָׁבוּעוֹת, וְהִיא מֵעוֹלָם לֹא לָקְחָה לוֹ אֶת הַנַּעַל מֵהַיָּד.\nעִדּוֹ הֶחְזִיר לָהּ אֶת הַטֶּלֶפוֹן. מֵעַכְשָׁו אַתְּ לוֹחֶצֶת וַאֲנִי רַק אוֹמֵר, הוּא אָמַר. הוּא הִסְבִּיר לְאַט, שָׁלָב אַחֲרֵי שָׁלָב. סָבְתָא כָּתְבָה אֶת הַשְּׁלַבִּים בְּפִנְקָס קָטָן.\nאַחֲרֵי שָׁבוּעַ צִלְצֵל הַטֶּלֶפוֹן שֶׁל אִמָּא. עַל הַמָּסָךְ הוֹפִיעָה סָבְתָא, מְחַיֶּכֶת, בְּשִׂיחַת וִידֵאוֹ. מֵאֲחוֹרֶיהָ נִרְאֲתָה הָעוּגָה שֶׁאָפְתָה.\nבְּסוֹף הַשִּׂיחָה הִיא שָׁלְחָה לְעִדּוֹ הוֹדָעָה, הָרִאשׁוֹנָה שֶׁכָּתְבָה בְּחַיֶּיהָ: תּוֹדָה, מוֹרֶה.",
 qs:[
  ["מָה קִבְּלָה סָבְתָא לְיוֹם הַהֻלֶּדֶת?","טֶלֶפוֹן חָכָם",["מַחְשֵׁב","שָׁעוֹן","סֵפֶר"]],
  ["מָה חָשְׁבָה סָבְתָא עַל עַצְמָהּ?","שֶׁהִיא זְקֵנָה מִדַּי לִלְמֹד",["שֶׁהִיא תִּלְמַד מַהֵר","שֶׁהִיא אֵינָהּ צְרִיכָה טֶלֶפוֹן","שֶׁהִיא יוֹדַעַת הַכֹּל"]],
  ["מָה הָיְתָה הַטָּעוּת שֶׁל עִדּוֹ בַּשִּׁעוּר הָרִאשׁוֹן?","הוּא עָשָׂה הַכֹּל מַהֵר וְלָקַח לָהּ אֶת הַטֶּלֶפוֹן",["הוּא לֹא בָּא לַשִּׁעוּר","הוּא שָׁבַר אֶת הַטֶּלֶפוֹן","הוּא צָחַק עָלֶיהָ"]],
  ["בְּמָה הִזְכִּירָה סָבְתָא לְעִדּוֹ?","שֶׁהִיא לִמְּדָה אוֹתוֹ לִקְשֹׁר שְׂרוֹכִים בְּסַבְלָנוּת",["שֶׁהִיא קָנְתָה לוֹ נַעֲלַיִם","שֶׁהוּא שָׁבַר פַּעַם כּוֹס","שֶׁהִיא מְבֻגֶּרֶת מִמֶּנּוּ"]],
  ["מָה הֵבִין עִדּוֹ?","שֶׁכְּדֵי לִלְמֹד צָרִיךְ לַעֲשׂוֹת לְבַד, וְשֶׁצָּרִיךְ סַבְלָנוּת",["שֶׁסָּבְתָא לֹא תִּלְמַד","שֶׁעָדִיף שֶׁאִמָּא תְּלַמֵּד","שֶׁהַטֶּלֶפוֹן מְקֻלְקָל"]],
  ["אֵיךְ הִשְׁתַּנָּה הַשִּׁעוּר?","סָבְתָא לָחֲצָה בְּעַצְמָהּ וְעִדּוֹ הִסְבִּיר לְאַט",["עִדּוֹ עָשָׂה הַכֹּל בִּמְקוֹמָהּ","הֵם הִפְסִיקוּ לִלְמֹד","סָבְתָא קָרְאָה חוֹבֶרֶת"]],
  ["מָה עָשְׂתָה סָבְתָא כְּדֵי לִזְכֹּר?","כָּתְבָה אֶת הַשְּׁלַבִּים בְּפִנְקָס",["צִלְּמָה אֶת עִדּוֹ","בִּקְּשָׁה מֵעִדּוֹ לָבוֹא כָּל יוֹם","הִדְבִּיקָה פְּתָקִים עַל הַמָּסָךְ"]],
  ["לָמָּה כָּתְבָה סָבְתָא תּוֹדָה, מוֹרֶה?","כִּי עִדּוֹ לִמֵּד אוֹתָהּ",["כִּי הִיא כָּתְבָה לַמּוֹרֶה שֶׁלּוֹ","כִּי הִיא טָעֲתָה בַּמִּסְפָּר","כִּי כָּךְ קוֹרְאִים לְעִדּוֹ"]]
 ]},
{id:"stars", icon:"⭐", title:"הַכּוֹכָבִים",
 text:"בְּלַיְלָה בָּהִיר, רָחוֹק מֵאוֹרוֹת הָעִיר, אֶפְשָׁר לִרְאוֹת אַלְפֵי כּוֹכָבִים. הֵם נִרְאִים כְּמוֹ נְקֻדּוֹת קְטַנּוֹת שֶׁל אוֹר. בֶּאֱמֶת, כָּל כּוֹכָב הוּא כַּדּוּר עֲנָקִי שֶׁל גַּז בּוֹעֵר, כְּמוֹ הַשֶּׁמֶשׁ שֶׁלָּנוּ.\nגַּם הַשֶּׁמֶשׁ הִיא כּוֹכָב. הִיא נִרְאֵית לָנוּ גְּדוֹלָה וּבְהִירָה רַק מִפְּנֵי שֶׁהִיא קְרוֹבָה אֵלֵינוּ. שְׁאָר הַכּוֹכָבִים רְחוֹקִים כָּל כָּךְ, שֶׁהָאוֹר שֶׁלָּהֶם נוֹסֵעַ אֵלֵינוּ שָׁנִים רַבּוֹת. כְּשֶׁאַתֶּם מִסְתַּכְּלִים עַל כּוֹכָב, אַתֶּם רוֹאִים אוֹר שֶׁיָּצָא מִמֶּנּוּ לִפְנֵי שֶׁנּוֹלַדְתֶּם.\nהַכּוֹכָבִים נִמְצָאִים בַּשָּׁמַיִם גַּם בַּיּוֹם. אֵינֶנּוּ רוֹאִים אוֹתָם כִּי אוֹר הַשֶּׁמֶשׁ חָזָק מִדַּי וּמַסְתִּיר אוֹתָם.\nלֹא כָּל הַכּוֹכָבִים בְּאוֹתוֹ צֶבַע. הַכּוֹכָבִים הַחַמִּים בְּיוֹתֵר כְּחַלְחַלִּים, וְהַקָּרִים יוֹתֵר אֲדַמְדַּמִּים. הַשֶּׁמֶשׁ שֶׁלָּנוּ, הַצְּהֻבָּה, נִמְצֵאת בָּאֶמְצַע.\nלִפְנֵי אַלְפֵי שָׁנִים אֲנָשִׁים הִסְתַּכְּלוּ בַּשָּׁמַיִם וְחִבְּרוּ בַּדִּמְיוֹן קַוִּים בֵּין הַכּוֹכָבִים. כָּךְ הֵם רָאוּ צוּרוֹת: דֹּב, אַרְיֵה, צַיָּד. לַצּוּרוֹת הָאֵלֶּה קוֹרְאִים קְבוּצוֹת כּוֹכָבִים.\nמַלָּחִים וְנוֹדְדִים בַּמִּדְבָּר נֶעֶזְרוּ בַּכּוֹכָבִים כְּדֵי לִמְצֹא אֶת הַדֶּרֶךְ. כּוֹכַב הַצָּפוֹן נִמְצָא תָּמִיד בְּאוֹתוֹ מָקוֹם בַּשָּׁמַיִם, וּמַרְאֶה אֵיפֹה הַצָּפוֹן.\nכּוֹכָב נוֹפֵל אֵינוֹ כּוֹכָב בִּכְלָל. זוֹהִי אֶבֶן קְטַנָּה מִן הֶחָלָל, שֶׁנִּשְׂרֶפֶת כְּשֶׁהִיא נִכְנֶסֶת לָאֲוִיר שֶׁל כַּדּוּר הָאָרֶץ.",
 qs:[
  ["מָה הוּא כּוֹכָב בֶּאֱמֶת?","כַּדּוּר עֲנָקִי שֶׁל גַּז בּוֹעֵר",["נְקֻדָּה קְטַנָּה שֶׁל אוֹר","אֶבֶן מְאִירָה","מַרְאָה בֶּחָלָל"]],
  ["לָמָּה הַשֶּׁמֶשׁ נִרְאֵית גְּדוֹלָה מִשְּׁאָר הַכּוֹכָבִים?","כִּי הִיא קְרוֹבָה אֵלֵינוּ",["כִּי הִיא הַכּוֹכָב הַגָּדוֹל בְּיוֹתֵר","כִּי הִיא הַחַמָּה בְּיוֹתֵר","כִּי הִיא אֵינָהּ כּוֹכָב"]],
  ["מָה מְיֻחָד בָּאוֹר שֶׁאֲנַחְנוּ רוֹאִים מִכּוֹכָב רָחוֹק?","הוּא יָצָא מֵהַכּוֹכָב לִפְנֵי שָׁנִים רַבּוֹת",["הוּא מַגִּיעַ מֵהַיָּרֵחַ","הוּא נוֹצָר בָּאֲוִיר","הוּא יָצָא לִפְנֵי דַּקָּה"]],
  ["לָמָּה אֵין רוֹאִים כּוֹכָבִים בַּיּוֹם?","כִּי אוֹר הַשֶּׁמֶשׁ מַסְתִּיר אוֹתָם",["כִּי הֵם כְּבוּיִים בַּיּוֹם","כִּי הֵם נִמְצָאִים בַּצַּד הַשֵּׁנִי","כִּי הֵם יְשֵׁנִים"]],
  ["בְּאֵיזֶה צֶבַע הַכּוֹכָבִים הַחַמִּים בְּיוֹתֵר?","כְּחַלְחַלִּים",["אֲדַמְדַּמִּים","יְרֻקִּים","שְׁחֹרִים"]],
  ["מָה הֵן קְבוּצוֹת כּוֹכָבִים?","צוּרוֹת שֶׁאֲנָשִׁים דִּמְיְנוּ בֵּין הַכּוֹכָבִים",["כּוֹכָבִים שֶׁנּוֹפְלִים יַחַד","כּוֹכָבִים בְּאוֹתוֹ צֶבַע","כּוֹכָבִים קְרוֹבִים לַשֶּׁמֶשׁ"]],
  ["בְּמָה עוֹזֵר כּוֹכַב הַצָּפוֹן?","הוּא מַרְאֶה אֵיפֹה הַצָּפוֹן",["הוּא מֵאִיר אֶת הַדֶּרֶךְ","הוּא מְחַמֵּם בַּלַּיְלָה","הוּא מַרְאֶה אֶת הַשָּׁעָה"]],
  ["מָה הוּא כּוֹכָב נוֹפֵל?","אֶבֶן קְטַנָּה מִן הֶחָלָל שֶׁנִּשְׂרֶפֶת בָּאֲוִיר",["כּוֹכָב שֶׁנָּפַל מֵהַשָּׁמַיִם","חֵלֶק מֵהַיָּרֵחַ","מָטוֹס רָחוֹק"]]
 ]},
{id:"shadow", icon:"🌗", title:"הַצֵּל שֶׁלִּי",
 text:"בְּיוֹם שֶׁמֶשׁ, לְכָל אֶחָד מֵאִתָּנוּ יֵשׁ מְלַוֶּה שָׁקֵט: הַצֵּל. הוּא הוֹלֵךְ אִתָּנוּ לְכָל מָקוֹם, וְאִי אֶפְשָׁר לִבְרֹחַ מִמֶּנּוּ.\nאֵיךְ נוֹצָר צֵל? הָאוֹר נָע בְּקַוִּים יְשָׁרִים. כְּשֶׁהוּא פּוֹגֵעַ בְּגוּף שֶׁאֵינוֹ שָׁקוּף, כְּמוֹ אָדָם אוֹ עֵץ, הוּא אֵינוֹ יָכוֹל לַעֲבֹר דַּרְכּוֹ. מֵאֲחוֹרֵי הַגּוּף נִשְׁאָר אֵזוֹר שֶׁהָאוֹר אֵינוֹ מַגִּיעַ אֵלָיו. הָאֵזוֹר הֶחָשׁוּךְ הַזֶּה הוּא הַצֵּל.\nהַצֵּל נִמְצָא תָּמִיד בַּצַּד הֶהָפוּךְ מֵהָאוֹר. אִם הַשֶּׁמֶשׁ מֵאֲחוֹרֵיכֶם, הַצֵּל לִפְנֵיכֶם.\nהַצֵּל אֵינוֹ נִשְׁאָר בְּאוֹתוֹ גֹּדֶל כָּל הַיּוֹם. בַּבֹּקֶר וּלִפְנוֹת עֶרֶב, כְּשֶׁהַשֶּׁמֶשׁ נְמוּכָה בַּשָּׁמַיִם, הַצֵּל אָרֹךְ מְאוֹד. בַּצָּהֳרַיִם, כְּשֶׁהַשֶּׁמֶשׁ גְּבוֹהָה מֵעַל הָרֹאשׁ, הַצֵּל קָצָר, כִּמְעַט נֶעֱלָם מִתַּחַת לָרַגְלַיִם.\nלִפְנֵי שֶׁהָיוּ שְׁעוֹנִים, אֲנָשִׁים יָדְעוּ אֶת הַשָּׁעָה בְּעֶזְרַת הַצֵּל. הֵם נָעֲצוּ מוֹט בָּאֲדָמָה וְסִמְּנוּ סְבִיבוֹ קַוִּים. הַצֵּל שֶׁל הַמּוֹט זָז בְּמֶשֶׁךְ הַיּוֹם מִקַּו לְקַו. זֶהוּ שְׁעוֹן שֶׁמֶשׁ.\nגַּם בַּלַּיְלָה יֵשׁ צְלָלִים, אִם יֵשׁ אוֹר שֶׁל יָרֵחַ אוֹ שֶׁל פָּנָס. וְכַמָּה פָּנָסִים יוֹצְרִים כַּמָּה צְלָלִים בְּבַת אַחַת.\nאֶפְשָׁר גַּם לְשַׂחֵק עִם צְלָלִים: בְּחֶדֶר חָשׁוּךְ, מוּל קִיר מוּאָר בְּפָנָס, הַיָּדַיִם יְכוֹלוֹת לִיצֹר צֵל שֶׁל אַרְנָב, שֶׁל צִפּוֹר אוֹ שֶׁל כֶּלֶב נוֹבֵחַ.",
 qs:[
  ["אֵיךְ נוֹצָר צֵל?","גּוּף שֶׁאֵינוֹ שָׁקוּף חוֹסֵם אֶת הָאוֹר",["הָאוֹר צוֹבֵעַ אֶת הָאֲדָמָה","הַגּוּף מְיַצֵּר חֹשֶׁךְ","הַשֶּׁמֶשׁ נִכְבֵּית לְרֶגַע"]],
  ["אֵיךְ נָע הָאוֹר?","בְּקַוִּים יְשָׁרִים",["בְּמַעְגָּלִים","בִּקְפִיצוֹת","בְּזִיגְזָג"]],
  ["אֵיפֹה נִמְצָא הַצֵּל?","בַּצַּד הֶהָפוּךְ מֵהָאוֹר",["בַּצַּד שֶׁל הָאוֹר","תָּמִיד מִיָּמִין","תָּמִיד מֵאָחוֹר"]],
  ["מָתַי הַצֵּל אָרֹךְ מְאוֹד?","בַּבֹּקֶר וּלִפְנוֹת עֶרֶב",["בַּצָּהֳרַיִם","רַק בַּחֹרֶף","בַּלַּיְלָה בְּלִי יָרֵחַ"]],
  ["לָמָּה הַצֵּל קָצָר בַּצָּהֳרַיִם?","כִּי הַשֶּׁמֶשׁ גְּבוֹהָה מֵעַל הָרֹאשׁ",["כִּי חַם מְאוֹד","כִּי הַשֶּׁמֶשׁ חַלָּשָׁה","כִּי הָאֲדָמָה בְּהִירָה"]],
  ["אֵיךְ פּוֹעֵל שְׁעוֹן שֶׁמֶשׁ?","הַצֵּל שֶׁל מוֹט זָז מִקַּו לְקַו בְּמֶשֶׁךְ הַיּוֹם",["הַשֶּׁמֶשׁ מְסוֹבֶבֶת מְחוֹגִים","מַיִם מְטַפְטְפִים לְכַד","חוֹל נוֹפֵל בִּזְכוּכִית"]],
  ["מָה קוֹרֶה כְּשֶׁיֵּשׁ כַּמָּה פָּנָסִים?","נוֹצָרִים כַּמָּה צְלָלִים",["אֵין צֵל בִּכְלָל","הַצֵּל נַעֲשֶׂה צִבְעוֹנִי","נוֹצָר צֵל אֶחָד גָּדוֹל בִּלְבַד"]],
  ["מָה צָרִיךְ כְּדֵי לְשַׂחֵק בִּצְלָלִים עַל הַקִּיר?","חֶדֶר חָשׁוּךְ, פָּנָס וְיָדַיִם",["שֶׁמֶשׁ חֲזָקָה וּמַיִם","מַרְאָה גְּדוֹלָה","צְבָעִים וּמִכְחוֹל"]]
 ]},
{id:"lastgame", icon:"🏀", title:"הַמִּשְׂחָק הָאַחֲרוֹן",
 text:"נָדָב הָיָה הַקָּלָע הַטּוֹב בְּיוֹתֵר בִּקְבוּצַת הַכַּדּוּרְסַל שֶׁל בֵּית הַסֵּפֶר. בְּכָל מִשְׂחָק הוּא קָלַע אֶת רֹב הַסַּלִּים. הוּא גַּם יָדַע אֶת זֶה, וְכִמְעַט לֹא מָסַר לַאֲחֵרִים.\nבְּמִשְׂחַק הַגְּמָר, הַקְּבוּצָה הַיְּרִיבָה הֵבִינָה אֶת זֶה מַהֵר. שְׁנֵי שׁוֹמְרִים נִצְמְדוּ אֶל נָדָב לְכָל אֹרֶךְ הַמִּגְרָשׁ. בְּכָל פַּעַם שֶׁקִּבֵּל אֶת הַכַּדּוּר, הֵם חָסְמוּ אוֹתוֹ. הוּא זָרַק מֵרָחוֹק וְהֶחְטִיא, שׁוּב וָשׁוּב.\nבַּמַּחֲצִית הַקְּבוּצָה פִּגְּרָה בְּעֶשֶׂר נְקֻדּוֹת. הַמְּאַמֶּנֶת אָסְפָה אֶת כֻּלָּם וְאָמְרָה: כְּשֶׁשְּׁנַיִם שׁוֹמְרִים עַל שַׂחְקָן אֶחָד, מִישֶׁהוּ אַחֵר נִשְׁאָר פָּנוּי. נָדָב, מִי פָּנוּי?\nנָדָב חָשַׁב. לְיַד הַסַּל עָמְדָה כָּל הַזְּמַן רוֹנִית, הַנְּמוּכָה בַּקְּבוּצָה. אַף אֶחָד לֹא שָׁמַר עָלֶיהָ. הוּא מֵעוֹלָם לֹא מָסַר לָהּ.\nבַּמַּחֲצִית הַשְּׁנִיָּה, כְּשֶׁהַשּׁוֹמְרִים סָגְרוּ עָלָיו, נָדָב מָסַר לְרוֹנִית. הִיא קָלְעָה. וְשׁוּב. וְשׁוּב. הַשּׁוֹמְרִים הִתְבַּלְבְּלוּ: אֶחָד רָץ אֶל רוֹנִית, וְאָז נָדָב נִשְׁאַר פָּנוּי וְקָלַע בְּעַצְמוֹ.\nשְׁנִיּוֹת לִפְנֵי הַסִּיּוּם הַתּוֹצָאָה הָיְתָה שָׁוָה. הַכַּדּוּר הָיָה בַּיָּדַיִם שֶׁל נָדָב. כָּל הַקָּהָל צָעַק: תִּזְרֹק! הוּא רָאָה אֶת רוֹנִית פְּנוּיָה מִתַּחַת לַסַּל, וּמָסַר. הַכַּדּוּר נִכְנַס עִם הַצְּפִירָה.\nבַּסּוֹף שָׁאֲלוּ אֶת נָדָב כַּמָּה נְקֻדּוֹת קָלַע. הוּא אָמַר: פָּחוֹת מִתָּמִיד. אֲבָל זֹאת הַפַּעַם הָרִאשׁוֹנָה שֶׁזָּכִינוּ בַּגָּבִיעַ.",
 qs:[
  ["בְּמָה הִצְטַיֵּן נָדָב?","בִּקְלִיעָה לַסַּל",["בִּשְׁמִירָה","בְּרִיצָה","בִּמְסִירוֹת"]],
  ["מָה הָיְתָה הַחֻלְשָׁה שֶׁל נָדָב?","הוּא כִּמְעַט לֹא מָסַר לַאֲחֵרִים",["הוּא רָץ לְאַט","הוּא פָּחַד מֵהַכַּדּוּר","הוּא אִחֵר לָאִמּוּנִים"]],
  ["מָה עָשְׂתָה הַקְּבוּצָה הַיְּרִיבָה?","שָׂמָה שְׁנֵי שׁוֹמְרִים עַל נָדָב",["שָׁמְרָה עַל רוֹנִית","הֶחְלִיפָה אֶת כָּל הַשַּׂחְקָנִים","וִתְּרָה עַל הַמִּשְׂחָק"]],
  ["מָה הָיָה הַמַּצָּב בַּמַּחֲצִית?","הַקְּבוּצָה שֶׁל נָדָב פִּגְּרָה בְּעֶשֶׂר נְקֻדּוֹת",["הַקְּבוּצָה שֶׁל נָדָב הוֹבִילָה","הַתּוֹצָאָה הָיְתָה שָׁוָה","הַמִּשְׂחָק הֻפְסַק"]],
  ["מָה הִסְבִּירָה הַמְּאַמֶּנֶת?","שֶׁכְּשֶׁשְּׁנַיִם שׁוֹמְרִים עַל אֶחָד, מִישֶׁהוּ אַחֵר פָּנוּי",["שֶׁנָּדָב צָרִיךְ לִזְרֹק יוֹתֵר","שֶׁצָּרִיךְ לָרוּץ מַהֵר יוֹתֵר","שֶׁהַשּׁוֹפֵט טוֹעֶה"]],
  ["מִי הָיְתָה פְּנוּיָה לְיַד הַסַּל?","רוֹנִית",["הַמְּאַמֶּנֶת","שַׂחְקָנִית מֵהַקְּבוּצָה הַיְּרִיבָה","אַף אֶחָד"]],
  ["מָה עָשָׂה נָדָב בַּשְּׁנִיּוֹת הָאַחֲרוֹנוֹת?","מָסַר לְרוֹנִית, וְהִיא קָלְעָה",["זָרַק בְּעַצְמוֹ וְהֶחְטִיא","הֶחֱזִיק אֶת הַכַּדּוּר","מָסַר לַמְּאַמֶּנֶת"]],
  ["מָה לָמַד נָדָב?","שֶׁקְּבוּצָה מְנַצַּחַת כְּשֶׁמְּשַׂחֲקִים יַחַד",["שֶׁהוּא כְּבָר לֹא קָלָע טוֹב","שֶׁעָדִיף לֹא לְהִשְׁתַּתֵּף בִּגְמָר","שֶׁרוֹנִית טוֹבָה מִמֶּנּוּ"]]
