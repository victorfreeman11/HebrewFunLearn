  ["מָה עוֹשֶׂה הַיַּנְשׁוּף כְּדֵי לְהִסְתַּכֵּל הַצִּדָּה?","מְסוֹבֵב אֶת כָּל הָרֹאשׁ",["מֵזִיז אֶת הָעֵינַיִם","עָף לְמָקוֹם אַחֵר","קוֹפֵץ בַּמָּקוֹם"]],
  ["לָמָּה הַיַּנְשׁוּף עָף כִּמְעַט בְּלִי קוֹל?","כִּי הַנּוֹצוֹת שֶׁלּוֹ רַכּוֹת מְאוֹד",["כִּי הוּא עָף לְאַט","כִּי הוּא קָטָן","כִּי הוּא עָף רַק בְּרוּחַ"]],
  ["בְּמָה עוֹזֶרֶת לַיַּנְשׁוּף הַטִּיסָה הַשְּׁקֵטָה?","הָעַכְבָּר אֵינוֹ שׁוֹמֵעַ אוֹתוֹ מִתְקָרֵב",["הוּא יָכוֹל לִישֹׁן בִּזְמַן הַטִּיסָה","הוּא עָף מַהֵר יוֹתֵר","הוּא אֵינוֹ מִתְעַיֵּף"]],
  ["מָה אוֹכֵל הַיַּנְשׁוּף?","עַכְבָּרִים, חֲרָקִים וְצִפּוֹרִים קְטַנּוֹת",["גַּרְעִינִים וּפֵרוֹת","דָּגִים בִּלְבַד","עָלִים"]],
  ["לָמָּה הַחַקְלָאִים אוֹהֲבִים יַנְשׁוּפִים?","כִּי הֵם אוֹכְלִים עַכְבָּרִים שֶׁמַּזִּיקִים לַשָּׂדוֹת",["כִּי הֵם שָׁרִים יָפֶה","כִּי הֵם שׁוֹמְרִים עַל הַבַּיִת","כִּי הֵם מְעִירִים אוֹתָם בַּבֹּקֶר"]]

{id:"deadsea", icon:"🌊", title:"יָם הַמֶּלַח",
 text:"יָם הַמֶּלַח הוּא הַמָּקוֹם הַנָּמוּךְ בְּיוֹתֵר בָּעוֹלָם. הוּא נִמְצָא בַּמִּדְבָּר, בֵּין יִשְׂרָאֵל לְיַרְדֵּן. לַמְרוֹת הַשֵּׁם שֶׁלּוֹ, הוּא אֵינֶנּוּ יָם אֲמִתִּי אֶלָּא אֲגַם גָּדוֹל.\nהַמַּיִם בְּיָם הַמֶּלַח מְלוּחִים מְאוֹד, הַרְבֵּה יוֹתֵר מֵהַמַּיִם בַּיָּם הָרָגִיל. בִּגְלַל הַמֶּלַח הָרַב, דָּגִים וּצְמָחִים אֵינָם יְכוֹלִים לִחְיוֹת בּוֹ. לָכֵן קוֹרְאִים לוֹ בְּשָׂפוֹת אֲחֵרוֹת הַיָּם הַמֵּת.\nבְּיָם הַמֶּלַח קוֹרֶה דָּבָר מְיֻחָד: אֲנָשִׁים צָפִים עַל הַמַּיִם בְּלִי לִשְׂחוֹת! הַמֶּלַח הוֹפֵךְ אֶת הַמַּיִם לִכְבֵדִים, וְהֵם מַחֲזִיקִים אֶת הַגּוּף לְמַעְלָה. אֶפְשָׁר לִשְׁכַּב עַל הַגַּב וְלִקְרֹא עִתּוֹן.\nאֲבָל צָרִיךְ לְהִזָּהֵר: אָסוּר שֶׁהַמַּיִם יִכָּנְסוּ לָעֵינַיִם, כִּי זֶה שׂוֹרֵף מְאוֹד.\nבַּשָּׁנִים הָאַחֲרוֹנוֹת יָם הַמֶּלַח הוֹלֵךְ וְקָטֵן, כִּי פָּחוֹת מַיִם מַגִּיעִים אֵלָיו מִנְּהַר הַיַּרְדֵּן.",
 qs:[
  ["מָה מְיֻחָד בַּמָּקוֹם שֶׁל יָם הַמֶּלַח?","הוּא הַמָּקוֹם הַנָּמוּךְ בְּיוֹתֵר בָּעוֹלָם",["הוּא הַמָּקוֹם הַגָּבוֹהַּ בְּיוֹתֵר בָּעוֹלָם","הוּא הַמָּקוֹם הַקַּר בְּיוֹתֵר בָּעוֹלָם","הוּא נִמְצָא בְּתוֹךְ יַעַר"]],
  ["מָה הוּא יָם הַמֶּלַח בֶּאֱמֶת?","אֲגַם גָּדוֹל",["יָם אֲמִתִּי","נָהָר אָרֹךְ","בְּרֵכַת שְׂחִיָּה"]],

{id:"hedgehog", icon:"🦔", title:"הַקִּפּוֹד",
 text:"הַקִּפּוֹד הוּא חַיָּה קְטַנָּה שֶׁגָּרָה בְּגִנּוֹת, בְּשָׂדוֹת וּבְחֻרְשׁוֹת. עַל הַגַּב שֶׁלּוֹ יֵשׁ אַלְפֵי קוֹצִים חַדִּים. הַבֶּטֶן שֶׁלּוֹ רַכָּה וּמְכֻסָּה פַּרְוָה.\nכְּשֶׁהַקִּפּוֹד מַרְגִּישׁ סַכָּנָה, הוּא מִתְגַּלְגֵּל לְכַדּוּר. כָּךְ כָּל הַקּוֹצִים פּוֹנִים הַחוּצָה, וְהַבֶּטֶן הָרַכָּה מוּגֶנֶת בִּפְנִים. שׁוּעָל אוֹ כֶּלֶב שֶׁיְּנַסּוּ לָגַעַת בּוֹ יִדָּקְרוּ וְיֵלְכוּ מִשָּׁם.\nהַקִּפּוֹד יָשֵׁן בַּיּוֹם וְיוֹצֵא לְחַפֵּשׂ אֹכֶל בַּלַּיְלָה. הוּא אֵינוֹ רוֹאֶה טוֹב, אֲבָל יֵשׁ לוֹ חוּשׁ רֵיחַ מְצֻיָּן. הוּא אוֹכֵל חִפּוּשִׁיּוֹת, תּוֹלָעִים, חֶלְזוֹנוֹת וַאֲפִלּוּ נְחָשִׁים קְטַנִּים.\nגַּנָּנִים אוֹהֲבִים קִפּוֹדִים, כִּי הֵם אוֹכְלִים מַזִּיקִים שֶׁהוֹרְסִים אֶת הַצְּמָחִים.\nאִם תִּפְגְּשׁוּ קִפּוֹד בַּגִּנָּה, אַל תַּאֲכִילוּ אוֹתוֹ בְּחָלָב. חָלָב גּוֹרֵם לוֹ לִכְאֵב בֶּטֶן. עָדִיף לְהַשְׁאִיר לוֹ קַעֲרִית עִם מַיִם.",
 qs:[
  ["אֵיפֹה גָּר הַקִּפּוֹד?","בְּגִנּוֹת, בְּשָׂדוֹת וּבְחֻרְשׁוֹת",["בַּיָּם","עַל רָאשֵׁי הָעֵצִים","בַּמִּדְבָּר בִּלְבַד"]],
  ["מָה יֵשׁ עַל הַגַּב שֶׁל הַקִּפּוֹד?","אַלְפֵי קוֹצִים חַדִּים",["פַּרְוָה רַכָּה","נוֹצוֹת","שִׁרְיוֹן קָשֶׁה"]],
  ["מָה עוֹשֶׂה הַקִּפּוֹד כְּשֶׁהוּא מַרְגִּישׁ סַכָּנָה?","מִתְגַּלְגֵּל לְכַדּוּר",["בּוֹרֵחַ מַהֵר","מְטַפֵּס עַל עֵץ","נוֹבֵחַ בְּקוֹל"]],
  ["עַל אֵיזֶה חֵלֶק בַּגּוּף שׁוֹמֵר הַקִּפּוֹד כְּשֶׁהוּא מִתְגַּלְגֵּל?","עַל הַבֶּטֶן הָרַכָּה",["עַל הַקּוֹצִים","עַל הַזָּנָב","עַל הָאָזְנַיִם"]],
  ["מָתַי הַקִּפּוֹד מְחַפֵּשׂ אֹכֶל?","בַּלַּיְלָה",["בַּבֹּקֶר","בַּצָּהֳרַיִם","רַק בַּחֹרֶף"]],
  ["אֵיזֶה חוּשׁ טוֹב מְאוֹד אֵצֶל הַקִּפּוֹד?","חוּשׁ הָרֵיחַ",["חוּשׁ הָרְאִיָּה","חוּשׁ הַטַּעַם","חוּשׁ הַמִּשּׁוּשׁ"]],
  ["לָמָּה גַּנָּנִים אוֹהֲבִים קִפּוֹדִים?","כִּי הֵם אוֹכְלִים מַזִּיקִים",["כִּי הֵם מַשְׁקִים אֶת הַצְּמָחִים","כִּי הֵם חוֹפְרִים בּוֹרוֹת","כִּי הֵם שׁוֹמְרִים עַל הַבַּיִת"]],
  ["מָה כְּדַאי לָתֵת לְקִפּוֹד שֶׁפּוֹגְשִׁים בַּגִּנָּה?","קַעֲרִית עִם מַיִם",["חָלָב","שׁוֹקוֹלָד","לֶחֶם עִם רִבָּה"]]
 ]},
{id:"bike", icon:"🚲", title:"הָאוֹפַנַּיִם שֶׁל אוּרִי",
 text:"לְיוֹם הַהֻלֶּדֶת הַשְּׁבִיעִי קִבֵּל אוּרִי אוֹפַנַּיִם כְּחֻלִּים, בְּלִי גַּלְגַּלֵּי עֵזֶר. הוּא שָׂמַח מְאוֹד, אֲבָל גַּם פָּחַד קְצָת. הוּא עוֹד לֹא יָדַע לִרְכֹּב עַל שְׁנֵי גַּלְגַּלִּים.\nבְּיוֹם שִׁשִּׁי יָרְדוּ אוּרִי וְאִמָּא לַשְּׁבִיל שֶׁלְּיַד הַבַּיִת. אוּרִי חָבַשׁ קַסְדָּה וְעָלָה עַל הָאוֹפַנַּיִם. אִמָּא הֶחֱזִיקָה אֶת הַכִּסֵּא מֵאָחוֹר וְרָצָה לְיָדוֹ.\nבַּפַּעַם הָרִאשׁוֹנָה אוּרִי נָפַל וְקִבֵּל שְׂרִיטָה בַּבֶּרֶךְ. הוּא רָצָה לַחְזֹר הַבַּיְתָה. אִמָּא אָמְרָה: כָּל מִי שֶׁלּוֹמֵד לִרְכֹּב נוֹפֵל כַּמָּה פְּעָמִים. גַּם אֲנִי נָפַלְתִּי כְּשֶׁהָיִיתִי יַלְדָּה.\nאוּרִי נִסָּה שׁוּב וְשׁוּב. אַחֲרֵי שָׁעָה הוּא צָעַק: אִמָּא, אַל תַּעַזְבִי! וְאָז שָׁמַע אֶת הַקּוֹל שֶׁלָּהּ מֵרָחוֹק: עָזַבְתִּי מִזְּמַן!\nאוּרִי הִסְתּוֹבֵב וְרָאָה שֶׁאִמָּא עוֹמֶדֶת בִּתְחִלַּת הַשְּׁבִיל וּמוֹחֵאת כַּפַּיִם. הוּא רָכַב לְבַד!",
 qs:[
  ["מָה קִבֵּל אוּרִי לְיוֹם הַהֻלֶּדֶת?","אוֹפַנַּיִם כְּחֻלִּים",["קַסְדָּה אֲדֻמָּה","כַּדּוּר רֶגֶל","קוֹרְקִינֶט"]],
  ["בֶּן כַּמָּה הָיָה אוּרִי?","בֶּן שֶׁבַע",["בֶּן חָמֵשׁ","בֶּן שֵׁשׁ","בֶּן תֵּשַׁע"]],
  ["לָמָּה אוּרִי פָּחַד קְצָת?","כִּי לֹא יָדַע לִרְכֹּב עַל שְׁנֵי גַּלְגַּלִּים",["כִּי הָאוֹפַנַּיִם הָיוּ גְּדוֹלִים מִדַּי","כִּי הָיָה חֹשֶׁךְ בַּחוּץ","כִּי אִמָּא כָּעֲסָה"]],
  ["אֵיךְ עָזְרָה אִמָּא לְאוּרִי בַּהַתְחָלָה?","הֶחֱזִיקָה אֶת הַכִּסֵּא מֵאָחוֹר",["רָכְבָה לְפָנָיו","הִרְכִּיבָה גַּלְגַּלֵּי עֵזֶר","דָּחֲפָה אוֹתוֹ בַּיָּדַיִם מִלְּפָנִים"]],
  ["מָה קָרָה בַּפַּעַם הָרִאשׁוֹנָה?","אוּרִי נָפַל וְנִשְׂרַט בַּבֶּרֶךְ",["אוּרִי רָכַב לְבַד מִיָּד","הָאוֹפַנַּיִם נִשְׁבְּרוּ","אִמָּא נָפְלָה"]],
  ["מָה אָמְרָה אִמָּא כְּשֶׁאוּרִי רָצָה לַחְזֹר הַבַּיְתָה?","שֶׁכָּל מִי שֶׁלּוֹמֵד לִרְכֹּב נוֹפֵל כַּמָּה פְּעָמִים",["שֶׁהִגִּיעַ הַזְּמַן לֶאֱכֹל","שֶׁהוּא קָטָן מִדַּי לָאוֹפַנַּיִם","שֶׁיְּנַסּוּ שׁוּב בַּשָּׁנָה הַבָּאָה"]],
  ["אֵיפֹה עָמְדָה אִמָּא כְּשֶׁאוּרִי הִסְתּוֹבֵב?","בִּתְחִלַּת הַשְּׁבִיל",["מַמָּשׁ מֵאֲחוֹרָיו","בְּתוֹךְ הַבַּיִת","עַל הָאוֹפַנַּיִם שֶׁלָּהּ"]],
  ["מָה אֶפְשָׁר לִלְמֹד מֵהַסִּפּוּר?","שֶׁמִּי שֶׁמְּנַסֶּה שׁוּב וְשׁוּב מַצְלִיחַ בַּסּוֹף",["שֶׁאָסוּר לִרְכֹּב עַל אוֹפַנַּיִם","שֶׁתָּמִיד צָרִיךְ גַּלְגַּלֵּי עֵזֶר","שֶׁעָדִיף לֹא לְנַסּוֹת דְּבָרִים חֲדָשִׁים"]]
 ]},
{id:"moon", icon:"🌙", title:"הַיָּרֵחַ",
 text:"הַיָּרֵחַ הוּא הַשָּׁכֵן הַקָּרוֹב בְּיוֹתֵר שֶׁל כַּדּוּר הָאָרֶץ בֶּחָלָל. הוּא מַקִּיף אֶת כַּדּוּר הָאָרֶץ, וְכָל הַקָּפָה נִמְשֶׁכֶת בְּעֵרֶךְ חֹדֶשׁ.\nהַיָּרֵחַ אֵינוֹ מֵאִיר בְּעַצְמוֹ. הוּא כְּמוֹ מַרְאָה גְּדוֹלָה: אוֹר הַשֶּׁמֶשׁ פּוֹגֵעַ בּוֹ וְחוֹזֵר אֵלֵינוּ. לָכֵן אֲנַחְנוּ רוֹאִים אוֹתוֹ זוֹהֵר בַּלַּיְלָה.\nבְּכָל לַיְלָה הַיָּרֵחַ נִרְאֶה קְצָת אַחֶרֶת. לִפְעָמִים הוּא עָגֹל וּמָלֵא, לִפְעָמִים הוּא דַּק כְּמוֹ בָּנָנָה, וְלִפְעָמִים אֵינֶנּוּ רוֹאִים אוֹתוֹ בִּכְלָל. הַיָּרֵחַ עַצְמוֹ לֹא מִשְׁתַּנֶּה. מָה שֶׁמִּשְׁתַּנֶּה הוּא הַחֵלֶק הַמּוּאָר שֶׁאֲנַחְנוּ רוֹאִים.\nעַל הַיָּרֵחַ אֵין אֲוִיר, אֵין מַיִם וְאֵין צְמָחִים. יֵשׁ בּוֹ הָרִים וּמַכְתְּשִׁים רַבִּים, שֶׁנּוֹצְרוּ כְּשֶׁסְּלָעִים מִן הֶחָלָל פָּגְעוּ בּוֹ.\nלִפְנֵי יוֹתֵר מֵחֲמִשִּׁים שָׁנָה נָחֲתוּ בְּנֵי אָדָם עַל הַיָּרֵחַ בַּפַּעַם הָרִאשׁוֹנָה. הֵם קָפְצוּ עָלָיו בְּקַלּוּת, כִּי עַל הַיָּרֵחַ כָּל דָּבָר שׁוֹקֵל הַרְבֵּה פָּחוֹת.",
 qs:[
  ["סְבִיב מָה מִסְתּוֹבֵב הַיָּרֵחַ?","סְבִיב כַּדּוּר הָאָרֶץ",["סְבִיב הַשֶּׁמֶשׁ בִּלְבַד","סְבִיב הַכּוֹכָבִים","הוּא אֵינוֹ זָז"]],
  ["כַּמָּה זְמַן נִמְשֶׁכֶת הַקָּפָה אַחַת שֶׁל הַיָּרֵחַ?","בְּעֵרֶךְ חֹדֶשׁ",["יוֹם אֶחָד","שָׁבוּעַ","שָׁנָה"]],
  ["מֵאֵיפֹה מַגִּיעַ הָאוֹר שֶׁל הַיָּרֵחַ?","מֵהַשֶּׁמֶשׁ",["מֵהַיָּרֵחַ עַצְמוֹ","מֵהַכּוֹכָבִים","מִכַּדּוּר הָאָרֶץ"]],
  ["לְמָה מְדַמֶּה הַקֶּטַע אֶת הַיָּרֵחַ?","לְמַרְאָה גְּדוֹלָה",["לְפָנָס","לְנֵר","לְמְדוּרָה"]],
  ["לָמָּה הַיָּרֵחַ נִרְאֶה אַחֶרֶת בְּכָל לַיְלָה?","כִּי אֲנַחְנוּ רוֹאִים חֵלֶק מוּאָר אַחֵר שֶׁלּוֹ",["כִּי הוּא גָּדֵל וְקָטֵן בֶּאֱמֶת","כִּי עֲנָנִים אוֹכְלִים אוֹתוֹ","כִּי הוּא מִתְקָרֵב וּמִתְרַחֵק"]],
  ["מָה אֵין עַל הַיָּרֵחַ?","אֲוִיר, מַיִם וּצְמָחִים",["הָרִים","מַכְתְּשִׁים","סְלָעִים"]],
  ["אֵיךְ נוֹצְרוּ הַמַּכְתְּשִׁים עַל הַיָּרֵחַ?","סְלָעִים מִן הֶחָלָל פָּגְעוּ בּוֹ",["בְּנֵי אָדָם חָפְרוּ אוֹתָם","גֶּשֶׁם חָזָק יָרַד עָלָיו","חַיּוֹת חָפְרוּ מְחִלּוֹת"]],
  ["לָמָּה הָאֲנָשִׁים קָפְצוּ עַל הַיָּרֵחַ בְּקַלּוּת?","כִּי שָׁם כָּל דָּבָר שׁוֹקֵל פָּחוֹת",["כִּי הָיוּ לָהֶם קְפִיצִים בַּנַּעֲלַיִם","כִּי הָרוּחַ עָזְרָה לָהֶם","כִּי הָאֲדָמָה שָׁם רַכָּה כְּמוֹ מִזְרָן"]]
 ]},
{id:"library", icon:"📚", title:"הַסֵּפֶר מֵהַסִּפְרִיָּה",
 text:"מַיָּה אָהֲבָה מְאוֹד לִקְרֹא. בְּכָל יוֹם שְׁלִישִׁי הִיא הָלְכָה לַסִּפְרִיָּה וְלָקְחָה סֵפֶר חָדָשׁ. הַשָּׁבוּעַ הִיא לָקְחָה סֵפֶר עַל סוּסִים.\nבְּיוֹם שִׁשִּׁי מַיָּה קָרְאָה בַּגִּנָּה. פִּתְאוֹם הִתְחִיל לָרֶדֶת גֶּשֶׁם, וְהִיא רָצָה הַבַּיְתָה. אֶת הַסֵּפֶר הִיא שָׁכְחָה עַל הַסַּפְסָל.\nבַּבֹּקֶר מָצְאָה מַיָּה אֶת הַסֵּפֶר רָטֹב לְגַמְרֵי. הַדַּפִּים הָיוּ מְקֻמָּטִים וּדְבוּקִים. מַיָּה נִבְהֲלָה. הִיא חָשְׁבָה לְהַחְזִיר אֶת הַסֵּפֶר בְּשֶׁקֶט וְלֹא לְסַפֵּר לְאַף אֶחָד.\nאֲבָל בַּלַּיְלָה הִיא לֹא הִצְלִיחָה לְהֵרָדֵם. בְּיוֹם שְׁלִישִׁי הִיא נִגְּשָׁה לַסַּפְרָנִית, רוּת, וְאָמְרָה בְּקוֹל שָׁקֵט: הַסֵּפֶר נִרְטַב בַּגֶּשֶׁם בִּגְלָלִי. אֲנִי מִצְטַעֶרֶת.\nרוּת חִיְּכָה וְאָמְרָה: תּוֹדָה שֶׁסִּפַּרְתְּ לִי אֶת הָאֱמֶת. בּוֹאִי נְתַקֵּן אוֹתוֹ בְּיַחַד. הֵן יִבְּשׁוּ אֶת הַדַּפִּים וְהִדְבִּיקוּ אֶת הַכְּרִיכָה. מֵאָז מַיָּה עוֹזֶרֶת לְרוּת בַּסִּפְרִיָּה בְּכָל שָׁבוּעַ.",
 qs:[
  ["מָתַי הָלְכָה מַיָּה לַסִּפְרִיָּה?","בְּכָל יוֹם שְׁלִישִׁי",["בְּכָל יוֹם שִׁשִּׁי","בְּכָל יוֹם רִאשׁוֹן","פַּעַם בְּחֹדֶשׁ"]],
  ["עַל מָה הָיָה הַסֵּפֶר שֶׁמַּיָּה לָקְחָה?","עַל סוּסִים",["עַל כְּלָבִים","עַל גֶּשֶׁם","עַל סִפְרִיּוֹת"]],
  ["אֵיפֹה שָׁכְחָה מַיָּה אֶת הַסֵּפֶר?","עַל הַסַּפְסָל בַּגִּנָּה",["בַּסִּפְרִיָּה","בְּבֵית הַסֵּפֶר","בָּאוֹטוֹבּוּס"]],
  ["מָה קָרָה לַסֵּפֶר?","הוּא נִרְטַב בַּגֶּשֶׁם",["הוּא נִקְרַע עַל יְדֵי כֶּלֶב","הוּא נֶעֱלַם","הוּא נִשְׂרַף"]],
  ["מָה חָשְׁבָה מַיָּה לַעֲשׂוֹת בַּהַתְחָלָה?","לְהַחְזִיר אֶת הַסֵּפֶר בְּלִי לְסַפֵּר",["לִקְנוֹת סֵפֶר חָדָשׁ","לִזְרֹק אֶת הַסֵּפֶר","לְסַפֵּר מִיָּד לַסַּפְרָנִית"]],
  ["לָמָּה מַיָּה לֹא הִצְלִיחָה לְהֵרָדֵם?","כִּי הִרְגִּישָׁה שֶׁלֹּא נָכוֹן לְהַסְתִּיר אֶת הָאֱמֶת",["כִּי הָיָה רַעַשׁ שֶׁל גֶּשֶׁם","כִּי קָרְאָה סֵפֶר מַפְחִיד","כִּי לֹא הָיְתָה עֲיֵפָה"]],
  ["אֵיךְ הֵגִיבָה רוּת הַסַּפְרָנִית?","הוֹדְתָה לְמַיָּה עַל הָאֱמֶת וְהִצִּיעָה לְתַקֵּן בְּיַחַד",["כָּעֲסָה וְצָעֲקָה","אָסְרָה עַל מַיָּה לָקַחַת סְפָרִים","בִּקְּשָׁה כֶּסֶף"]],
  ["מָה עוֹשָׂה מַיָּה מֵאָז?","עוֹזֶרֶת לְרוּת בַּסִּפְרִיָּה",["לֹא בָּאָה יוֹתֵר לַסִּפְרִיָּה","קוֹרֵאת רַק בַּבַּיִת","כּוֹתֶבֶת סְפָרִים"]]
 ]},
{id:"olive", icon:"🌳", title:"עֵץ הַזַּיִת",
 text:"עֵץ הַזַּיִת הוּא אֶחָד הָעֵצִים הָעַתִּיקִים בְּאֶרֶץ יִשְׂרָאֵל. הוּא גָּדֵל לְאַט מְאוֹד, אֲבָל חַי שָׁנִים רַבּוֹת. יֵשׁ עֲצֵי זַיִת שֶׁהֵם בְּנֵי יוֹתֵר מֵאֶלֶף שָׁנָה!\nהַגֶּזַע שֶׁל עֵץ הַזַּיִת עָבֶה וּמְפֻתָּל, וְהֶעָלִים שֶׁלּוֹ קְטַנִּים. מִצַּד אֶחָד הֶעָלֶה יָרֹק, וּמֵהַצַּד הַשֵּׁנִי הוּא כַּסְפִּי. הָעֵץ נִשְׁאָר יָרֹק כָּל הַשָּׁנָה, גַּם בַּחֹרֶף.\nעֵץ הַזַּיִת אֵינוֹ צָרִיךְ הַרְבֵּה מַיִם. הַשָּׁרָשִׁים שֶׁלּוֹ אֲרֻכִּים וּמַגִּיעִים עָמֹק לָאֲדָמָה. לָכֵן הוּא יָכוֹל לִגְדֹּל גַּם בִּמְקוֹמוֹת יְבֵשִׁים.\nבַּסְּתָיו מַבְשִׁילִים הַזֵּיתִים, וְאָז מַגִּיעַ הַמָּסִיק. בַּמָּסִיק פּוֹרְשִׂים יְרִיעוֹת מִתַּחַת לָעֵץ וּמַכִּים בָּעֲנָפִים בְּמַקְלוֹת, עַד שֶׁהַזֵּיתִים נוֹפְלִים.\nחֵלֶק מֵהַזֵּיתִים כּוֹבְשִׁים בְּמֶלַח וְאוֹכְלִים. אֶת רֹב הַזֵּיתִים לוֹקְחִים לְבֵית הַבַּד, וְשָׁם סוֹחֲטִים מֵהֶם שֶׁמֶן זַיִת.\nעֲנַף הַזַּיִת הוּא גַּם סֵמֶל לְשָׁלוֹם.",
 qs:[
  ["אֵיךְ גָּדֵל עֵץ הַזַּיִת?","לְאַט מְאוֹד",["מַהֵר מְאוֹד","רַק בַּקַּיִץ","רַק לְיַד נְהָרוֹת"]],
  ["בְּנֵי כַּמָּה יְכוֹלִים לִהְיוֹת עֲצֵי זַיִת?","יוֹתֵר מֵאֶלֶף שָׁנָה",["עֶשֶׂר שָׁנִים בִּלְבַד","מֵאָה יָמִים","שָׁנָה אַחַת"]],
  ["אֵיךְ נִרְאִים הֶעָלִים שֶׁל עֵץ הַזַּיִת?","יְרֻקִּים מִצַּד אֶחָד וְכַסְפִּיִּים מֵהַצַּד הַשֵּׁנִי",["אֲדֻמִּים וּגְדוֹלִים","צְהֻבִּים בַּחֹרֶף","שְׁחֹרִים וַעֲגֻלִּים"]],
  ["לָמָּה עֵץ הַזַּיִת יָכוֹל לִגְדֹּל בִּמְקוֹמוֹת יְבֵשִׁים?","כִּי הַשָּׁרָשִׁים שֶׁלּוֹ מַגִּיעִים עָמֹק לָאֲדָמָה",["כִּי הֶעָלִים שֶׁלּוֹ גְּדוֹלִים","כִּי מַשְׁקִים אוֹתוֹ בְּכָל יוֹם","כִּי הוּא אוֹגֵר מַיִם בַּזֵּיתִים"]],
  ["מָתַי מַבְשִׁילִים הַזֵּיתִים?","בַּסְּתָיו",["בָּאָבִיב","בַּקַּיִץ","בְּאֶמְצַע הַחֹרֶף"]],
  ["מָה זֶה מָסִיק?","אִסּוּף הַזֵּיתִים מֵהָעֵץ",["הַשְׁקָיַת הָעֵץ","שְׁתִילַת עֵץ חָדָשׁ","סְחִיטַת הַשֶּׁמֶן"]],
  ["מָה עוֹשִׂים בְּבֵית הַבַּד?","סוֹחֲטִים שֶׁמֶן מֵהַזֵּיתִים",["אוֹפִים לֶחֶם","תּוֹפְרִים בְּגָדִים","כּוֹבְשִׁים זֵיתִים בְּמֶלַח"]],
  ["שֶׁל מָה עֲנַף הַזַּיִת הוּא סֵמֶל?","שֶׁל שָׁלוֹם",["שֶׁל מִלְחָמָה","שֶׁל חֹרֶף","שֶׁל עֹשֶׁר"]]
 ]},
{id:"umbrella", icon:"☔", title:"הַמִּטְרִיָּה הָאֲדֻמָּה",
 text:"בַּבֹּקֶר הַשָּׁמַיִם הָיוּ אֲפֹרִים. סָבְתָא אָמְרָה לְיוֹאָב: קַח מִטְרִיָּה, הַיּוֹם יֵרֵד גֶּשֶׁם. יוֹאָב לָקַח אֶת הַמִּטְרִיָּה הָאֲדֻמָּה הַגְּדוֹלָה, אַף עַל פִּי שֶׁהִיא הָיְתָה כְּבֵדָה.\nבַּצָּהֳרַיִם, כְּשֶׁהַלִּמּוּדִים נִגְמְרוּ, יָרַד גֶּשֶׁם חָזָק. יוֹאָב פָּתַח אֶת הַמִּטְרִיָּה וְיָצָא לַדֶּרֶךְ. לְיַד הַשַּׁעַר עָמְדָה נֹגַהּ, יַלְדָּה מֵהַכִּתָּה שֶׁלּוֹ. לֹא הָיְתָה לָהּ מִטְרִיָּה, וְהִיא חִכְּתָה שֶׁהַגֶּשֶׁם יִפָּסֵק.\nיוֹאָב וְנֹגַהּ לֹא הָיוּ חֲבֵרִים. פַּעַם הֵם אֲפִלּוּ רָבוּ עַל מָקוֹם בַּתּוֹר. יוֹאָב הִמְשִׁיךְ לָלֶכֶת כַּמָּה צְעָדִים, וְאָז עָצַר. הוּא חָזַר וְאָמַר: בּוֹאִי, יֵשׁ מָקוֹם לִשְׁנַיִם.\nהֵם הָלְכוּ יַחַד מִתַּחַת לַמִּטְרִיָּה הָאֲדֻמָּה. בַּדֶּרֶךְ גִּלּוּ שֶׁשְּׁנֵיהֶם אוֹהֲבִים לְצַיֵּר וְשֶׁהֵם גָּרִים בְּאוֹתוֹ רְחוֹב.\nלְמָחֳרָת הַשֶּׁמֶשׁ זָרְחָה. נֹגַהּ חִכְּתָה לְיוֹאָב לְיַד הַבַּיִת שֶׁלּוֹ, וְהֵם הָלְכוּ יַחַד לְבֵית הַסֵּפֶר, גַּם בְּלִי מִטְרִיָּה.",
 qs:[
  ["מִי אָמַר לְיוֹאָב לָקַחַת מִטְרִיָּה?","סָבְתָא",["אִמָּא","הַמּוֹרָה","נֹגַהּ"]],
  ["אֵיךְ יָדְעָה סָבְתָא שֶׁיֵּרֵד גֶּשֶׁם?","הַשָּׁמַיִם הָיוּ אֲפֹרִים",["הִיא שָׁמְעָה רַעַם","כְּבָר יָרַד גֶּשֶׁם בַּבֹּקֶר","יוֹאָב אָמַר לָהּ"]],
  ["אֵיזוֹ מִטְרִיָּה לָקַח יוֹאָב?","אֲדֻמָּה, גְּדוֹלָה וּכְבֵדָה",["כְּחֻלָּה וּקְטַנָּה","שְׁחֹרָה וְקַלָּה","צְהֻבָּה וּשְׁבוּרָה"]],
  ["לָמָּה עָמְדָה נֹגַהּ לְיַד הַשַּׁעַר?","כִּי לֹא הָיְתָה לָהּ מִטְרִיָּה",["כִּי חִכְּתָה לְאִמָּא שֶׁלָּהּ","כִּי אִבְּדָה אֶת הַתִּיק","כִּי רָצְתָה לְשַׂחֵק בַּגֶּשֶׁם"]],
  ["מָה קָרָה פַּעַם בֵּין יוֹאָב לְנֹגַהּ?","הֵם רָבוּ עַל מָקוֹם בַּתּוֹר",["הֵם צִיְּרוּ יַחַד","הֵם הָלְכוּ יַחַד לַיָּם","הֵם הֶחְלִיפוּ מִטְרִיּוֹת"]],
  ["מָה עָשָׂה יוֹאָב אַחֲרֵי שֶׁעָצַר?","חָזַר וְהִזְמִין אֶת נֹגַהּ לָלֶכֶת אִתּוֹ",["הִמְשִׁיךְ הַבַּיְתָה לְבַד","נָתַן לָהּ אֶת הַמִּטְרִיָּה וְרָץ","קָרָא לַמּוֹרָה"]],
  ["מָה גִּלּוּ הַיְּלָדִים בַּדֶּרֶךְ?","שֶׁשְּׁנֵיהֶם אוֹהֲבִים לְצַיֵּר וְגָרִים בְּאוֹתוֹ רְחוֹב",["שֶׁהֵם בְּנֵי דּוֹדִים","שֶׁהַמִּטְרִיָּה נִקְרְעָה","שֶׁהֵם אִחֲרוּ הַבַּיְתָה"]],
  ["מָה מַרְאֶה סוֹף הַסִּפּוּר?","שֶׁיוֹאָב וְנֹגַהּ הָפְכוּ לַחֲבֵרִים",["שֶׁשּׁוּב יָרַד גֶּשֶׁם","שֶׁנֹּגַהּ קָנְתָה מִטְרִיָּה","שֶׁיוֹאָב אִבֵּד אֶת הַמִּטְרִיָּה"]]
 ]},
{id:"seaturtle", icon:"🐢", title:"צַב הַיָּם",
 text:"צַב הַיָּם חַי בַּיָּם כִּמְעַט כָּל חַיָּיו. בִּמְקוֹם רַגְלַיִם יֵשׁ לוֹ סְנַפִּירִים, וְהוּא שׂוֹחֶה מַהֵר וּבְקַלּוּת. עַל הַגַּב שֶׁלּוֹ יֵשׁ שִׁרְיוֹן קָשֶׁה שֶׁמֵּגֵן עָלָיו.\nצַב הַיָּם נוֹשֵׁם אֲוִיר, וְלָכֵן הוּא חַיָּב לַעֲלוֹת אֶל פְּנֵי הַמַּיִם מִדֵּי פַּעַם. אֲבָל הוּא יָכוֹל לַעֲצֹר אֶת הַנְּשִׁימָה לִזְמַן רַב, וַאֲפִלּוּ לִישֹׁן מִתַּחַת לַמַּיִם.\nפַּעַם בְּכַמָּה שָׁנִים הַצַּבָּה יוֹצֵאת בַּלַּיְלָה אֶל הַחוֹף. הִיא חוֹפֶרֶת בּוֹר בַּחוֹל, מְטִילָה בּוֹ כְּמֵאָה בֵּיצִים, מְכַסָּה אוֹתָן וְחוֹזֶרֶת לַיָּם. הִיא אֵינָהּ שׁוֹמֶרֶת עַל הַבֵּיצִים.\nאַחֲרֵי כְּחָדְשַׁיִם בּוֹקְעִים צַבִּים קְטַנְטַנִּים. הֵם רָצִים מַהֵר אֶל הַיָּם, כִּי בַּדֶּרֶךְ מְחַכִּים לָהֶם סַרְטָנִים וְצִפּוֹרִים. רַק מְעַטִּים מֵהֶם מַגִּיעִים לַמַּיִם.\nהַיּוֹם צַבֵּי הַיָּם בְּסַכָּנָה. שַׂקִּיּוֹת נַיְלוֹן שֶׁצָּפוֹת בַּיָּם נִרְאוֹת לָהֶם כְּמוֹ מֵדוּזוֹת, וְהֵם בּוֹלְעִים אוֹתָן. לָכֵן חָשׁוּב לֹא לְהַשְׁאִיר אַשְׁפָּה בַּחוֹף.",
 qs:[
  ["מָה יֵשׁ לְצַב הַיָּם בִּמְקוֹם רַגְלַיִם?","סְנַפִּירִים",["כְּנָפַיִם","גַּלְגַּלִּים","זְרוֹעוֹת אֲרֻכּוֹת"]],
  ["לָמָּה צַב הַיָּם עוֹלֶה אֶל פְּנֵי הַמַּיִם?","כְּדֵי לִנְשֹׁם אֲוִיר",["כְּדֵי לֶאֱכֹל","כְּדֵי לְהִתְחַמֵּם","כְּדֵי לִרְאוֹת סְפִינוֹת"]],
  ["מָתַי יוֹצֵאת הַצַּבָּה אֶל הַחוֹף?","בַּלַּיְלָה",["בַּצָּהֳרַיִם","בַּבֹּקֶר","רַק כְּשֶׁיּוֹרֵד גֶּשֶׁם"]],
  ["כַּמָּה בֵּיצִים מְטִילָה הַצַּבָּה?","כְּמֵאָה",["שְׁתַּיִם","עֶשֶׂר","אֶלֶף"]],
  ["מָה עוֹשָׂה הַצַּבָּה אַחֲרֵי שֶׁהִיא מְכַסָּה אֶת הַבֵּיצִים?","חוֹזֶרֶת לַיָּם",["שׁוֹמֶרֶת עֲלֵיהֶן עַד שֶׁיִּבְקְעוּ","יוֹשֶׁבֶת עֲלֵיהֶן","לוֹקַחַת אוֹתָן אִתָּהּ"]],
  ["לָמָּה הַצַּבִּים הַקְּטַנִּים רָצִים מַהֵר אֶל הַיָּם?","כִּי סַרְטָנִים וְצִפּוֹרִים מְחַכִּים לָהֶם בַּדֶּרֶךְ",["כִּי הַחוֹל קַר מִדַּי","כִּי אִמָּא קוֹרֵאת לָהֶם","כִּי הֵם רְעֵבִים מְאוֹד"]],
  ["לָמָּה צַבֵּי הַיָּם בּוֹלְעִים שַׂקִּיּוֹת נַיְלוֹן?","כִּי הֵן נִרְאוֹת לָהֶם כְּמוֹ מֵדוּזוֹת",["כִּי הֵן טְעִימוֹת","כִּי הֵן צִבְעוֹנִיּוֹת","כִּי אֵין לָהֶם אֹכֶל אַחֵר"]],
  ["מָה אֶפְשָׁר לַעֲשׂוֹת כְּדֵי לַעֲזֹר לְצַבֵּי הַיָּם?","לֹא לְהַשְׁאִיר אַשְׁפָּה בַּחוֹף",["לְהַאֲכִיל אוֹתָם בְּלֶחֶם","לָקַחַת אֶת הַבֵּיצִים הַבַּיְתָה","לִבְנוֹת אַרְמוֹנוֹת בַּחוֹל"]]
 ]},
{id:"garden", icon:"🌱", title:"הַגִּנָּה שֶׁל כִּתָּה ב'",
 text:"בִּתְחִלַּת הַשָּׁנָה הוֹדִיעָה הַמּוֹרָה דָּנָה: הַשָּׁנָה נָקִים גִּנַּת יָרָק בַּחֲצַר בֵּית הַסֵּפֶר. כָּל הַיְּלָדִים שָׂמְחוּ, חוּץ מֵעִידוֹ. הוּא חָשַׁב שֶׁגִּנָּה זֶה מְשַׁעֲמֵם.\nהַיְּלָדִים עָדְרוּ אֶת הָאֲדָמָה, הוֹצִיאוּ אֲבָנִים וְזָרְעוּ זְרָעִים שֶׁל צְנוֹנִית, חַסָּה וְגֶזֶר. כָּל קְבוּצָה קִבְּלָה עֲרוּגָה. עִידוֹ הָיָה אַחְרַאי לְהַשְׁקוֹת אֶת הָעֲרוּגָה שֶׁל הַקְּבוּצָה שֶׁלּוֹ.\nבַּשָּׁבוּעַ הָרִאשׁוֹן עִידוֹ שָׁכַח לְהַשְׁקוֹת. בָּעֲרוּגוֹת הָאֲחֵרוֹת כְּבָר נִרְאוּ נְבָטִים יְרֻקִּים קְטַנִּים, אֲבָל בָּעֲרוּגָה שֶׁלּוֹ הָאֲדָמָה נִשְׁאֲרָה חוּמָה וִיבֵשָׁה. הַחֲבֵרִים בַּקְּבוּצָה הָיוּ עֲצוּבִים.\nעִידוֹ הִתְבַּיֵּשׁ. מֵאוֹתוֹ יוֹם הוּא הִגִּיעַ בְּכָל בֹּקֶר רֶבַע שָׁעָה לִפְנֵי כֻּלָּם וְהִשְׁקָה אֶת הָעֲרוּגָה. אַחֲרֵי שָׁבוּעַ הוֹפִיעַ הַנֶּבֶט הָרִאשׁוֹן, וְעִידוֹ קָפַץ מִשִּׂמְחָה.\nכַּעֲבֹר חָדְשַׁיִם הֵכִינָה הַכִּתָּה סָלָט גָּדוֹל מֵהַיְּרָקוֹת שֶׁגִּדְּלָה. עִידוֹ אָמַר שֶׁזֶּה הַסָּלָט הַטָּעִים בְּיוֹתֵר שֶׁאָכַל בַּחַיִּים.",
 qs:[
  ["מָה הוֹדִיעָה הַמּוֹרָה דָּנָה?","שֶׁהַכִּתָּה תָּקִים גִּנַּת יָרָק",["שֶׁיּוֹצְאִים לְטִיּוּל","שֶׁיֵּשׁ מִבְחָן","שֶׁמַּגִּיעַ תַּלְמִיד חָדָשׁ"]],
  ["לָמָּה עִידוֹ לֹא שָׂמַח?","כִּי חָשַׁב שֶׁגִּנָּה זֶה מְשַׁעֲמֵם",["כִּי הוּא לֹא אוֹהֵב יְרָקוֹת","כִּי הָיָה חוֹלֶה","כִּי לֹא קִבֵּל עֲרוּגָה"]],
  ["אֵילוּ זְרָעִים זָרְעוּ הַיְּלָדִים?","צְנוֹנִית, חַסָּה וְגֶזֶר",["עַגְבָנִיָּה, מְלָפְפוֹן וּבָצָל","תַּפּוּחַ, אַגָּס וְתוּת","חִטָּה וְתִירָס"]],

/* ================================================================== monster feed */
// The monster only eats things whose name starts with the target letter.
function monster(){
  ACT = "arcade.monster";
  let target = null, left = 0, missed = false;
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow"></div>
      <button class="btn target" id="tg"></button><div class="grow"></div>${starsHTML()}</div>
    ${mission("", "mm")}
    <div class="grow center"><div class="mon" id="mon">👾</div></div>
    <div class="tray l" id="food" style="padding-bottom:calc(var(--u)*1.5)"></div>`);
  const mon = $("#mon");
  const announce = o => say(`הַמִּפְלֶצֶת רוֹצָה ${target.name}`, o);
  function round(first){
    const lv = level(), groups = {};
    WORDS.forEach(w => { (groups[w.plain[0]] = groups[w.plain[0]] || []).push(w); });
    const ids = Object.keys(groups).filter(c => groups[c].length >= 3).map(c => "letter:" + c);
    target = letter(pick(ids, target && "letter:" + target.id).slice(7));
    const good = shuffle(groups[target.id]).slice(0, lv === 1 ? 2 : 3);
    const bad = shuffle(WORDS.filter(w => w.plain[0] !== target.id)).slice(0, lv === 1 ? 3 : 4);
    left = good.length; missed = false;
    $("#tg").innerHTML = `🔊 <b style="font-size:1.5em">${target.id}</b>`;
    $("#mm").innerHTML = nk(`הַמִּפְלֶצֶת אוֹכֶלֶת רַק מִלִּים שֶׁמַּתְחִילוֹת בָּאוֹת <span style="font-size:1.5em;color:var(--terra)">${target.id}</span> . גִּרְרוּ אוֹתָן אֵלֶיהָ.`);
    $("#food").innerHTML = shuffle(good.concat(bad)).map(w => `<div class="btn white food" data-w="${w.id}">${w.pic}</div>`).join("");
    $$("#food .food").forEach(el => { const w = WORDS.find(x => x.id === el.dataset.w);
      draggable(el, {onTap: () => say(w.nikud, {asset:"word_" + w.id}), onDrop: (x, y) => { if (inside(mon, x, y)) feed(el, w); }}); });
    announce({interrupt: first});
  }
  function feed(el, w){
    say(w.nikud, {asset:"word_" + w.id});                              // always name the food, so the first sound is heard
    if (w.plain[0] !== target.id) { missed = true; nope(); mon.textContent = "😝"; shake(mon); later(() => { mon.textContent = "👾"; }, 700); return; }
    el.style.visibility = "hidden"; left--; thud();
    mon.animate([{transform:"scale(1)"}, {transform:"scale(1.25,.8)"}, {transform:"scale(.9,1.15)"}, {transform:"scale(1)"}], {duration:450});
    if (!left) { answer("letter:" + target.id, !missed); addStars(2); bump(ROUND); burst(mon); yay(); praise(); later(() => round(false), 1900); }
  }
  on("#x", arcade); on("#tg", () => announce());
  round(true);
}

  const words = t => `<div class="line">${fill(t).split(" ").map(w => `<span>${w}</span>`).join("")}</div>`;
  // Read one word, then call back. A timer backs up devices whose voice never reports that it finished.
  function speakThen(text, cb){
    let fired = false; const t0 = Date.now();
    const fin = () => { if (fired) return; fired = true; setTimeout(cb, Math.max(0, 450 - (Date.now() - t0))); };
    const guard = setTimeout(fin, 2000);
    if (!("speechSynthesis" in window) || !voice || (P && P.mute)) return;   // silent: the timer above still moves the highlight along
    const u = new SpeechSynthesisUtterance(text.replace(/[.!?,]/g, "")); u.lang = "he-IL"; if (voice) u.voice = voice; u.rate = .7;
    u.onend = u.onerror = () => { clearTimeout(guard); fin(); };
    speechSynthesis.speak(u);
  }
  function readAll(){                                             // word by word, highlighting each as it is spoken
    const spans = $$("#page .line span"), mine = ++reading; let k = 0;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    const step = () => {
      spans.forEach(s => s.classList.remove("hl"));
      if (mine !== reading || k >= spans.length) return;
      const sp = spans[k++]; sp.classList.add("hl"); speakThen(sp.textContent, step);
    };
    step();
  }
  function draw(){
    reading++;
    const pg = st.pages[i], page = $("#page"); delete page.dataset.done;
    $("#dots").innerHTML = st.pages.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("");
    const gate = pg.pick || pg.ask;                               // choice and question pages must be answered to go on
    $("#fwd").style.visibility = gate ? "hidden" : "visible"; $("#back").style.visibility = i ? "visible" : "hidden";
    if (pg.text) page.innerHTML = `<div class="spic">${fill(pg.pic)}</div>${words(pg.text)}`;
    else if (pg.pick) page.innerHTML = `${words(pg.pick)}<div class="row rtl" style="gap:calc(var(--u)*5)">${pg.opts.map((o, k) => `<button class="btn white opt" data-k="${k}"><span>${o[0]}</span><div class="he">${o[1]}</div></button>`).join("")}</div>`;
    else page.innerHTML = `${words(pg.ask)}<div class="row" style="gap:calc(var(--u)*4)">${shuffle(pg.opts).map(o => `<button class="btn white opt" data-o="${o}" style="height:calc(var(--u)*17)"><span>${o}</span></button>`).join("")}</div>`;
    $$("#page .line span").forEach(sp => sp.addEventListener("click", () => {       // tap a word to hear it slowly
      reading++; $$("#page .line span").forEach(s => s.classList.remove("hl")); sp.classList.add("hl"); tick(); say(sp.textContent.replace(/[.!?,]/g, ""), {slow:true}); }));
    on("#page .opt[data-k]", el => { chosen = pg.opts[+el.dataset.k]; say(chosen[1]); thud(); go(1); });
    on("#page .opt[data-o]", el => {
      const right = pg.ans === "pick" ? chosen[0] : pg.opts[pg.ans];
      if (page.dataset.done) return;                              // one reward per question
      if (el.dataset.o !== right) { nope(); shake(el); return; }
      page.dataset.done = "1"; burst(el); yay(); if (!paid.has(i)) { paid.add(i); addStars(1); } later(() => go(1), 900);
    });
    later(readAll, 350);
  }
  function go(d){
    if (i + d >= st.pages.length) {                               // the end: reward once, however often the arrow is tapped
      if (!ended) { ended = true; reading++; confetti(); praise(); addStars(3); bump(ROUND); P.seen[STORIES[n].title] = 1; save(); later(storyMenu, 2200); }
      return;
    }
    i += d;
    draw();
  }
  on("#x", storyMenu); on("#read", readAll); on("#fwd", () => go(1)); on("#back", () => go(-1));
  draw();
}

const SCENES = ["linear-gradient(#9ed8f5 0 58%,#f3dfa2 58%)", "linear-gradient(#bfe6ff 0 62%,#8fc46a 62%)", "linear-gradient(#1b2350,#454a8a)", "linear-gradient(#ffd9a0,#ff9e7a 60%,#7a5a8a)"];
function scene(){

    ${mission("גִּרְרוּ מַדְבֵּקוֹת אֶל הַתְּמוּנָה. מַדְבֵּקָה שֶׁגּוֹרְרִים הַחוּצָה נִמְחֶקֶת.")}

  const board = $("#board");
  const where = (x, y) => { const r = board.getBoundingClientRect(); return [(x - r.left) / r.width, (y - r.top) / r.height]; };
  function draw(){
    board.style.background = SCENES[P.scene.bg % SCENES.length];
    board.innerHTML = P.scene.items.map((it, k) => `<div class="placed" data-k="${k}" style="left:${it.x * 100}%;top:${it.y * 100}%">${it.s}</div>`).join("");
    $$(".placed", board).forEach(el => { const it = P.scene.items[+el.dataset.k];
      draggable(el, {
        onTap: () => { say(stickerName(it.s)); el.animate([{transform:"scale(1)"}, {transform:"scale(1.4) rotate(-10deg)"}, {transform:"scale(1)"}], {duration:400}); },
        onDrop: (x, y) => { if (inside(board, x, y)) { [it.x, it.y] = where(x, y); } else P.scene.items.splice(+el.dataset.k, 1);   // dragged off the picture = removed
                            save(); thud(); draw(); }}); });
  }
  $("#tray").classList.toggle("many", P.stickers.length > 11);
  $("#tray").innerHTML = P.stickers.length ? P.stickers.map(x => `<div class="st" data-s="${x}">${x}</div>`).join("") : `<div class="st" style="opacity:.4">🎁</div>`;
  $$("#tray .st[data-s]").forEach(el => draggable(el, {

    onDrop: (x, y) => { if (!inside(board, x, y) || P.scene.items.length >= 40) return; const [px, py] = where(x, y); P.scene.items.push({s: el.dataset.s, x: px, y: py}); save(); thud(); draw(); }}));
  on("#back", prizes); on("#bg", () => { P.scene.bg++; save(); draw(); }); on("#wipe", () => { P.scene.items = []; save(); draw(); });
  draw();
}

/* The parents area is behind a 4-digit PIN that the parent chooses the first time it is opened (kept on this device).
   It can be changed from Settings. A forgotten PIN is reset by solving a multiplication a young child cannot do. */
function pinPad(title, onKey, extra){
  show(`<div class="grow col" style="justify-content:center;direction:ltr"><div style="font-size:calc(var(--u)*5)">🔒</div><div id="pt" style="font-size:calc(var(--u)*2.6);text-align:center">${title}</div>
    <div id="q" style="font-size:calc(var(--u)*6.4);color:var(--cobalt);letter-spacing:calc(var(--u)*1.5);min-height:calc(var(--u)*8)"></div>
    <div class="keys">${["1","2","3","4","5","6","7","8","9","⌫","0","✕"].map(k => `<button class="btn white" data-k="${k}">${k}</button>`).join("")}</div>${extra || ""}</div>`);
  on(".keys .btn", el => onKey(el.dataset.k));
}
function parentGate(mode){                          // mode: undefined = open the area, "set" = change the PIN from Settings, "reset" = new PIN after "forgot"
  ACT = null;
  if (mode !== "set" && mode !== "reset") mode = undefined;
  const setting = !!mode || !db.pin, leave = mode === "set" ? parents : hub; let entry = "", first = "";
  const title = () => !setting ? "Parents only: enter the PIN" : first ? "Enter the new PIN once more" : db.pin ? "Choose a new 4-digit PIN" : "Choose a 4-digit PIN for the parents area";
  const draw = () => { $("#q").textContent = "●".repeat(entry.length) + "○".repeat(4 - entry.length); $("#pt").textContent = title(); };
  pinPad(title(), k => {
    if (k === "✕") { leave(); return; }
    if (k === "⌫") entry = entry.slice(0, -1); else if (entry.length < 4) entry += k;
    if (entry.length === 4) {
      if (!setting) { if (entry === db.pin) { parents(); return; } entry = ""; nope(); shake($("#q")); }
      else if (!first) { first = entry; entry = ""; }
      else if (entry === first) { db.pin = entry; save(); yay(); parents(); return; }
      else { first = ""; entry = ""; nope(); shake($("#q")); }                 // the two entries differ: start again
    }
    draw();
  }, setting ? "" : `<button id="forgot" style="font:inherit;font-size:calc(var(--u)*2);background:none;border:0;color:var(--cobalt);text-decoration:underline;cursor:pointer;margin-top:calc(var(--u)*1)">Forgot the PIN?</button>`);
  draw(); on("#forgot", pinForgot);
}
function pinForgot(){
  const a = 12 + Math.floor(Math.random() * 8), b = 12 + Math.floor(Math.random() * 8); let entry = "";
  const draw = () => { $("#q").textContent = entry || "?"; };
  pinPad(`To choose a new PIN, solve: ${a} × ${b}`, k => {
    if (k === "✕") { hub(); return; }
    if (k === "⌫") entry = entry.slice(0, -1); else if (entry.length < 3) entry += k;
    if (entry.length === 3) { if (+entry === a * b) { parentGate("reset"); return; } nope(); pinForgot(); return; }       // wrong: a new question
    draw();
  });
  draw();
}

  {title:"הַשֵּׁן שֶׁל הַפִּיל", text:"לַפִּיל יֵשׁ שְׁתֵּי שִׁנַּיִם אֲרֻכּוֹת מְאוֹד שֶׁנִּקְרָאוֹת חֲטָטִים. בְּעֶזְרַת הַחֲטָטִים הוּא חוֹפֵר בָּאֲדָמָה וּמְחַפֵּשׂ מַיִם. הַפִּיל אוֹכֵל רַק צְמָחִים: עָלִים, עֲנָפִים וּפֵרוֹת. בְּכָל יוֹם הוּא אוֹכֵל כַּמּוּת עֲצוּמָה שֶׁל אֹכֶל.", qs:[
    ["אֵיךְ נִקְרָאוֹת הַשִּׁנַּיִם הָאֲרֻכּוֹת שֶׁל הַפִּיל?","חֲטָטִים",["קַרְנַיִם","טְפָרִים","חֵדֶק"]],
    ["בִּשְׁבִיל מָה הַפִּיל חוֹפֵר בָּאֲדָמָה?","כְּדֵי לְחַפֵּשׂ מַיִם",["כְּדֵי לְהִתְחַבֵּא","כְּדֵי לִבְנוֹת בַּיִת","כְּדֵי לִישֹׁן"]],
    ["מָה אוֹכֵל הַפִּיל?","רַק צְמָחִים",["רַק בָּשָׂר","דָּגִים","חֲרָקִים"]]]},
  {title:"הַמִּכְתָּב לְסָבְתָא", text:"סָבְתָא שֶׁל עֹמֶר גָּרָה בְּעִיר רְחוֹקָה. עֹמֶר צִיֵּר לָהּ צִיּוּר שֶׁל פְּרָחִים וְכָתַב: אֲנִי מִתְגַּעְגֵּעַ. הוּא שָׂם אֶת הַצִּיּוּר בְּמַעֲטָפָה, הִדְבִּיק בּוּל וְהָלַךְ עִם אִמָּא לַדֹּאַר. אַחֲרֵי שָׁבוּעַ סָבְתָא הִתְקַשְּׁרָה וְאָמְרָה תּוֹדָה.", qs:[
    ["מָה צִיֵּר עֹמֶר?","פְּרָחִים",["בַּיִת","כֶּלֶב","מְכוֹנִית"]],
    ["מָה הִדְבִּיק עֹמֶר עַל הַמַּעֲטָפָה?","בּוּל",["מַדְבֵּקָה שֶׁל לֵב","תְּמוּנָה","פֶּתֶק"]],
    ["אֵיךְ אָמְרָה סָבְתָא תּוֹדָה?","הִיא הִתְקַשְּׁרָה",["הִיא שָׁלְחָה מִכְתָּב","הִיא בָּאָה לְבַקֵּר","הִיא שָׁלְחָה מַתָּנָה"]]]},
  {title:"הַנְּמָלִים", text:"הַנְּמָלִים חַיּוֹת יַחַד בְּקֵן גָּדוֹל מִתַּחַת לָאֲדָמָה. לְכָל נְמָלָה יֵשׁ תַּפְקִיד. חֵלֶק מֵהֶן מְבִיאוֹת אֹכֶל, וְחֵלֶק שׁוֹמְרוֹת עַל הַקֵּן. נְמָלָה קְטַנָּה יְכוֹלָה לָשֵׂאת מַשָּׂא כָּבֵד הַרְבֵּה יוֹתֵר מִמֶּנָּה.", qs:[
    ["אֵיפֹה נִמְצָא הַקֵּן שֶׁל הַנְּמָלִים?","מִתַּחַת לָאֲדָמָה",["עַל עֵץ","בְּתוֹךְ הַמַּיִם","עַל גַּג"]],
    ["מָה עוֹשׂוֹת הַנְּמָלִים?","לְכָל אַחַת יֵשׁ תַּפְקִיד",["כֻּלָּן יְשֵׁנוֹת","כֻּלָּן שׁוֹמְרוֹת בִּלְבַד","הֵן אֵינָן עוֹבְדוֹת"]],
    ["מָה מְיֻחָד בַּכֹּחַ שֶׁל הַנְּמָלָה?","הִיא נוֹשֵׂאת מַשָּׂא כָּבֵד מִמֶּנָּה",["הִיא קוֹפֶצֶת גָּבוֹהַּ","הִיא עָפָה מַהֵר","הִיא שׂוֹחָה רָחוֹק"]]]},
  {title:"הַבָּלוֹן שֶׁבָּרַח", text:"בְּיוֹם הָעַצְמָאוּת קִבְּלָה שִׁירָה בָּלוֹן כָּחֹל. הִיא הֶחֱזִיקָה אֶת הַחוּט חָזָק. פִּתְאוֹם נָשְׁבָה רוּחַ, וְהַחוּט נִשְׁמַט מִיָּדָהּ. הַבָּלוֹן עָלָה גָּבוֹהַּ לַשָּׁמַיִם. שִׁירָה הָיְתָה עֲצוּבָה, אֲבָל אָחִיהָ נָתַן לָהּ אֶת הַבָּלוֹן שֶׁלּוֹ.", qs:[
    ["בְּאֵיזֶה צֶבַע הָיָה הַבָּלוֹן?","כָּחֹל",["אָדֹם","צָהֹב","יָרֹק"]],
    ["לָמָּה הַבָּלוֹן בָּרַח?","הָרוּחַ נָשְׁבָה וְהַחוּט נִשְׁמַט",["שִׁירָה זָרְקָה אוֹתוֹ","הַחוּט נִקְרַע","כֶּלֶב לָקַח אוֹתוֹ"]],
    ["מִי עָזַר לְשִׁירָה?","אָחִיהָ",["אִמָּא","חֲבֵרָה","הַמּוֹכֵר"]]]},
  {title:"הַשּׁוֹטֵר בַּמַּעֲבַר הַחֲצִיָּה", text:"לְיַד בֵּית הַסֵּפֶר יֵשׁ מַעֲבַר חֲצִיָּה. בְּכָל בֹּקֶר עוֹמְדִים שָׁם יְלָדִים מִכִּתָּה ו' עִם שֶׁלֶט עֲצֹר. כְּשֶׁהֵם מְרִימִים אֶת הַשֶּׁלֶט, הַמְּכוֹנִיּוֹת עוֹצְרוֹת וְהַיְּלָדִים הַקְּטַנִּים חוֹצִים בְּבִטְחָה.", qs:[
    ["אֵיפֹה נִמְצָא מַעֲבַר הַחֲצִיָּה?","לְיַד בֵּית הַסֵּפֶר",["לְיַד הַיָּם","בַּפַּארְק","לְיַד הַחֲנוּת"]],
    ["מִי עוֹמֵד שָׁם בְּכָל בֹּקֶר?","יְלָדִים מִכִּתָּה ו'",["הַמּוֹרוֹת","הַהוֹרִים","יְלָדִים מִכִּתָּה א'"]],
    ["מָה קוֹרֶה כְּשֶׁמְּרִימִים אֶת הַשֶּׁלֶט?","הַמְּכוֹנִיּוֹת עוֹצְרוֹת",["הַמְּכוֹנִיּוֹת נוֹסְעוֹת מַהֵר","הַיְּלָדִים רָצִים","הַפַּעֲמוֹן מְצַלְצֵל"]]]},
  {title:"הַקַּקְטוּס", text:"הַקַּקְטוּס גָּדֵל בַּמִּדְבָּר, שָׁם יוֹרֵד מְעַט מְאוֹד גֶּשֶׁם. הוּא אוֹגֵר מַיִם בְּתוֹךְ הַגֶּזַע הֶעָבֶה שֶׁלּוֹ. בִּמְקוֹם עָלִים יֵשׁ לוֹ קוֹצִים. הַקּוֹצִים שׁוֹמְרִים עָלָיו מִפְּנֵי חַיּוֹת שֶׁרוֹצוֹת לֶאֱכֹל אוֹתוֹ.", qs:[
    ["אֵיפֹה גָּדֵל הַקַּקְטוּס?","בַּמִּדְבָּר",["בַּיָּם","בַּיַּעַר הַגָּשׁוּם","עַל הַר מֻשְׁלָג"]],
    ["אֵיפֹה הַקַּקְטוּס שׁוֹמֵר מַיִם?","בְּתוֹךְ הַגֶּזַע",["בַּקּוֹצִים","בַּפְּרָחִים","מִתַּחַת לָאֶבֶן"]],
    ["בִּשְׁבִיל מָה יֵשׁ לוֹ קוֹצִים?","כְּדֵי לְהָגֵן עָלָיו מֵחַיּוֹת",["כְּדֵי לִהְיוֹת יָפֶה","כְּדֵי לִתְפֹּס גֶּשֶׁם","כְּדֵי לְטַפֵּס"]]]},
  {title:"חֻלְצָה חֲדָשָׁה", text:"אִיתַי וְאִמָּא הָלְכוּ לַקַּנְיוֹן לִקְנוֹת חֻלְצָה. אִיתַי רָצָה חֻלְצָה יְרֻקָּה עִם צִיּוּר שֶׁל דִּינוֹזָאוּר. בַּחֲנוּת הָרִאשׁוֹנָה לֹא הָיְתָה חֻלְצָה כָּזֹאת. בַּחֲנוּת הַשְּׁנִיָּה הֵם מָצְאוּ אוֹתָהּ, אֲבָל הִיא הָיְתָה גְּדוֹלָה מִדַּי. הַמּוֹכֶרֶת הֵבִיאָה מִדָּה קְטַנָּה יוֹתֵר.", qs:[
    ["אֵיזוֹ חֻלְצָה רָצָה אִיתַי?","יְרֻקָּה עִם דִּינוֹזָאוּר",["כְּחֻלָּה עִם כּוֹכָבִים","אֲדֻמָּה עִם מְכוֹנִית","לְבָנָה בְּלִי צִיּוּר"]],
    ["בְּאֵיזוֹ חֲנוּת מָצְאוּ אֶת הַחֻלְצָה?","בַּחֲנוּת הַשְּׁנִיָּה",["בַּחֲנוּת הָרִאשׁוֹנָה","בַּחֲנוּת הַשְּׁלִישִׁית","בַּשּׁוּק"]],
    ["מָה הָיְתָה הַבְּעָיָה בַּחֻלְצָה?","הִיא הָיְתָה גְּדוֹלָה מִדַּי",["הִיא הָיְתָה קְרוּעָה","הִיא הָיְתָה יְקָרָה מִדַּי","הִיא הָיְתָה מְלֻכְלֶכֶת"]]]},
  {title:"הַפִּינְגְּוִין", text:"הַפִּינְגְּוִין הוּא צִפּוֹר, אֲבָל הוּא אֵינוֹ יוֹדֵעַ לָעוּף. הוּא חַי בִּמְקוֹמוֹת קָרִים מְאוֹד, לְיַד הַיָּם. הַפִּינְגְּוִין שַׂחְיָן מְצֻיָּן, וְהוּא צָד דָּגִים בַּמַּיִם. כְּשֶׁקַּר, הַפִּינְגְּוִינִים עוֹמְדִים צְפוּפִים זֶה לְיַד זֶה וּמְחַמְּמִים זֶה אֶת זֶה.", qs:[
    ["מָה הַפִּינְגְּוִין אֵינוֹ יוֹדֵעַ לַעֲשׂוֹת?","לָעוּף",["לִשְׂחוֹת","לָלֶכֶת","לֶאֱכֹל"]],
    ["מָה אוֹכֵל הַפִּינְגְּוִין?","דָּגִים",["עֵשֶׂב","פֵּרוֹת","זְרָעִים"]],
    ["אֵיךְ הַפִּינְגְּוִינִים מִתְחַמְּמִים?","עוֹמְדִים צְפוּפִים יַחַד",["מַדְלִיקִים אֵשׁ","נִכְנָסִים לַמַּיִם","רָצִים מַהֵר"]]]},
  {title:"הַמַּצְלֵמָה שֶׁל דּוֹד אָבִי", text:"דּוֹד אָבִי אוֹהֵב לְצַלֵּם צִפּוֹרִים. הוּא קָם לִפְנֵי הַזְּרִיחָה וְנוֹסֵעַ לָאֲגַם. שָׁם הוּא יוֹשֵׁב בְּשֶׁקֶט שָׁעוֹת אֲרֻכּוֹת וּמְחַכֶּה. אִם הוּא יַרְעִישׁ, הַצִּפּוֹרִים יִבְרְחוּ. אֶת הַתְּמוּנוֹת הַיָּפוֹת הוּא תּוֹלֶה עַל הַקִּיר בַּסָּלוֹן.", qs:[
    ["מָה אוֹהֵב דּוֹד אָבִי לְצַלֵּם?","צִפּוֹרִים",["פְּרָחִים","מְכוֹנִיּוֹת","יְלָדִים"]],
    ["לָמָּה הוּא יוֹשֵׁב בְּשֶׁקֶט?","כְּדֵי שֶׁהַצִּפּוֹרִים לֹא יִבְרְחוּ",["כִּי הוּא עָיֵף","כִּי אָסוּר לְדַבֵּר בָּאֲגַם","כִּי הוּא מַקְשִׁיב לְמוּסִיקָה"]],
    ["אֵיפֹה הוּא תּוֹלֶה אֶת הַתְּמוּנוֹת?","עַל הַקִּיר בַּסָּלוֹן",["בַּמִּטְבָּח","בַּמְּכוֹנִית","עַל הַמְּקָרֵר"]]]},
  {title:"מְכוֹנַת הַכְּבִיסָה הִתְקַלְקְלָה", text:"מְכוֹנַת הַכְּבִיסָה בַּבַּיִת שֶׁל גִּילִי הִתְקַלְקְלָה, וּמַיִם נִשְׁפְּכוּ עַל הָרִצְפָּה. אִמָּא סָגְרָה אֶת הַבֶּרֶז וְהִזְמִינָה טֶכְנַאי. גִּילִי וְאָחִיהָ נִגְּבוּ אֶת הַמַּיִם בְּמַגָּבוֹת יְשָׁנוֹת. הַטֶּכְנַאי הִגִּיעַ בָּעֶרֶב וְהֶחְלִיף צִנּוֹר קָרוּעַ.", qs:[

{id:"teddy", icon:"🧸", title:"הַדֻּבִּי שֶׁנִּשְׁאַר בַּגַּן",
 text:"לְאַלְמָה יֵשׁ דֻּבִּי חוּם בְּשֵׁם שׁוֹקוֹ. הִיא לוֹקַחַת אוֹתוֹ לְכָל מָקוֹם, וּבַלַּיְלָה הִיא יְשֵׁנָה רַק אִתּוֹ.\nיוֹם אֶחָד, כְּשֶׁחָזְרָה מֵהַגַּן, פָּתְחָה אַלְמָה אֶת הַתִּיק וְגִלְּתָה שֶׁשּׁוֹקוֹ אֵינֶנּוּ. הִיא חִפְּשָׂה בַּמְּכוֹנִית, בַּחֶדֶר וּמִתַּחַת לַמִּטָּה. שׁוֹקוֹ לֹא הָיָה בְּשׁוּם מָקוֹם. הַגַּן כְּבָר הָיָה סָגוּר.\nבָּעֶרֶב אַלְמָה בָּכְתָה. אֵיךְ אֶפְשָׁר לִישֹׁן בְּלִי שׁוֹקוֹ? אָחִיהָ הַגָּדוֹל, נָדָב, נִכְנַס לַחֶדֶר. בַּיָּד שֶׁלּוֹ הָיָה אַרְנָב יָשָׁן וְקָרוּעַ קְצָת. הוּא אָמַר: זֶה הָאַרְנָב שֶׁלִּי מִכְּשֶׁהָיִיתִי קָטָן. הוּא יִשְׁמֹר עָלַיִךְ הַלַּיְלָה, עַד שֶׁשּׁוֹקוֹ יַחְזֹר.\nאַלְמָה חִבְּקָה אֶת הָאַרְנָב וְנִרְדְּמָה.\nבַּבֹּקֶר, בַּגַּן, חִכְּתָה לָהּ הַגַּנֶּנֶת עִם חִיּוּךְ. שׁוֹקוֹ יָשַׁב עַל הַכִּסֵּא שֶׁל אַלְמָה, וְעַל הַצַּוָּאר שֶׁלּוֹ פֶּתֶק: יָשַׁנְתִּי בַּגַּן וְשָׁמַרְתִּי עַל הַצַּעֲצוּעִים.\nבַּצָּהֳרַיִם הֶחְזִירָה אַלְמָה לְנָדָב אֶת הָאַרְנָב, וְצִיְּרָה לוֹ צִיּוּר שֶׁל תּוֹדָה.",
 qs:[
  ["מִי זֶה שׁוֹקוֹ?","הַדֻּבִּי שֶׁל אַלְמָה",["הָאָח שֶׁל אַלְמָה","הַכֶּלֶב שֶׁל אַלְמָה","הָאַרְנָב שֶׁל נָדָב"]],
  ["מָתַי גִּלְּתָה אַלְמָה שֶׁשּׁוֹקוֹ אֵינֶנּוּ?","כְּשֶׁפָּתְחָה אֶת הַתִּיק בַּבַּיִת",["בַּבֹּקֶר בַּגַּן","בְּאֶמְצַע הַלַּיְלָה","בִּזְמַן הָאֹכֶל"]],
  ["לָמָּה אִי אֶפְשָׁר הָיָה לָלֶכֶת לְחַפֵּשׂ בַּגַּן?","כִּי הַגַּן כְּבָר הָיָה סָגוּר",["כִּי יָרַד גֶּשֶׁם","כִּי הַמְּכוֹנִית הִתְקַלְקְלָה","כִּי אַלְמָה הָיְתָה חוֹלָה"]],
  ["מָה הֵבִיא נָדָב לְאַלְמָה?","אֶת הָאַרְנָב הַיָּשָׁן שֶׁלּוֹ",["דֻּבִּי חָדָשׁ","סֵפֶר","כּוֹס חָלָב"]],
  ["מָה אֶפְשָׁר לִלְמֹד עַל נָדָב?","שֶׁהוּא אָח אִכְפַּתִּי",["שֶׁהוּא אוֹהֵב לְהַרְגִּיז","שֶׁהוּא שָׁכַח אֶת שׁוֹקוֹ","שֶׁהוּא פּוֹחֵד מֵהַחֹשֶׁךְ"]],
  ["אֵיפֹה חִכָּה שׁוֹקוֹ בַּבֹּקֶר?","עַל הַכִּסֵּא שֶׁל אַלְמָה בַּגַּן",["בַּתִּיק","בַּמְּכוֹנִית","אֵצֶל נָדָב"]],
  ["מִי כָּתַב כַּנִּרְאֶה אֶת הַפֶּתֶק?","הַגַּנֶּנֶת",["שׁוֹקוֹ","נָדָב","אַלְמָה"]],
  ["אֵיךְ הוֹדְתָה אַלְמָה לְנָדָב?","הֶחְזִירָה לוֹ אֶת הָאַרְנָב וְצִיְּרָה לוֹ צִיּוּר",["קָנְתָה לוֹ מַתָּנָה","נָתְנָה לוֹ אֶת שׁוֹקוֹ","הֵכִינָה לוֹ עוּגָה"]]
 ]},
{id:"bat", icon:"🦇", title:"הָעֲטַלֵּף",
 text:"הָעֲטַלֵּף הוּא הַיּוֹנֵק הַיָּחִיד שֶׁיּוֹדֵעַ לָעוּף. אֵין לוֹ נוֹצוֹת כְּמוֹ לְצִפּוֹר. הַכְּנָפַיִם שֶׁלּוֹ עֲשׂוּיוֹת מֵעוֹר דַּק שֶׁמָּתוּחַ בֵּין הָאֶצְבָּעוֹת הָאֲרֻכּוֹת.\nבַּיּוֹם הָעֲטַלֵּפִים יְשֵׁנִים בִּמְעָרוֹת אוֹ עַל עֵצִים. הֵם יְשֵׁנִים כְּשֶׁהֵם תְּלוּיִים הָפוּךְ, עִם הָרֹאשׁ לְמַטָּה. בַּלַּיְלָה הֵם יוֹצְאִים לְחַפֵּשׂ אֹכֶל.\nאֵיךְ הָעֲטַלֵּף מוֹצֵא אֶת דַּרְכּוֹ בַּחֹשֶׁךְ? הוּא מַשְׁמִיעַ קוֹלוֹת גְּבוֹהִים מְאוֹד, שֶׁבְּנֵי אָדָם אֵינָם שׁוֹמְעִים. הַקּוֹל פּוֹגֵעַ בְּעֵץ אוֹ בְּחֶרֶק וְחוֹזֵר אֶל הָאָזְנַיִם שֶׁלּוֹ כְּמוֹ הֵד. לְפִי הַהֵד הוּא יוֹדֵעַ בְּדִיּוּק אֵיפֹה כָּל דָּבָר נִמְצָא.\nחֵלֶק מֵהָעֲטַלֵּפִים אוֹכְלִים חֲרָקִים. עֲטַלֵּף קָטָן אֶחָד יָכוֹל לֶאֱכֹל מֵאוֹת יַתּוּשִׁים בְּלַיְלָה אֶחָד. עֲטַלֵּפִים אֲחֵרִים אוֹכְלִים פֵּרוֹת, וְהֵם מְפַזְּרִים אֶת הַזְּרָעִים וְעוֹזְרִים לְעֵצִים חֲדָשִׁים לִצְמֹחַ.\nיֵשׁ אֲנָשִׁים שֶׁפּוֹחֲדִים מֵעֲטַלֵּפִים, אֲבָל הָעֲטַלֵּפִים אֵינָם מְסֻכָּנִים לָנוּ. לְהֶפֶךְ, הֵם עוֹזְרִים לַטֶּבַע.",
 qs:[
  ["מָה מְיֻחָד בָּעֲטַלֵּף?","הוּא הַיּוֹנֵק הַיָּחִיד שֶׁעָף",["הוּא הַצִּפּוֹר הַגְּדוֹלָה בְּיוֹתֵר","הוּא חַי בַּמַּיִם","יֵשׁ לוֹ נוֹצוֹת שְׁחֹרוֹת"]],
  ["מִמָּה עֲשׂוּיוֹת הַכְּנָפַיִם שֶׁל הָעֲטַלֵּף?","מֵעוֹר דַּק",["מִנּוֹצוֹת","מִפַּרְוָה","מֵעָלִים"]],
  ["אֵיךְ יְשֵׁנִים הָעֲטַלֵּפִים?","תְּלוּיִים הָפוּךְ",["שׁוֹכְבִים עַל הַגַּב","עוֹמְדִים עַל רֶגֶל אַחַת","בְּתוֹךְ קֵן"]],
  ["מָתַי הָעֲטַלֵּפִים מְחַפְּשִׂים אֹכֶל?","בַּלַּיְלָה",["בַּבֹּקֶר","בַּצָּהֳרַיִם","רַק בַּקַּיִץ"]],
  ["אֵיךְ הָעֲטַלֵּף מוֹצֵא אֶת דַּרְכּוֹ בַּחֹשֶׁךְ?","בְּעֶזְרַת קוֹלוֹת שֶׁחוֹזְרִים אֵלָיו כְּמוֹ הֵד",["בְּעֶזְרַת עֵינַיִם גְּדוֹלוֹת","בְּעֶזְרַת אוֹר הַיָּרֵחַ","בְּעֶזְרַת חוּשׁ הָרֵיחַ"]],
  ["לָמָּה אֲנַחְנוּ לֹא שׁוֹמְעִים אֶת הַקּוֹלוֹת שֶׁל הָעֲטַלֵּף?","כִּי הֵם גְּבוֹהִים מְאוֹד",["כִּי הֵם חֲלָשִׁים מְאוֹד","כִּי הוּא רָחוֹק מִדַּי","כִּי הוּא שׁוֹתֵק"]],
  ["אֵיךְ עוֹזְרִים עֲטַלְּפֵי הַפֵּרוֹת לַטֶּבַע?","הֵם מְפַזְּרִים זְרָעִים",["הֵם מַשְׁקִים עֵצִים","הֵם בּוֹנִים קִנִּים","הֵם מְגָרְשִׁים צִפּוֹרִים"]],
  ["מָה דַּעַת הַכּוֹתֵב עַל הָעֲטַלֵּפִים?","שֶׁהֵם מוֹעִילִים וְאֵין סִבָּה לְפַחֵד מֵהֶם",["שֶׁהֵם מְסֻכָּנִים מְאוֹד","שֶׁצָּרִיךְ לְגָרֵשׁ אוֹתָם","שֶׁהֵם מַזִּיקִים לָעֵצִים"]]
 ]},
{id:"swim", icon:"🏊", title:"שִׁעוּר הַשְּׂחִיָּה",
 text:"בַּקַּיִץ נִרְשְׁמָה תָּמָר לְחוּג שְׂחִיָּה. כָּל הַיְּלָדִים בַּקְּבוּצָה כְּבָר יָדְעוּ לְהַכְנִיס אֶת הָרֹאשׁ לַמַּיִם. רַק תָּמָר פָּחֲדָה.\nבַּשִּׁעוּר הָרִאשׁוֹן הִיא יָשְׁבָה עַל שְׂפַת הַבְּרֵכָה וְטָבְלָה רַק אֶת הָרַגְלַיִם. הַמַּדְרִיךְ, יוֹנִי, לֹא כָּעַס. הוּא יָשַׁב לְיָדָהּ וְאָמַר: כָּל אֶחָד לוֹמֵד בַּקֶּצֶב שֶׁלּוֹ. הַיּוֹם רַק נְשַׂחֵק.\nהוּא נָתַן לָהּ כּוֹס וּבִקֵּשׁ שֶׁתִּשְׁפֹּךְ מַיִם עַל הָרֹאשׁ שֶׁלָּהּ. תָּמָר צָחֲקָה. זֶה הָיָה כְּמוֹ מִקְלַחַת.\nבַּשִּׁעוּר הַשֵּׁנִי יוֹנִי פִּזֵּר טַבָּעוֹת צִבְעוֹנִיּוֹת עַל הַמַּדְרֵגָה שֶׁבַּמַּיִם. כְּדֵי לְהָרִים טַבַּעַת, תָּמָר הָיְתָה צְרִיכָה לְהַכְנִיס אֶת הַפָּנִים לַמַּיִם לְרֶגַע. הִיא עָצְמָה עֵינַיִם, נָשְׁמָה עָמֹק וְהִכְנִיסָה. כְּשֶׁהִיא יָצְאָה, בַּיָּד שֶׁלָּהּ הָיְתָה טַבַּעַת אֲדֻמָּה.\nבְּסוֹף הַקַּיִץ תָּמָר שָׂחֲתָה לְבַד מִצַּד אֶחָד שֶׁל הַבְּרֵכָה לַצַּד הַשֵּׁנִי. אִמָּא צִלְּמָה, וְיוֹנִי שָׁרַק בַּמַּשְׁרוֹקִית.",
 qs:[
  ["לְאֵיזֶה חוּג נִרְשְׁמָה תָּמָר?","לְחוּג שְׂחִיָּה",["לְחוּג רִקּוּד","לְחוּג צִיּוּר","לְחוּג כַּדּוּרֶגֶל"]],

 text:"כִּתָּה ב' יָצְאָה לְבִקּוּר בְּתַחֲנַת כִּבּוּי הָאֵשׁ. בַּכְּנִיסָה חִכָּה לָהֶם אָמִיר, לוֹחֵם אֵשׁ וָתִיק.\nאָמִיר הֶרְאָה לַיְּלָדִים אֶת הַכַּבָּאִית הָאֲדֻמָּה. בְּתוֹכָהּ יֵשׁ מְכַל מַיִם גָּדוֹל, צִנּוֹרוֹת אֲרֻכִּים וְסֻלָּם שֶׁנִּפְתָּח לְגֹבַהּ שֶׁל בִּנְיָן. הוּא הִסְבִּיר: כְּשֶׁמַּגִּיעָה קְרִיאָה, יֵשׁ לָנוּ דַּקָּה אַחַת בִּלְבַד לִלְבֹּשׁ אֶת הַחֲלִיפָה וְלָצֵאת.\nהַחֲלִיפָה שֶׁל לוֹחֲמֵי הָאֵשׁ כְּבֵדָה וְעָבָה. הִיא מְגִנָּה עֲלֵיהֶם מִפְּנֵי הַחֹם. עַל הַגַּב הֵם נוֹשְׂאִים מְכַל אֲוִיר, כְּדֵי שֶׁיּוּכְלוּ לִנְשֹׁם גַּם בְּתוֹךְ עָשָׁן.\nהַיְּלָדִים הֻפְתְּעוּ לִשְׁמֹעַ שֶׁלּוֹחֲמֵי הָאֵשׁ אֵינָם רַק מְכַבִּים שְׂרֵפוֹת. הֵם גַּם מְחַלְּצִים אֲנָשִׁים שֶׁנִּתְקְעוּ בְּמַעֲלִית, וַאֲפִלּוּ חֲתוּלִים שֶׁנִּתְקְעוּ עַל עֵץ.\nלִפְנֵי שֶׁנִּפְרְדוּ, אָמִיר לִמֵּד אוֹתָם שְׁנֵי כְּלָלִים: לֹא מְשַׂחֲקִים בְּגַפְרוּרִים, וְאִם רוֹאִים אֵשׁ, יוֹצְאִים מִיָּד וּמִתְקַשְּׁרִים לְמִסְפָּר 102.\nבַּסּוֹף כָּל יֶלֶד חָבַשׁ קַסְדָּה אֲמִתִּית וְהִצְטַלֵּם לְיַד הַכַּבָּאִית.",
 qs:[
  ["לְאָן יָצְאָה הַכִּתָּה?","לְתַחֲנַת כִּבּוּי הָאֵשׁ",["לְגַן הַחַיּוֹת","לְתַחֲנַת הַמִּשְׁטָרָה","לְבֵית הַחוֹלִים"]],
  ["מִי זֶה אָמִיר?","לוֹחֵם אֵשׁ וָתִיק",["הַמּוֹרֶה שֶׁל הַכִּתָּה","נֶהַג הָאוֹטוֹבּוּס","אַבָּא שֶׁל אֶחָד הַיְּלָדִים"]],
  ["מָה יֵשׁ בְּתוֹךְ הַכַּבָּאִית?","מְכַל מַיִם, צִנּוֹרוֹת וְסֻלָּם",["מִטּוֹת וְשֻׁלְחָנוֹת","סְפָרִים וּמַחְבָּרוֹת","כְּלֵי נְגִינָה"]],
  ["כַּמָּה זְמַן יֵשׁ לְלוֹחֲמֵי הָאֵשׁ כְּדֵי לָצֵאת לִקְרִיאָה?","דַּקָּה אַחַת",["שָׁעָה","עֶשֶׂר דַּקּוֹת","חֲצִי יוֹם"]],
  ["בִּשְׁבִיל מָה מְכַל הָאֲוִיר שֶׁעַל הַגַּב?","כְּדֵי לִנְשֹׁם בְּתוֹךְ עָשָׁן",["כְּדֵי לְנַפֵּחַ בָּלוֹנִים","כְּדֵי לְכַבּוֹת אֶת הָאֵשׁ","כְּדֵי לָצוּף בַּמַּיִם"]],
  ["מָה הִפְתִּיעַ אֶת הַיְּלָדִים?","שֶׁלּוֹחֲמֵי הָאֵשׁ גַּם מְחַלְּצִים אֲנָשִׁים וְחַיּוֹת",["שֶׁהַכַּבָּאִית אֲדֻמָּה","שֶׁהַחֲלִיפָה כְּבֵדָה","שֶׁיֵּשׁ מַיִם בַּכַּבָּאִית"]],
  ["מָה עוֹשִׂים אִם רוֹאִים אֵשׁ?","יוֹצְאִים מִיָּד וּמִתְקַשְּׁרִים לְ־102",["מְנַסִּים לְכַבּוֹת לְבַד","מִתְחַבְּאִים מִתַּחַת לַמִּטָּה","מְחַכִּים שֶׁהָאֵשׁ תִּכְבֶּה"]],
  ["מָה עָשׂוּ הַיְּלָדִים בְּסוֹף הַבִּקּוּר?","חָבְשׁוּ קַסְדָּה וְהִצְטַלְּמוּ",["כִּבּוּ שְׂרֵפָה","נָסְעוּ בַּכַּבָּאִית","טִפְּסוּ עַל הַסֻּלָּם"]]
 ]},
{id:"glasses", icon:"👓", title:"הַמִּשְׁקָפַיִם שֶׁל נֹעַם",
 text:"בִּזְמַן הָאַחֲרוֹן נֹעַם לֹא רָאָה טוֹב אֶת הַלּוּחַ. הָאוֹתִיּוֹת נִרְאוּ לוֹ מְטֻשְׁטָשׁוֹת, וְהוּא הֶעְתִּיק מִסְפָּרִים לֹא נְכוֹנִים. הַמּוֹרָה הִצִּיעָה לְהוֹרָיו לָקַחַת אוֹתוֹ לִבְדִיקַת עֵינַיִם.\nרוֹפֵא הָעֵינַיִם בָּדַק אֶת נֹעַם וְאָמַר: אַתָּה צָרִיךְ מִשְׁקָפַיִם. נֹעַם בָּחַר מִסְגֶּרֶת כְּחֻלָּה, אֲבָל בַּלֵּב הוּא דָּאַג. מָה יַגִּידוּ הַיְּלָדִים? אוּלַי יִצְחֲקוּ עָלָיו?\nבַּבֹּקֶר הוּא שָׂם אֶת הַמִּשְׁקָפַיִם בַּתִּיק וְלֹא עַל הָאַף. בַּשִּׁעוּר הָרִאשׁוֹן הוּא שׁוּב לֹא רָאָה אֶת הַלּוּחַ.\nבַּהַפְסָקָה נִגְּשָׁה אֵלָיו יָעֵל. גַּם לָהּ יֵשׁ מִשְׁקָפַיִם, אֲדֻמִּים וַעֲגֻלִּים. הִיא שָׁאֲלָה: לָמָּה אַתָּה לֹא מַרְכִּיב אֶת שֶׁלְּךָ? רָאִיתִי אוֹתָם בַּתִּיק. הֵם יָפִים.\nנֹעַם הוֹצִיא אֶת הַמִּשְׁקָפַיִם וְהִרְכִּיב אוֹתָם. פִּתְאוֹם הַכֹּל הָיָה חַד וּבָרוּר: הֶעָלִים עַל הָעֵץ, הַמִּסְפָּרִים עַל הַלּוּחַ, אֲפִלּוּ הַנְּמָשִׁים שֶׁל יָעֵל.\nאַף אֶחָד לֹא צָחַק. דָּנִיאֵל אֲפִלּוּ בִּקֵּשׁ לִמְדֹּד אוֹתָם. מֵאָז נֹעַם מַרְכִּיב מִשְׁקָפַיִם בְּכָל יוֹם.",
 qs:[
  ["מָה הָיְתָה הַבְּעָיָה שֶׁל נֹעַם?","הוּא לֹא רָאָה טוֹב אֶת הַלּוּחַ",["הוּא לֹא שָׁמַע אֶת הַמּוֹרָה","הוּא אִחֵר לַשִּׁעוּרִים","הוּא שָׁכַח אֶת הַמַּחְבֶּרֶת"]],
  ["מִי הִצִּיעַ לִבְדֹּק אֶת הָעֵינַיִם שֶׁל נֹעַם?","הַמּוֹרָה",["יָעֵל","דָּנִיאֵל","הָרוֹפֵא"]],
  ["בְּאֵיזֶה צֶבַע הָיְתָה הַמִּסְגֶּרֶת שֶׁנֹּעַם בָּחַר?","כְּחֻלָּה",["אֲדֻמָּה","יְרֻקָּה","שְׁחֹרָה"]],
  ["מִמָּה דָּאַג נֹעַם?","שֶׁהַיְּלָדִים יִצְחֲקוּ עָלָיו",["שֶׁהַמִּשְׁקָפַיִם יִשָּׁבְרוּ","שֶׁהַמִּשְׁקָפַיִם יְקָרִים","שֶׁהוּא יְאַבֵּד אוֹתָם"]],
  ["אֵיפֹה הָיוּ הַמִּשְׁקָפַיִם בַּשִּׁעוּר הָרִאשׁוֹן?","בַּתִּיק",["עַל הָאַף","בַּבַּיִת","אֵצֶל הַמּוֹרָה"]],
  ["מִי עוֹדֵד אֶת נֹעַם לְהַרְכִּיב אֶת הַמִּשְׁקָפַיִם?","יָעֵל",["דָּנִיאֵל","אִמָּא","רוֹפֵא הָעֵינַיִם"]],
  ["מָה קָרָה כְּשֶׁנֹּעַם הִרְכִּיב אֶת הַמִּשְׁקָפַיִם?","הַכֹּל נִרְאָה חַד וּבָרוּר",["כָּאַב לוֹ הָרֹאשׁ","הַיְּלָדִים צָחֲקוּ","הוּא לֹא רָאָה כְּלוּם"]],
  ["מָה מַרְאֶה הַסִּפּוּר?","שֶׁהַדְּאָגָה שֶׁל נֹעַם הָיְתָה מְיֻתֶּרֶת",["שֶׁמִּשְׁקָפַיִם הֵם דָּבָר רַע","שֶׁיָּעֵל לֹא חֲבֵרָה טוֹבָה","שֶׁלֹּא כְּדַאי לְהַקְשִׁיב לַמּוֹרָה"]]
 ]},
{id:"giraffe", icon:"🦒", title:"הַגִּ'ירָפָה",
 text:"הַגִּ'ירָפָה הִיא הַחַיָּה הַגְּבוֹהָה בְּיוֹתֵר בָּעוֹלָם. הִיא גְּבוֹהָה כְּמוֹ בַּיִת בֶּן שְׁתֵּי קוֹמוֹת. הַצַּוָּאר שֶׁלָּהּ לְבַדּוֹ אָרֹךְ יוֹתֵר מֵאָדָם מְבֻגָּר.\nבִּזְכוּת הַצַּוָּאר הָאָרֹךְ, הַגִּ'ירָפָה אוֹכֶלֶת עָלִים מֵרָאשֵׁי הָעֵצִים, שֶׁחַיּוֹת אֲחֵרוֹת אֵינָן מַגִּיעוֹת אֲלֵיהֶם. הַלָּשׁוֹן שֶׁלָּהּ אֲרֻכָּה וְכֵהָה, וְהִיא כּוֹרֶכֶת אוֹתָהּ סְבִיב הֶעָנָף וְתוֹלֶשֶׁת אֶת הֶעָלִים.\nלְכָל גִּ'ירָפָה יֵשׁ כְּתָמִים חוּמִים עַל הַפַּרְוָה. אֵין שְׁתֵּי גִּ'ירָפוֹת עִם אוֹתָם כְּתָמִים בְּדִיּוּק, כְּמוֹ שֶׁאֵין שְׁנֵי אֲנָשִׁים עִם אוֹתָן טְבִיעוֹת אֶצְבָּעוֹת.\nכְּשֶׁהַגִּ'ירָפָה רוֹצָה לִשְׁתּוֹת, הִיא חַיֶּבֶת לְפַשֵּׂק אֶת הָרַגְלַיִם הַקִּדְמִיּוֹת וּלְהוֹרִיד אֶת הָרֹאשׁ. בְּמַצָּב כָּזֶה קָשֶׁה לָהּ לִבְרֹחַ מֵאֲרָיוֹת. לָכֵן הַגִּ'ירָפוֹת שׁוֹתוֹת בְּתוֹרוֹת: אַחַת שׁוֹתָה, וְהָאֲחֵרוֹת שׁוֹמְרוֹת.\nהַגִּ'ירָפָה יְשֵׁנָה מְעַט מְאוֹד, רַק כַּמָּה דַּקּוֹת בְּכָל פַּעַם, וּבְדֶרֶךְ כְּלָל בַּעֲמִידָה.\nגּוּר שֶׁל גִּ'ירָפָה נוֹלָד כְּשֶׁהוּא כְּבָר גָּבוֹהַּ מֵאָדָם, וּכְבָר אַחֲרֵי שָׁעָה הוּא עוֹמֵד עַל הָרַגְלַיִם.",
 qs:[
  ["מָה מְיֻחָד בַּגִּ'ירָפָה?","הִיא הַחַיָּה הַגְּבוֹהָה בְּיוֹתֵר בָּעוֹלָם",["הִיא הַחַיָּה הַמְּהִירָה בְּיוֹתֵר","הִיא הַחַיָּה הַכְּבֵדָה בְּיוֹתֵר","הִיא הַחַיָּה הַקְּטַנָּה בְּיוֹתֵר"]],
  ["בִּשְׁבִיל מָה עוֹזֵר לַגִּ'ירָפָה הַצַּוָּאר הָאָרֹךְ?","כְּדֵי לֶאֱכֹל עָלִים מֵרָאשֵׁי הָעֵצִים",["כְּדֵי לִשְׂחוֹת בַּנָּהָר","כְּדֵי לִשְׁתּוֹת בְּקַלּוּת","כְּדֵי לְהִתְחַבֵּא"]],
  ["אֵיךְ הַגִּ'ירָפָה תּוֹלֶשֶׁת עָלִים?","כּוֹרֶכֶת אֶת הַלָּשׁוֹן סְבִיב הֶעָנָף",["נוֹשֶׁכֶת אֶת הַגֶּזַע","מְנַעֲנַעַת אֶת הָעֵץ","קוֹפֶצֶת גָּבוֹהַּ"]],
  ["לְמָה דּוֹמִים הַכְּתָמִים שֶׁל הַגִּ'ירָפָה?","לִטְבִיעוֹת אֶצְבָּעוֹת שֶׁל אֲנָשִׁים",["לְפַסִּים שֶׁל זֶבְּרָה","לְכוֹכָבִים בַּשָּׁמַיִם","לְעָלִים שֶׁל עֵץ"]],
  ["לָמָּה קָשֶׁה לַגִּ'ירָפָה לִשְׁתּוֹת?","כִּי הִיא צְרִיכָה לְפַשֵּׂק רַגְלַיִם וּלְהוֹרִיד אֶת הָרֹאשׁ",["כִּי הִיא אֵינָהּ אוֹהֶבֶת מַיִם","כִּי הַלָּשׁוֹן שֶׁלָּהּ קְצָרָה","כִּי אֵין מַיִם בַּסְּבִיבָה"]],
  ["אֵיךְ שׁוֹמְרוֹת הַגִּ'ירָפוֹת עַל עַצְמָן בִּזְמַן הַשְּׁתִיָּה?","אַחַת שׁוֹתָה וְהָאֲחֵרוֹת שׁוֹמְרוֹת",["כֻּלָּן שׁוֹתוֹת מַהֵר יַחַד","הֵן שׁוֹתוֹת רַק בַּלַּיְלָה","הֵן מִתְחַבְּאוֹת בַּמַּיִם"]],
  ["כַּמָּה יְשֵׁנָה הַגִּ'ירָפָה?","מְעַט מְאוֹד, כַּמָּה דַּקּוֹת בְּכָל פַּעַם",["כָּל הַיּוֹם","כָּל הַלַּיְלָה","חֳדָשִׁים שְׁלֵמִים בַּחֹרֶף"]],
  ["מָה יוֹדֵעַ לַעֲשׂוֹת גּוּר גִּ'ירָפָה שָׁעָה אַחֲרֵי שֶׁנּוֹלַד?","לַעֲמֹד עַל הָרַגְלַיִם",["לָעוּף","לִשְׂחוֹת","לָצוּד"]]
 ]},
{id:"kite", icon:"🪁", title:"הָעֲפִיפוֹן",
 text:"סָבָא יִצְחָק וְהַנֶּכֶד שֶׁלּוֹ, אֵיתָן, הֶחְלִיטוּ לִבְנוֹת עֲפִיפוֹן. אֵיתָן רָצָה לִקְנוֹת עֲפִיפוֹן מוּכָן בַּחֲנוּת, אֲבָל סָבָא אָמַר: עֲפִיפוֹן שֶׁבּוֹנִים לְבַד עָף גָּבוֹהַּ יוֹתֵר.\nהֵם לָקְחוּ שְׁנֵי מַקְלוֹת דַּקִּים וְקָשְׁרוּ אוֹתָם בְּצוּרַת צְלָב. עַל הַמַּקְלוֹת הֵם מָתְחוּ נְיָר צִבְעוֹנִי וְהִדְבִּיקוּ אוֹתוֹ. אֵיתָן צִיֵּר עַל הַנְּיָר פַּרְצוּף מְחַיֵּךְ. בַּסּוֹף הוֹסִיפוּ זָנָב אָרֹךְ מִסְּרָטִים.\nבְּיוֹם שַׁבָּת הֵם עָלוּ לַגִּבְעָה. אֵיתָן רָץ עִם הָעֲפִיפוֹן, אֲבָל הוּא נָפַל שׁוּב וְשׁוּב. אֵיתָן הִתְעַצְבֵּן וְאָמַר: הוּא מְקֻלְקָל!\nסָבָא הֵרִים אֶת הָעֲפִיפוֹן וּבָדַק. הוּא לֹא מְקֻלְקָל, אָמַר. פָּשׁוּט אֵין מַסְפִּיק רוּחַ. נְחַכֶּה.\nהֵם יָשְׁבוּ עַל הַדֶּשֶׁא וְאָכְלוּ תַּפּוּחִים. אַחֲרֵי חֲצִי שָׁעָה הֶעָלִים עַל הָעֵצִים הִתְחִילוּ לָנוּעַ. עַכְשָׁו! קָרָא סָבָא.\nאֵיתָן רָץ, וְהָעֲפִיפוֹן עָלָה. גָּבוֹהַּ, גָּבוֹהַּ, עַד שֶׁהַפַּרְצוּף הַמְּחַיֵּךְ נִרְאָה קָטָן כְּמוֹ מַטְבֵּעַ.\nלִפְעָמִים צָרִיךְ רַק קְצָת סַבְלָנוּת, אָמַר סָבָא.",
 qs:[
  ["מָה הֶחְלִיטוּ סָבָא וְאֵיתָן לַעֲשׂוֹת?","לִבְנוֹת עֲפִיפוֹן",["לִקְנוֹת עֲפִיפוֹן","לִבְנוֹת סִירָה","לִשְׁתֹּל עֵץ"]],
  ["מָה רָצָה אֵיתָן בַּהַתְחָלָה?","לִקְנוֹת עֲפִיפוֹן מוּכָן",["לִבְנוֹת עֲפִיפוֹן לְבַד","לְצַיֵּר צִיּוּר","לְשַׂחֵק בְּכַדּוּר"]],
  ["מָה צִיֵּר אֵיתָן עַל הָעֲפִיפוֹן?","פַּרְצוּף מְחַיֵּךְ",["שֶׁמֶשׁ","צִפּוֹר","אֶת הַשֵּׁם שֶׁלּוֹ"]],
  ["מִמָּה עָשׂוּ אֶת הַזָּנָב?","מִסְּרָטִים",["מֵחֶבֶל עָבֶה","מִנּוֹצוֹת","מֵעָלִים"]],
  ["לָמָּה הָעֲפִיפוֹן נָפַל שׁוּב וְשׁוּב?","כִּי לֹא הָיְתָה מַסְפִּיק רוּחַ",["כִּי הוּא הָיָה מְקֻלְקָל","כִּי אֵיתָן רָץ לְאַט","כִּי הַזָּנָב הָיָה קָצָר"]],
  ["אֵיךְ יָדַע סָבָא שֶׁהִגִּיעָה הָרוּחַ?","הֶעָלִים עַל הָעֵצִים הִתְחִילוּ לָנוּעַ",["הוּא שָׁמַע אֶת זֶה בָּרַדְיוֹ","הִתְחִיל לָרֶדֶת גֶּשֶׁם","הַצִּפּוֹרִים עָפוּ"]],
  ["מָה עָשׂוּ סָבָא וְאֵיתָן בִּזְמַן שֶׁחִכּוּ?","יָשְׁבוּ וְאָכְלוּ תַּפּוּחִים",["חָזְרוּ הַבַּיְתָה","בָּנוּ עֲפִיפוֹן חָדָשׁ","שִׂחֲקוּ בְּמַחֲבוֹאִים"]],
  ["מָה אֵיתָן לָמַד בַּסּוֹף?","שֶׁלִּפְעָמִים צָרִיךְ סַבְלָנוּת",["שֶׁעֲפִיפוֹנִים אֵינָם עָפִים","שֶׁעָדִיף לִקְנוֹת בַּחֲנוּת","שֶׁאָסוּר לָרוּץ עַל גִּבְעָה"]]
 ]},
{id:"paper", icon:"📄", title:"מֵאֵיפֹה בָּא הַנְּיָר?",
 text:"הַמַּחְבֶּרֶת שֶׁלָּכֶם, הַסֵּפֶר שֶׁאַתֶּם קוֹרְאִים וְגַם קֻפְסַת הַקַּרְטוֹן עֲשׂוּיִים מֵאוֹתוֹ חֹמֶר: עֵץ.\nכְּדֵי לְיַצֵּר נְיָר כּוֹרְתִים עֵצִים וּמְקַלְּפִים מֵהֶם אֶת הַקְּלִפָּה. אַחַר כָּךְ טוֹחֲנִים אֶת הָעֵץ לִפְתִיתִים קְטַנִּים וּמְבַשְּׁלִים אוֹתָם בְּמַיִם. כָּךְ מִתְקַבֶּלֶת עִסָּה רַכָּה וּרְטֻבָּה.\nאֶת הָעִסָּה מוֹרְחִים בְּשִׁכְבָה דַּקָּה מְאוֹד עַל רֶשֶׁת גְּדוֹלָה. הַמַּיִם מְטַפְטְפִים הַחוּצָה, וְגַלְגַּלִּים כְּבֵדִים וְחַמִּים לוֹחֲצִים אֶת הָעִסָּה וּמְיַבְּשִׁים אוֹתָהּ. בַּסּוֹף מְגַלְגְּלִים אֶת הַנְּיָר לְגָלִיל עֲנָקִי וְחוֹתְכִים אוֹתוֹ לְדַפִּים.\nכְּדֵי לְיַצֵּר נְיָר צָרִיךְ הַרְבֵּה עֵצִים וְהַרְבֵּה מַיִם. לָכֵן חָשׁוּב לֹא לְבַזְבֵּז נְיָר. אֶפְשָׁר לִכְתֹּב עַל שְׁנֵי הַצְּדָדִים שֶׁל הַדַּף.\nנְיָר מְשֻׁמָּשׁ אֶפְשָׁר לְמַחְזֵר. זוֹרְקִים אוֹתוֹ לְפַח מְיֻחָד, וּבַמִּפְעָל מְפָרְקִים אוֹתוֹ שׁוּב לְעִסָּה וּמְכִינִים מִמֶּנָּה נְיָר חָדָשׁ. כָּךְ כּוֹרְתִים פָּחוֹת עֵצִים.\nלִפְנֵי שֶׁהִמְצִיאוּ אֶת הַנְּיָר, אֲנָשִׁים כָּתְבוּ עַל אֲבָנִים, עַל לוּחוֹת חֵמָר וְעַל עוֹרוֹת שֶׁל בַּעֲלֵי חַיִּים.",
 qs:[
  ["מֵאֵיזֶה חֹמֶר עוֹשִׂים נְיָר?","מֵעֵץ",["מֵאֶבֶן","מֵחוֹל","מִצֶּמֶר"]],
  ["מָה עוֹשִׂים לָעֵץ אַחֲרֵי שֶׁמְּקַלְּפִים אוֹתוֹ?","טוֹחֲנִים אוֹתוֹ לִפְתִיתִים וּמְבַשְּׁלִים בְּמַיִם",["צוֹבְעִים אוֹתוֹ בְּלָבָן","שׂוֹרְפִים אוֹתוֹ","מְיַבְּשִׁים אוֹתוֹ בַּשֶּׁמֶשׁ שָׁנָה"]],
  ["מָה מִתְקַבֵּל אַחֲרֵי הַבִּשּׁוּל?","עִסָּה רַכָּה וּרְטֻבָּה",["אַבְקָה יְבֵשָׁה","לוּחַ קָשֶׁה","נוֹזֵל שָׁקוּף"]],
  ["מָה עוֹשִׂים הַגַּלְגַּלִּים הַכְּבֵדִים?","לוֹחֲצִים וּמְיַבְּשִׁים אֶת הָעִסָּה",["חוֹתְכִים אֶת הָעֵצִים","צוֹבְעִים אֶת הַנְּיָר","מְגַלְגְּלִים אֶת הָעֵצִים לַמִּפְעָל"]],
  ["לָמָּה חָשׁוּב לֹא לְבַזְבֵּז נְיָר?","כִּי צָרִיךְ הַרְבֵּה עֵצִים וּמַיִם כְּדֵי לְיַצֵּר אוֹתוֹ",["כִּי נְיָר כָּבֵד מְאוֹד","כִּי אָסוּר לִכְתֹּב","כִּי נְיָר מִתְקַלְקֵל מַהֵר"]],
  ["אֵיזוֹ עֵצָה נוֹתֵן הַקֶּטַע לְחִסָּכוֹן בִּנְיָר?","לִכְתֹּב עַל שְׁנֵי הַצְּדָדִים שֶׁל הַדַּף",["לִכְתֹּב בְּאוֹתִיּוֹת גְּדוֹלוֹת","לֹא לְהִשְׁתַּמֵּשׁ בְּמַחְבָּרוֹת","לִקְרֹעַ דַּפִּים רֵיקִים"]],
  ["מָה קוֹרֶה לִנְיָר שֶׁמְּמַחְזְרִים?","מְכִינִים מִמֶּנּוּ נְיָר חָדָשׁ",["שׂוֹרְפִים אוֹתוֹ","קוֹבְרִים אוֹתוֹ בָּאֲדָמָה","הוֹפְכִים אוֹתוֹ לְעֵץ"]],
  ["עַל מָה כָּתְבוּ אֲנָשִׁים לִפְנֵי שֶׁהָיָה נְיָר?","עַל אֲבָנִים, חֵמָר וְעוֹרוֹת",["עַל עָלִים שֶׁל חַסָּה","עַל מַיִם","עַל זְכוּכִית"]]
 ]},
{id:"newkid", icon:"🎒", title:"הַיֶּלֶד הֶחָדָשׁ",
 text:"בְּאֶמְצַע הַשָּׁנָה הִגִּיעַ לְכִתָּה ב' תַּלְמִיד חָדָשׁ. קוֹרְאִים לוֹ לִיאוֹ, וְהוּא בָּא מֵאֶרֶץ אַחֶרֶת. הוּא עֲדַיִן לֹא יָדַע עִבְרִית.\nבַּהַפְסָקָה הָרִאשׁוֹנָה לִיאוֹ עָמַד לְבַד לְיַד הַגָּדֵר. הַיְּלָדִים שִׂחֲקוּ בְּכַדּוּרֶגֶל וְלֹא שָׂמוּ לֵב אֵלָיו.\nאוֹפִיר רָאָה אוֹתוֹ. הוּא נִזְכַּר אֵיךְ הִרְגִּישׁ בְּעַצְמוֹ בַּיּוֹם הָרִאשׁוֹן בַּקַּיְטָנָה, כְּשֶׁלֹּא הִכִּיר אַף אֶחָד. אוֹפִיר נִגַּשׁ אֶל לִיאוֹ, הִצְבִּיעַ עַל הַכַּדּוּר וְעָשָׂה תְּנוּעָה שֶׁל בְּעִיטָה. לִיאוֹ חִיֵּךְ וְהִנְהֵן.\nהִתְבָּרֵר שֶׁלִּיאוֹ שַׂחְקָן מְצֻיָּן. הוּא הִבְקִיעַ שְׁנֵי שְׁעָרִים, וְכָל הַקְּבוּצָה מָחֲאָה לוֹ כַּפַּיִם.\nבַּיָּמִים הַבָּאִים לִמֵּד אוֹפִיר אֶת לִיאוֹ מִלָּה חֲדָשָׁה בְּכָל הַפְסָקָה: כַּדּוּר, שַׁעַר, חָבֵר. לִיאוֹ לִמֵּד אֶת אוֹפִיר אֵיךְ אוֹמְרִים תּוֹדָה בַּשָּׂפָה שֶׁלּוֹ.\nאַחֲרֵי חָדְשַׁיִם לִיאוֹ כְּבָר דִּבֵּר עִבְרִית, עִם מִבְטָא קְצָת מַצְחִיק. בִּמְסִבַּת סוֹף הַשָּׁנָה הוּא קָם וְאָמַר: בַּיּוֹם הָרִאשׁוֹן פָּחַדְתִּי. הַיּוֹם יֵשׁ לִי כִּתָּה שְׁלֵמָה שֶׁל חֲבֵרִים.",
 qs:[
  ["מָה הָיָה מְיֻחָד בַּתַּלְמִיד הֶחָדָשׁ?","הוּא בָּא מֵאֶרֶץ אַחֶרֶת וְלֹא יָדַע עִבְרִית",["הוּא הָיָה הַגָּבוֹהַּ בַּכִּתָּה","הוּא כְּבָר הִכִּיר אֶת כֻּלָּם","הוּא הָיָה אָחִיו שֶׁל אוֹפִיר"]],
  ["אֵיפֹה עָמַד לִיאוֹ בַּהַפְסָקָה הָרִאשׁוֹנָה?","לְבַד לְיַד הַגָּדֵר",["בְּאֶמְצַע הַמִּגְרָשׁ","בַּכִּתָּה","לְיַד הַמּוֹרָה"]],
  ["לָמָּה אוֹפִיר נִגַּשׁ אֶל לִיאוֹ?","כִּי נִזְכַּר אֵיךְ זֶה לֹא לְהַכִּיר אַף אֶחָד",["כִּי הַמּוֹרָה בִּקְּשָׁה מִמֶּנּוּ","כִּי חָסֵר לָהֶם שׁוֹעֵר","כִּי לִיאוֹ קָרָא לוֹ"]],
  ["אֵיךְ הִזְמִין אוֹפִיר אֶת לִיאוֹ לְשַׂחֵק?","בִּתְנוּעוֹת, בְּלִי מִלִּים",["בְּמִכְתָּב","בַּשָּׂפָה שֶׁל לִיאוֹ","דֶּרֶךְ הַמּוֹרָה"]],
  ["מָה הִתְבָּרֵר עַל לִיאוֹ?","שֶׁהוּא שַׂחְקָן כַּדּוּרֶגֶל מְצֻיָּן",["שֶׁהוּא אֵינוֹ אוֹהֵב לְשַׂחֵק","שֶׁהוּא יוֹדֵעַ עִבְרִית","שֶׁהוּא רָץ לְאַט"]],
  ["מָה לִמְּדוּ הַיְּלָדִים זֶה אֶת זֶה?","אוֹפִיר לִמֵּד מִלִּים בְּעִבְרִית, וְלִיאוֹ לִמֵּד לוֹמַר תּוֹדָה בִּשְׂפָתוֹ",["שְׁנֵיהֶם לָמְדוּ חֶשְׁבּוֹן","לִיאוֹ לִמֵּד אֶת אוֹפִיר לִבְעֹט","הֵם לָמְדוּ לְצַיֵּר"]],
  ["כַּמָּה זְמַן עָבַר עַד שֶׁלִּיאוֹ דִּבֵּר עִבְרִית?","חָדְשַׁיִם",["יוֹמַיִם","שָׁבוּעַ","שָׁנָה"]],
  ["מָה אָמַר לִיאוֹ בַּמְּסִבָּה?","שֶׁהוּא פָּחַד בַּהַתְחָלָה וְעַכְשָׁו יֵשׁ לוֹ חֲבֵרִים רַבִּים",["שֶׁהוּא רוֹצֶה לַחְזֹר לְאַרְצוֹ","שֶׁהוּא לֹא אוֹהֵב כַּדּוּרֶגֶל","שֶׁהָעִבְרִית קָלָה מְאוֹד"]]
 ]},
{id:"octopus", icon:"🐙", title:"הַתְּמָנוּן",
 text:"הַתְּמָנוּן הוּא אֶחָד מִבַּעֲלֵי הַחַיִּים הַמּוּזָרִים בַּיָּם. יֵשׁ לוֹ שְׁמוֹנֶה זְרוֹעוֹת, וּמִכָּאן שְׁמוֹ. עַל כָּל זְרוֹעַ יֵשׁ שׁוּרוֹת שֶׁל כַּפְתּוֹרֵי הַצְמָדָה, שֶׁבְּעֶזְרָתָם הוּא נֶאֱחָז בִּסְלָעִים וְתוֹפֵס אֹכֶל.\nלַתְּמָנוּן אֵין עֲצָמוֹת בִּכְלָל. הַגּוּף שֶׁלּוֹ רַךְ וְגָמִישׁ, וְלָכֵן הוּא יָכוֹל לְהִדָּחֵק דֶּרֶךְ סֶדֶק צַר מְאוֹד. תְּמָנוּן גָּדוֹל יָכוֹל לְהִכָּנֵס לְתוֹךְ צִנְצֶנֶת קְטַנָּה!\nיֵשׁ לוֹ שְׁלוֹשָׁה לְבָבוֹת, וְהַדָּם שֶׁלּוֹ כָּחֹל.\nהַתְּמָנוּן נֶחְשָׁב לְחַיָּה חֲכָמָה מְאוֹד. בְּמַעְבָּדוֹת רָאוּ תְּמָנוּנִים שֶׁלָּמְדוּ לִפְתֹּחַ מִכְסֶה שֶׁל צִנְצֶנֶת כְּדֵי לְהוֹצִיא מִמֶּנָּה סַרְטָן.\nכְּשֶׁהַתְּמָנוּן בְּסַכָּנָה, יֵשׁ לוֹ כַּמָּה דְּרָכִים לְהִנָּצֵל. הוּא יָכוֹל לְשַׁנּוֹת אֶת צִבְעוֹ וּלְהֵרָאוֹת כְּמוֹ סֶלַע אוֹ חוֹל. הוּא יָכוֹל גַּם לְהַתִּיז עֲנַן דְּיוֹ שָׁחֹר. הַדְּיוֹ מַסְתִּיר אוֹתוֹ, וּבֵינְתַיִם הוּא בּוֹרֵחַ.\nוְאִם דָּג טוֹרֵף תּוֹפֵס אוֹתוֹ בַּזְּרוֹעַ? הַתְּמָנוּן מְוַתֵּר עַל הַזְּרוֹעַ וּבוֹרֵחַ. אַחֲרֵי כַּמָּה שָׁבוּעוֹת תִּצְמַח לוֹ זְרוֹעַ חֲדָשָׁה.",
 qs:[
  ["כַּמָּה זְרוֹעוֹת יֵשׁ לַתְּמָנוּן?","שְׁמוֹנֶה",["שֵׁשׁ","עֶשֶׂר","אַרְבַּע"]],
  ["בִּשְׁבִיל מָה כַּפְתּוֹרֵי הַהַצְמָדָה?","כְּדֵי לְהֵאָחֵז בִּסְלָעִים וְלִתְפֹּס אֹכֶל",["כְּדֵי לִנְשֹׁם","כְּדֵי לִרְאוֹת בַּחֹשֶׁךְ","כְּדֵי לִשְׁמֹעַ"]],
  ["לָמָּה הַתְּמָנוּן יָכוֹל לְהִדָּחֵק דֶּרֶךְ סֶדֶק צַר?","כִּי אֵין לוֹ עֲצָמוֹת",["כִּי הוּא קָטָן מְאוֹד","כִּי הוּא חָזָק מְאוֹד","כִּי הוּא שׁוֹבֵר אֶת הַסֶּלַע"]],
  ["כַּמָּה לְבָבוֹת יֵשׁ לַתְּמָנוּן?","שְׁלוֹשָׁה",["אֶחָד","שְׁנַיִם","שְׁמוֹנָה"]],
  ["מָה מַרְאֶה שֶׁהַתְּמָנוּן חָכָם?","הוּא לוֹמֵד לִפְתֹּחַ מִכְסֶה שֶׁל צִנְצֶנֶת",["הוּא שׂוֹחֶה מַהֵר","יֵשׁ לוֹ דָּם כָּחֹל","הוּא גָּדוֹל מְאוֹד"]],
  ["בִּשְׁבִיל מָה הַתְּמָנוּן מַתִּיז דְּיוֹ?","כְּדֵי לְהִסְתַּתֵּר וְלִבְרֹחַ",["כְּדֵי לְצַיֵּר","כְּדֵי לִתְפֹּס דָּגִים","כְּדֵי לְנַקּוֹת אֶת הַמַּיִם"]],
  ["אֵיךְ עוֹד מִתְחַבֵּא הַתְּמָנוּן?","מְשַׁנֶּה אֶת צִבְעוֹ כְּמוֹ סֶלַע אוֹ חוֹל",["נִכְנָס לְקוֹנְכִיָּה שֶׁלּוֹ","עוֹלֶה אֶל הַחוֹף","קוֹפֵץ מֵהַמַּיִם"]],
  ["מָה קוֹרֶה אִם הַתְּמָנוּן מְאַבֵּד זְרוֹעַ?","צוֹמַחַת לוֹ זְרוֹעַ חֲדָשָׁה",["הוּא אֵינוֹ יָכוֹל לִשְׂחוֹת יוֹתֵר","הוּא נִשְׁאָר עִם שֶׁבַע לְתָמִיד","הוּא לוֹקֵחַ זְרוֹעַ מִתְּמָנוּן אַחֵר"]]
 ]},
{id:"chess", icon:"♟️", title:"מִשְׂחַק הַשַּׁחְמָט",
 text:"בְּכָל יוֹם שִׁשִּׁי אַחַר הַצָּהֳרַיִם שִׂחֲקָה הִילָה שַׁחְמָט עִם סָבְתָא מִרְיָם. סָבְתָא שִׂחֲקָה שַׁחְמָט כְּבָר חֲמִשִּׁים שָׁנָה, וְתָמִיד נִצְּחָה.\nהִילָה לֹא אָהֲבָה לְהַפְסִיד. פַּעַם אַחַת, כְּשֶׁסָּבְתָא לָקְחָה לָהּ אֶת הַמַּלְכָּה, הִיא הָפְכָה אֶת הַלּוּחַ וְכָל הַכֵּלִים הִתְפַּזְּרוּ עַל הָרִצְפָּה.\nסָבְתָא לֹא כָּעֲסָה. הִיא אָסְפָה אֶת הַכֵּלִים בְּשֶׁקֶט וְאָמְרָה: גַּם אֲנִי הִפְסַדְתִּי מֵאוֹת פְּעָמִים לְאַבָּא שֶׁלִּי. כָּל הֶפְסֵד לִמֵּד אוֹתִי מַשֶּׁהוּ. אִם תִּרְצִי, אַרְאֶה לָךְ אֵיפֹה טָעִית.\nהִילָה הִתְבַּיְּשָׁה וְעָזְרָה לֶאֱסֹף. מֵאוֹתוֹ יוֹם, אַחֲרֵי כָּל מִשְׂחָק, הֵן חָזְרוּ יַחַד עַל הַמַּהֲלָכִים. הִילָה כָּתְבָה בְּמַחְבֶּרֶת קְטַנָּה אֶת מָה שֶׁלָּמְדָה: לֹא לְמַהֵר, לְהִסְתַּכֵּל עַל כָּל הַלּוּחַ, לִשְׁמֹר עַל הַמַּלְכָּה.\nעָבְרוּ חֳדָשִׁים. יוֹם שִׁשִּׁי אֶחָד הִילָה הֵזִיזָה אֶת הַצְּרִיחַ וְאָמְרָה בְּקוֹל שָׁקֵט: שַׁח מָט.\nסָבְתָא הִסְתַּכְּלָה עַל הַלּוּחַ זְמַן רַב. אַחַר כָּךְ קָמָה, חִבְּקָה אֶת הִילָה וְאָמְרָה: זֶה הַהֶפְסֵד הַמְּתוֹק בְּיוֹתֵר שֶׁהָיָה לִי.",
 qs:[
  ["מָתַי שִׂחֲקוּ הִילָה וְסָבְתָא שַׁחְמָט?","בְּכָל יוֹם שִׁשִּׁי אַחַר הַצָּהֳרַיִם",["בְּכָל בֹּקֶר","בְּשַׁבָּת בַּלַּיְלָה","פַּעַם בְּחֹדֶשׁ"]],
  ["כַּמָּה שָׁנִים סָבְתָא מְשַׂחֶקֶת שַׁחְמָט?","חֲמִשִּׁים שָׁנָה",["חָמֵשׁ שָׁנִים","עֶשֶׂר שָׁנִים","שָׁנָה אַחַת"]],

{id:"sleep", icon:"😴", title:"לָמָּה אֲנַחְנוּ יְשֵׁנִים?",
 text:"בְּכָל לַיְלָה אֲנַחְנוּ שׁוֹכְבִים בַּמִּטָּה, עוֹצְמִים עֵינַיִם וְנִרְדָּמִים. אֲבָל לָמָּה בִּכְלָל צָרִיךְ לִישֹׁן?\nבִּזְמַן הַשֵּׁנָה הַגּוּף נָח, אֲבָל הוּא אֵינוֹ מַפְסִיק לַעֲבֹד. הַלֵּב מַמְשִׁיךְ לִפְעֹם וְהָרֵאוֹת מַמְשִׁיכוֹת לִנְשֹׁם. בַּלַּיְלָה הַגּוּף מְתַקֵּן אֶת עַצְמוֹ: פְּצָעִים נִרְפָּאִים וְהַשְּׁרִירִים מִתְחַזְּקִים. יְלָדִים גַּם גְּדֵלִים בְּעִקָּר בִּזְמַן הַשֵּׁנָה.\nגַּם הַמֹּחַ עָסוּק מְאוֹד בַּלַּיְלָה. הוּא מְסַדֵּר אֶת כָּל מָה שֶׁלָּמַדְנוּ בְּמֶשֶׁךְ הַיּוֹם, כְּמוֹ סַפְרָן שֶׁמַּחְזִיר סְפָרִים לַמַּדָּפִים. לָכֵן מִי שֶׁיָּשֵׁן טוֹב זוֹכֵר טוֹב יוֹתֵר אֶת מָה שֶׁלָּמַד.\nבִּזְמַן הַשֵּׁנָה אֲנַחְנוּ גַּם חוֹלְמִים. כָּל אָדָם חוֹלֵם כַּמָּה חֲלוֹמוֹת בְּכָל לַיְלָה, אֲבָל בַּבֹּקֶר אֲנַחְנוּ שׁוֹכְחִים אֶת רֻבָּם.\nיְלָדִים בְּגִיל בֵּית הַסֵּפֶר צְרִיכִים לִישֹׁן בְּעֵרֶךְ עֶשֶׂר שָׁעוֹת בְּכָל לַיְלָה. מִי שֶׁיָּשֵׁן פָּחוֹת מִדַּי מַרְגִּישׁ עָיֵף, מִתְרַגֵּז בְּקַלּוּת וּמִתְקַשֶּׁה לְהִתְרַכֵּז.\nכְּדֵי לְהֵרָדֵם בְּקַלּוּת, כְּדַאי לְכַבּוֹת מָסַכִּים שָׁעָה לִפְנֵי הַשֵּׁנָה. הָאוֹר שֶׁל הַמָּסָךְ מְבַלְבֵּל אֶת הַמֹּחַ, וְהוּא חוֹשֵׁב שֶׁעֲדַיִן יוֹם.",

  ["מָה קוֹרֶה לַגּוּף בִּזְמַן הַשֵּׁנָה?","הוּא נָח אֲבָל מַמְשִׁיךְ לַעֲבֹד",["הוּא מַפְסִיק לַעֲבֹד לְגַמְרֵי","הוּא מִתְקָרֵר מְאוֹד","הוּא מַפְסִיק לִנְשֹׁם"]],

 text:"בַּלַּיְלָה שֶׁלִּפְנֵי הָאֶחָד בְּסֶפְּטֶמְבֶּר עָדִי לֹא הִצְלִיחָה לְהֵרָדֵם. מָחָר הִיא עוֹלָה לְכִתָּה א'. הַתִּיק הֶחָדָשׁ עָמַד לְיַד הַמִּטָּה, וּבְתוֹכוֹ קַלְמָר, מַחְבָּרוֹת וּבַקְבּוּק מַיִם.\nעָדִי חָשְׁבָה: מָה אִם לֹא אֶמְצָא אֶת הַכִּתָּה? מָה אִם לֹא יִהְיוּ לִי חֲבֵרוֹת? בַּגַּן הִיא הִכִּירָה אֶת כֻּלָּם, וְכָאן הַכֹּל חָדָשׁ.\nבַּבֹּקֶר לִוָּה אוֹתָהּ אַבָּא עַד הַשַּׁעַר. בַּחָצֵר עָמְדוּ יְלָדִים גְּדוֹלִים מִכִּתָּה ו', וּבַיָּדַיִם שֶׁלָּהֶם שְׁלָטִים צִבְעוֹנִיִּים. נַעֲרָה גְּבוֹהָה חִיְּכָה אֶל עָדִי וְאָמְרָה: אֲנִי רוֹתֶם. אֲנִי אֶקַּח אוֹתָךְ לַכִּתָּה.\nבַּכִּתָּה יָשְׁבָה עָדִי לְיַד יַלְדָּה עִם צַמּוֹת. גַּם הִיא נִרְאֲתָה מֻדְאֶגֶת. עָדִי פָּתְחָה אֶת הַקַּלְמָר וְרָאֲתָה שֶׁלַּיַּלְדָּה אֵין מַחַק. הִיא הוֹשִׁיטָה לָהּ אֶת הַמַּחַק שֶׁלָּהּ. הַיַּלְדָּה חִיְּכָה וְאָמְרָה: תּוֹדָה. קוֹרְאִים לִי נֹגָה.\nבַּהַפְסָקָה הֵן שִׂחֲקוּ יַחַד בְּקְלָאס. כְּשֶׁאַבָּא בָּא לֶאֱסֹף אוֹתָהּ, עָדִי רָצָה אֵלָיו וְצָעֲקָה: אַבָּא, יֵשׁ לִי חֲבֵרָה! וּמָחָר אֲנִי רוֹצָה לָבוֹא שׁוּב!",
 qs:[
  ["לָמָּה עָדִי לֹא הִצְלִיחָה לְהֵרָדֵם?","כִּי לְמָחֳרָת הִיא עוֹלָה לְכִתָּה א'",["כִּי הָיָה רַעַשׁ בַּחוּץ","כִּי הִיא לֹא הָיְתָה עֲיֵפָה","כִּי הִיא אִבְּדָה אֶת הַתִּיק"]],
  ["מָה הָיָה בַּתִּיק שֶׁל עָדִי?","קַלְמָר, מַחְבָּרוֹת וּבַקְבּוּק מַיִם",["צַעֲצוּעִים וּבֻבּוֹת","בְּגָדִים","סְפָרִים שֶׁל כִּתָּה ו'"]],
  ["מִמָּה חָשְׁשָׁה עָדִי?","שֶׁלֹּא תִּמְצָא אֶת הַכִּתָּה וְלֹא יִהְיוּ לָהּ חֲבֵרוֹת",["שֶׁהַמּוֹרָה תִּכְעַס","שֶׁהַתִּיק כָּבֵד מִדַּי","שֶׁאַבָּא יְאַחֵר"]],
  ["מִי לָקַח אֶת עָדִי לַכִּתָּה?","רוֹתֶם מִכִּתָּה ו'",["אַבָּא","הַמּוֹרָה","נֹגָה"]],
  ["מָה רָאֲתָה עָדִי אֵצֶל הַיַּלְדָּה שֶׁלְּיָדָהּ?","שֶׁאֵין לָהּ מַחַק",["שֶׁאֵין לָהּ תִּיק","שֶׁהִיא בּוֹכָה","שֶׁהִיא יְשֵׁנָה"]],
  ["מָה עָשְׂתָה עָדִי?","הוֹשִׁיטָה לַיַּלְדָּה אֶת הַמַּחַק שֶׁלָּהּ",["קָרְאָה לַמּוֹרָה","הִתְעַלְּמָה","עָבְרָה לְשֻׁלְחָן אַחֵר"]],
  ["בְּמָה שִׂחֲקוּ עָדִי וְנֹגָה בַּהַפְסָקָה?","בִּקְלָאס",["בְּכַדּוּרֶגֶל","בְּמַחֲבוֹאִים","בִּקְפִיצָה בְּחֶבֶל"]],
  ["אֵיךְ הִרְגִּישָׁה עָדִי בְּסוֹף הַיּוֹם?","שְׂמֵחָה וְרוֹצָה לָבוֹא שׁוּב",["עֲצוּבָה וּמְאֻכְזֶבֶת","כּוֹעֶסֶת עַל אַבָּא","מְפֻחֶדֶת כְּמוֹ בַּלַּיְלָה"]]
 ]},
{id:"wind", icon:"🌬️", title:"מֵאֵיפֹה בָּאָה הָרוּחַ?",
 text:"אֶת הָרוּחַ אִי אֶפְשָׁר לִרְאוֹת, אֲבָל אֶפְשָׁר לְהַרְגִּישׁ אוֹתָהּ עַל הַפָּנִים וְלִרְאוֹת מָה הִיא עוֹשָׂה: הִיא מְזִיזָה עָלִים, מְנִיפָה דְּגָלִים וְדוֹחֶפֶת עֲנָנִים.\nהָרוּחַ הִיא אֲוִיר שֶׁזָּז מִמָּקוֹם לְמָקוֹם. וְלָמָּה הָאֲוִיר זָז? בִּגְלַל הַשֶּׁמֶשׁ. הַשֶּׁמֶשׁ מְחַמֶּמֶת אֶת הָאֲדָמָה, וְהָאֲדָמָה מְחַמֶּמֶת אֶת הָאֲוִיר שֶׁמֵּעָלֶיהָ. אֲוִיר חַם קַל יוֹתֵר, וְלָכֵן הוּא עוֹלֶה לְמַעְלָה. אֶל הַמָּקוֹם שֶׁהִתְפַּנָּה נִכְנָס אֲוִיר קַר מֵהַסְּבִיבָה. הַתְּנוּעָה הַזֹּאת הִיא הָרוּחַ.\nיֵשׁ רוּחַ קַלָּה וּנְעִימָה שֶׁנִּקְרֵאת בְּרִיזָה, וְיֵשׁ רוּחַ חֲזָקָה מְאוֹד שֶׁנִּקְרֵאת סְעָרָה. סְעָרָה יְכוֹלָה לַעֲקֹר עֵצִים וּלְהָעִיף גַּגּוֹת.\nבְּנֵי אָדָם לָמְדוּ לְהִשְׁתַּמֵּשׁ בָּרוּחַ. לִפְנֵי שָׁנִים רַבּוֹת הָרוּחַ דָּחֲפָה סְפִינוֹת מִפְרָשִׂים בַּיָּם וְסוֹבְבָה טַחֲנוֹת שֶׁטָּחֲנוּ חִטָּה לְקֶמַח. הַיּוֹם יֵשׁ טוּרְבִּינוֹת רוּחַ גְּבוֹהוֹת עִם שְׁלוֹשָׁה לַהֲבִים. הָרוּחַ מְסוֹבֶבֶת אֶת הַלְּהָבִים, וְכָךְ מְיַצְּרִים חַשְׁמַל בְּלִי לְזַהֵם אֶת הָאֲוִיר.\nגַּם לַטֶּבַע הָרוּחַ עוֹזֶרֶת: הִיא נוֹשֵׂאת זְרָעִים שֶׁל צְמָחִים לִמְקוֹמוֹת רְחוֹקִים, וְשָׁם הֵם נוֹבְטִים.",
 qs:[
  ["מָה הִיא הָרוּחַ?","אֲוִיר שֶׁזָּז מִמָּקוֹם לְמָקוֹם",["מַיִם שֶׁעָפִים בָּאֲוִיר","עָנָן שָׁקוּף","אוֹר שֶׁל הַשֶּׁמֶשׁ"]],
  ["מָה גּוֹרֵם לָאֲוִיר לָזוּז?","הַחֹם שֶׁל הַשֶּׁמֶשׁ",["הַיָּרֵחַ","הָעֵצִים","הַגֶּשֶׁם"]],
  ["מָה קוֹרֶה לַאֲוִיר חַם?","הוּא עוֹלֶה לְמַעְלָה",["הוּא יוֹרֵד לְמַטָּה","הוּא נֶעֱלָם","הוּא הוֹפֵךְ לְמַיִם"]],
  ["מָה נִכְנָס לַמָּקוֹם שֶׁהָאֲוִיר הַחַם עָזַב?","אֲוִיר קַר מֵהַסְּבִיבָה",["עָנָן","אֲוִיר חַם יוֹתֵר","שׁוּם דָּבָר"]],
  ["מָה זֹאת בְּרִיזָה?","רוּחַ קַלָּה וּנְעִימָה",["רוּחַ חֲזָקָה מְאוֹד","גֶּשֶׁם חָזָק","סוּג שֶׁל עָנָן"]],
  ["אֵיךְ הִשְׁתַּמְּשׁוּ בָּרוּחַ לִפְנֵי שָׁנִים רַבּוֹת?","לִסְפִינוֹת מִפְרָשִׂים וּלְטַחֲנוֹת קֶמַח",["לְיִצּוּר חַשְׁמַל","לְחִמּוּם בָּתִּים","לְהַשְׁקָיַת שָׂדוֹת"]],
  ["מָה עוֹשׂוֹת טוּרְבִּינוֹת הָרוּחַ?","מְיַצְּרוֹת חַשְׁמַל בְּלִי לְזַהֵם",["מְקָרְרוֹת אֶת הָאֲוִיר","טוֹחֲנוֹת קֶמַח","מְגָרְשׁוֹת עֲנָנִים"]],
  ["אֵיךְ הָרוּחַ עוֹזֶרֶת לַצְּמָחִים?","נוֹשֵׂאת זְרָעִים לִמְקוֹמוֹת רְחוֹקִים",["מַשְׁקָה אוֹתָם","מְחַמֶּמֶת אוֹתָם","מְגִנָּה עֲלֵיהֶם מֵחֲרָקִים"]]
 ]},
{id:"piggybank", icon:"🐷", title:"קֻפַּת הַחִסָּכוֹן",
 text:"רוֹעִי רָצָה מְאוֹד קוֹרְקִינֶט אָדֹם שֶׁרָאָה בַּחֲנוּת. הַקּוֹרְקִינֶט עָלָה מֵאָה וַחֲמִשִּׁים שְׁקָלִים. אִמָּא אָמְרָה: זֶה הַרְבֵּה כֶּסֶף. אִם תַּחְסֹךְ חֲצִי מֵהַסְּכוּם, אֲנִי אוֹסִיף אֶת הַחֵצִי הַשֵּׁנִי.\nרוֹעִי קִבֵּל כָּל שָׁבוּעַ עֲשָׂרָה שְׁקָלִים דְּמֵי כִּיס. עַד עַכְשָׁו הוּא בִּזְבֵּז אוֹתָם מִיָּד עַל מַמְתַּקִּים. הוּא לָקַח קֻפָּה בְּצוּרַת חֲזִיר וְהֶחְלִיט: מֵהַיּוֹם אֲנִי חוֹסֵךְ.\nבַּשָּׁבוּעַ הָרִאשׁוֹן זֶה הָיָה קַל. בַּשָּׁבוּעַ הַשְּׁלִישִׁי, הַחֲבֵרִים קָנוּ אַרְטִיקִים אַחֲרֵי בֵּית הַסֵּפֶר. רוֹעִי עָמַד בַּצַּד, וְהַפֶּה שֶׁלּוֹ הִתְמַלֵּא רִיר. הוּא כִּמְעַט רָץ הַבַּיְתָה לְהוֹצִיא מַטְבֵּעַ. אֲבָל אָז הוּא דִּמְיֵן אֶת עַצְמוֹ דּוֹהֵר עַל הַקּוֹרְקִינֶט, וְהִמְשִׁיךְ לָלֶכֶת.\nכְּדֵי לְהַגִּיעַ מַהֵר יוֹתֵר, רוֹעִי עָזַר לַשְּׁכֵנָה לְהוֹצִיא אֶת הַכֶּלֶב לְטִיּוּל, וְהִיא נָתְנָה לוֹ חֲמִשָּׁה שְׁקָלִים בְּכָל פַּעַם.\nאַחֲרֵי שִׁשָּׁה שָׁבוּעוֹת רוֹעִי שָׁפַךְ אֶת הַמַּטְבְּעוֹת עַל הַשֻּׁלְחָן וְסָפַר. שִׁבְעִים וַחֲמִשָּׁה שְׁקָלִים! אִמָּא הוֹסִיפָה אֶת הַחֵצִי שֶׁלָּהּ, וְהֵם הָלְכוּ יַחַד לַחֲנוּת.\nרוֹעִי אוֹמֵר שֶׁהַקּוֹרְקִינֶט הַזֶּה מָהִיר יוֹתֵר מִכָּל קוֹרְקִינֶט אַחֵר. אוּלַי כִּי הוּא חִכָּה לוֹ כָּל כָּךְ הַרְבֵּה זְמַן.",
 qs:[
  ["מָה רָצָה רוֹעִי לִקְנוֹת?","קוֹרְקִינֶט אָדֹם",["אוֹפַנַּיִם כְּחֻלִּים","כַּדּוּר","כֶּלֶב"]],
  ["מָה הִצִּיעָה אִמָּא?","שֶׁרוֹעִי יַחְסֹךְ חֲצִי וְהִיא תּוֹסִיף חֲצִי",["לִקְנוֹת מִיָּד","לְחַכּוֹת לְיוֹם הַהֻלֶּדֶת","שֶׁרוֹעִי יְשַׁלֵּם הַכֹּל"]],
  ["כַּמָּה דְּמֵי כִּיס קִבֵּל רוֹעִי בְּכָל שָׁבוּעַ?","עֲשָׂרָה שְׁקָלִים",["חֲמִשָּׁה שְׁקָלִים","מֵאָה שְׁקָלִים","שֶׁקֶל אֶחָד"]],
  ["עַל מָה בִּזְבֵּז רוֹעִי אֶת הַכֶּסֶף קֹדֶם?","עַל מַמְתַּקִּים",["עַל סְפָרִים","עַל צַעֲצוּעִים","עַל מַתָּנוֹת"]],
  ["מָה עָזַר לְרוֹעִי לֹא לִקְנוֹת אַרְטִיק?","הוּא דִּמְיֵן אֶת עַצְמוֹ עַל הַקּוֹרְקִינֶט",["אִמָּא אָסְרָה עָלָיו","הָאַרְטִיקִים נִגְמְרוּ","הוּא לֹא אוֹהֵב אַרְטִיקִים"]],

{id:"kangaroo", icon:"🦘", title:"הַקֶּנְגּוּרוּ",
 text:"הַקֶּנְגּוּרוּ חַי בְּאוֹסְטְרַלְיָה, אֶרֶץ רְחוֹקָה מְאוֹד. הוּא אֵינוֹ הוֹלֵךְ וְאֵינוֹ רָץ: הוּא קוֹפֵץ. הָרַגְלַיִם הָאֲחוֹרִיּוֹת שֶׁלּוֹ אֲרֻכּוֹת וַחֲזָקוֹת, וּבִקְפִיצָה אַחַת הוּא עוֹבֵר מֶרְחָק שֶׁל מְכוֹנִית שְׁלֵמָה.\nהַזָּנָב שֶׁל הַקֶּנְגּוּרוּ עָבֶה וְכָבֵד. בִּזְמַן הַקְּפִיצָה הַזָּנָב שׁוֹמֵר עַל שִׁוּוּי הַמִּשְׁקָל, וּכְשֶׁהַקֶּנְגּוּרוּ עוֹמֵד, הוּא נִשְׁעָן עָלָיו כְּמוֹ עַל רֶגֶל שְׁלִישִׁית.\nהַדָּבָר הַמְּיֻחָד בְּיוֹתֵר הוּא הַכִּיס. לָאֵם יֵשׁ כִּיס עַל הַבֶּטֶן. הַגּוּר נוֹלָד קָטָן מְאוֹד, בְּגֹדֶל שֶׁל שְׁעוּעִית. מִיָּד אַחֲרֵי הַלֵּדָה הוּא מְטַפֵּס בְּעַצְמוֹ אֶל הַכִּיס. שָׁם חַם וּבָטוּחַ, וְשָׁם הוּא יוֹנֵק חָלָב וְגָדֵל.\nרַק אַחֲרֵי כַּמָּה חֳדָשִׁים הַגּוּר מוֹצִיא אֶת הָרֹאשׁ וּמִסְתַּכֵּל עַל הָעוֹלָם. אַחַר כָּךְ הוּא יוֹצֵא לִקְפִיצוֹת קְצָרוֹת, אֲבָל כְּשֶׁהוּא נִבְהָל, הוּא קוֹפֵץ מִיָּד בַּחֲזָרָה לַכִּיס, עִם הָרֹאשׁ קָדִימָה.\nהַקֶּנְגּוּרוּ אוֹכֵל עֵשֶׂב וְעָלִים. בַּיּוֹם, כְּשֶׁחַם, הוּא נָח בַּצֵּל, וְהוּא יוֹצֵא לֶאֱכֹל בָּעֶרֶב.\nדָּבָר אֶחָד הַקֶּנְגּוּרוּ אֵינוֹ יָכוֹל לַעֲשׂוֹת: לָלֶכֶת אֲחוֹרָה.",

{id:"babysister", icon:"👶", title:"הָאָחוֹת הַחֲדָשָׁה",
 text:"עַד לִפְנֵי חֹדֶשׁ הָיָה יוֹנָתָן הַיֶּלֶד הַיָּחִיד בַּבַּיִת. וְאָז נוֹלְדָה טַל.\nבַּהַתְחָלָה יוֹנָתָן שָׂמַח. אֲבָל מַהֵר מְאוֹד הוּא שָׂם לֵב שֶׁהַכֹּל הִשְׁתַּנָּה. טַל בָּכְתָה בַּלַּיְלָה וְהֵעִירָה אוֹתוֹ. אִמָּא הָיְתָה עֲיֵפָה, וּכְשֶׁהוּא בִּקֵּשׁ שֶׁתְּשַׂחֵק אִתּוֹ, הִיא אָמְרָה: עוֹד מְעַט, אֲנִי מַאֲכִילָה אֶת טַל. כָּל הָאוֹרְחִים בָּאוּ עִם מַתָּנוֹת לַתִּינֹקֶת וְאָמְרוּ: אֵיזוֹ מְתוּקָה!\nעֶרֶב אֶחָד יוֹנָתָן נִכְנַס לַחֶדֶר שֶׁלּוֹ וְסָגַר אֶת הַדֶּלֶת בְּכֹחַ. אַבָּא דָּפַק וְנִכְנַס. יוֹנָתָן אָמַר בְּשֶׁקֶט: אַף אֶחָד לֹא רוֹאֶה אוֹתִי יוֹתֵר.\nאַבָּא יָשַׁב לְיָדוֹ עַל הַמִּטָּה. הוּא הוֹצִיא מֵהָאָרוֹן אַלְבּוֹם יָשָׁן. בַּתְּמוּנוֹת הָיָה תִּינוֹק קָטָן, וְסָבִיב לוֹ אוֹרְחִים עִם מַתָּנוֹת. מִי זֶה? שָׁאַל יוֹנָתָן. זֶה אַתָּה, אָמַר אַבָּא. גַּם אַתָּה בָּכִיתָ כָּל הַלַּיְלָה. וְאָהַבְנוּ אוֹתְךָ אָז בְּדִיּוּק כְּמוֹ עַכְשָׁו.\nלְמָחֳרָת טַל בָּכְתָה שׁוּב. יוֹנָתָן נִגַּשׁ לָעֲרִיסָה וְעָשָׂה לָהּ פַּרְצוּף מַצְחִיק. טַל הִפְסִיקָה לִבְכּוֹת, הִסְתַּכְּלָה עָלָיו, וּפִתְאוֹם חִיְּכָה. זֶה הָיָה הַחִיּוּךְ הָרִאשׁוֹן שֶׁלָּהּ.\nאִמָּא לָחֲשָׁה: רַק אָח גָּדוֹל יוֹדֵעַ לַעֲשׂוֹת אֶת זֶה.",
 qs:[
  ["מָה הִשְׁתַּנָּה בַּבַּיִת שֶׁל יוֹנָתָן?","נוֹלְדָה לוֹ אָחוֹת",["הֵם עָבְרוּ דִּירָה","הוּא עָבַר בֵּית סֵפֶר","הֵם קִבְּלוּ כֶּלֶב"]],
  ["לָמָּה יוֹנָתָן הִתְעוֹרֵר בַּלֵּילוֹת?","כִּי טַל בָּכְתָה",["כִּי הָיוּ לוֹ חֲלוֹמוֹת רָעִים","כִּי הָאוֹרְחִים הִרְעִישׁוּ","כִּי הָיָה לוֹ חַם"]],
  ["מָה עָנְתָה אִמָּא כְּשֶׁיּוֹנָתָן בִּקֵּשׁ לְשַׂחֵק?","עוֹד מְעַט, אֲנִי מַאֲכִילָה אֶת טַל",["בּוֹא נְשַׂחֵק עַכְשָׁו","לֵךְ לִישֹׁן","שַׂחֵק עִם טַל"]],
  ["אֵיךְ הִרְגִּישׁ יוֹנָתָן?","שֶׁאַף אֶחָד לֹא שָׂם לֵב אֵלָיו",["שֶׁהוּא הֲכִי חָשׁוּב בַּבַּיִת","שֶׁהוּא רוֹצֶה עוֹד אָחוֹת","שֶׁהוּא שָׂמֵחַ מְאוֹד"]],
  ["מָה הֶרְאָה אַבָּא לְיוֹנָתָן?","אַלְבּוֹם עִם תְּמוּנוֹת שֶׁלּוֹ כְּתִינוֹק",["צַעֲצוּעַ חָדָשׁ","סֵפֶר עַל תִּינוֹקוֹת","אֶת הַמַּתָּנוֹת שֶׁל טַל"]],
  ["מָה רָצָה אַבָּא שֶׁיּוֹנָתָן יָבִין?","שֶׁגַּם הוּא קִבֵּל אוֹתָהּ תְּשׂוּמַת לֵב, וְשֶׁאוֹהֲבִים אוֹתוֹ כְּמוֹ תָּמִיד",["שֶׁתִּינוֹקוֹת חֲשׁוּבִים יוֹתֵר","שֶׁהוּא צָרִיךְ לִשְׁתֹּק","שֶׁהָאוֹרְחִים יַחְזְרוּ בִּשְׁבִילוֹ"]],
  ["מָה עָשָׂה יוֹנָתָן כְּשֶׁטַּל בָּכְתָה שׁוּב?","עָשָׂה לָהּ פַּרְצוּף מַצְחִיק",["סָגַר אֶת הַדֶּלֶת","קָרָא לְאִמָּא","שָׂם אָזְנִיּוֹת"]],
  ["מָה קָרָה בִּזְכוּת יוֹנָתָן?","טַל חִיְּכָה בַּפַּעַם הָרִאשׁוֹנָה",["טַל נִרְדְּמָה","טַל אָמְרָה מִלָּה","טַל הִתְחִילָה לָלֶכֶת"]]
 ]},

 text:"לִפְנֵי מִילְיוֹנֵי שָׁנִים, הַרְבֵּה לִפְנֵי שֶׁהָיוּ בְּנֵי אָדָם, חָיוּ עַל כַּדּוּר הָאָרֶץ הַדִּינוֹזָאוּרִים.\nהָיוּ דִּינוֹזָאוּרִים מִסּוּגִים רַבִּים. חֵלֶק הָיוּ עֲנָקִיִּים, אֲרֻכִּים כְּמוֹ שְׁלוֹשָׁה אוֹטוֹבּוּסִים, וְחֵלֶק הָיוּ קְטַנִּים כְּמוֹ תַּרְנְגֹלֶת. חֵלֶק אָכְלוּ רַק צְמָחִים, וַאֲחֵרִים הָיוּ טוֹרְפִים עִם שִׁנַּיִם חַדּוֹת.\nאַף אָדָם לֹא רָאָה דִּינוֹזָאוּר חַי. אָז אֵיךְ אֲנַחְנוּ יוֹדְעִים עֲלֵיהֶם? בִּזְכוּת מְאֻבָּנִים. מְאֻבָּן הוּא עֶצֶם אוֹ טְבִיעַת רֶגֶל שֶׁנִּשְׁמְרָה בְּתוֹךְ סֶלַע בְּמֶשֶׁךְ זְמַן רַב מְאוֹד. חוֹקְרִים חוֹפְרִים בָּאֲדָמָה בִּזְהִירוּת, מוֹצְאִים עֲצָמוֹת וּמְחַבְּרִים אוֹתָן כְּמוֹ פָּאזֶל עֲנָק. כָּךְ הֵם מְגַלִּים אֵיךְ נִרְאָה הַדִּינוֹזָאוּר.\nמֵהַשִּׁנַּיִם אֶפְשָׁר לָדַעַת מָה הוּא אָכַל: שִׁנַּיִם חַדּוֹת שַׁיָּכוֹת לְטוֹרֵף, וְשִׁנַּיִם שְׁטוּחוֹת שַׁיָּכוֹת לְאוֹכֵל צְמָחִים.\nלִפְנֵי כְּשִׁשִּׁים וְשִׁשָּׁה מִילְיוֹן שָׁנָה נֶעֶלְמוּ הַדִּינוֹזָאוּרִים. רֹב הַמַּדְּעָנִים חוֹשְׁבִים שֶׁסֶּלַע עֲנָק מִן הֶחָלָל פָּגַע בְּכַדּוּר הָאָרֶץ. עֲנַן אָבָק כִּסָּה אֶת הַשָּׁמַיִם, נִהְיָה קַר, וְהַצְּמָחִים מֵתוּ.\nאֲבָל לֹא כֻּלָּם נֶעֶלְמוּ. הַמַּדְּעָנִים גִּלּוּ שֶׁהַצִּפּוֹרִים שֶׁל הַיּוֹם הֵן קְרוֹבוֹת מִשְׁפָּחָה שֶׁל הַדִּינוֹזָאוּרִים!",
 qs:[
  ["מָתַי חָיוּ הַדִּינוֹזָאוּרִים?","לִפְנֵי מִילְיוֹנֵי שָׁנִים, לִפְנֵי בְּנֵי הָאָדָם",["לִפְנֵי מֵאָה שָׁנָה","בִּזְמַן סָבָא וְסָבְתָא","הֵם חַיִּים גַּם הַיּוֹם בַּיַּעַר"]],
  ["מָה נֶאֱמָר עַל הַגֹּדֶל שֶׁל הַדִּינוֹזָאוּרִים?","הָיוּ עֲנָקִיִּים וְהָיוּ גַּם קְטַנִּים",["כֻּלָּם הָיוּ עֲנָקִיִּים","כֻּלָּם הָיוּ קְטַנִּים","כֻּלָּם הָיוּ בְּגֹדֶל שֶׁל אָדָם"]],
  ["מָה זֶה מְאֻבָּן?","עֶצֶם אוֹ טְבִיעַת רֶגֶל שֶׁנִּשְׁמְרָה בְּסֶלַע",["דִּינוֹזָאוּר חַי","צִיּוּר עַתִּיק","סוּג שֶׁל צֶמַח"]],
  ["לְמָה מְדַמֶּה הַקֶּטַע אֶת חִבּוּר הָעֲצָמוֹת?","לְפָאזֶל עֲנָק",["לְבִנְיַן בַּיִת","לְצִיּוּר","לְבִשּׁוּל"]],
  ["מָה מְלַמְּדוֹת שִׁנַּיִם חַדּוֹת?","שֶׁהַדִּינוֹזָאוּר הָיָה טוֹרֵף",["שֶׁהוּא אָכַל צְמָחִים","שֶׁהוּא הָיָה זָקֵן","שֶׁהוּא הָיָה קָטָן"]],
  ["מָה חוֹשְׁבִים רֹב הַמַּדְּעָנִים שֶׁגָּרַם לְהֵעָלְמוּת הַדִּינוֹזָאוּרִים?","סֶלַע עֲנָק מִן הֶחָלָל שֶׁפָּגַע בְּכַדּוּר הָאָרֶץ",["בְּנֵי אָדָם צָדוּ אוֹתָם","הֵם עָבְרוּ לְכוֹכָב אַחֵר","הָיָה חַם מִדַּי"]],
  ["לָמָּה הַצְּמָחִים מֵתוּ?","כִּי עֲנַן אָבָק כִּסָּה אֶת הַשָּׁמַיִם וְנִהְיָה קַר",["כִּי הַדִּינוֹזָאוּרִים אָכְלוּ אֶת כֻּלָּם","כִּי לֹא יָרַד גֶּשֶׁם מֵאָה שָׁנָה","כִּי הַיָּם כִּסָּה אוֹתָם"]],
  ["מִי קְרוֹבוֹת הַמִּשְׁפָּחָה שֶׁל הַדִּינוֹזָאוּרִים הַיּוֹם?","הַצִּפּוֹרִים",["הַפִּילִים","הַדָּגִים","הַכְּלָבִים"]]

{id:"promise", icon:"🐠", title:"הַהַבְטָחָה",
 text:"הַשְּׁכֵנָה, גְּבֶרֶת כֹּהֵן, נָסְעָה לְשָׁבוּעַ לְבַקֵּר אֶת הַנְּכָדִים שֶׁלָּהּ. לִפְנֵי שֶׁנָּסְעָה, הִיא בִּקְּשָׁה מִנֹּעָה: תּוּכְלִי לְהַאֲכִיל אֶת הַדָּגִים שֶׁלִּי פַּעַם בְּיוֹם? נֹעָה הִבְטִיחָה, וְקִבְּלָה אֶת הַמַּפְתֵּחַ.\nבִּשְׁלוֹשֶׁת הַיָּמִים הָרִאשׁוֹנִים נֹעָה נִכְנְסָה בְּכָל בֹּקֶר, פִּזְּרָה קְצָת אֹכֶל וְהִסְתַּכְּלָה אֵיךְ הַדָּגִים עוֹלִים לֶאֱכֹל.\nבְּיוֹם חֲמִישִׁי הֻזְמְנָה נֹעָה לְיוֹם הֻלֶּדֶת, וְאַחֲרָיו לִישֹׁן אֵצֶל חֲבֵרָה. הָיָה כֵּיף גָּדוֹל, וְהִיא שָׁכְחָה לְגַמְרֵי מֵהַדָּגִים. רַק בְּיוֹם שִׁשִּׁי בַּצָּהֳרַיִם, כְּשֶׁחָזְרָה הַבַּיְתָה וְרָאֲתָה אֶת הַמַּפְתֵּחַ עַל הַשִּׁדָּה, הַלֵּב שֶׁלָּהּ נָפַל.\nהִיא רָצָה לַדִּירָה שֶׁל הַשְּׁכֵנָה. הַדָּגִים שָׂחוּ לְאַט, אֲבָל כֻּלָּם הָיוּ חַיִּים. נֹעָה נָשְׁמָה לִרְוָחָה וְהֶאֱכִילָה אוֹתָם.\nאַחַר כָּךְ הִיא חָשְׁבָה: אֵיךְ אֶדְאַג שֶׁזֶּה לֹא יִקְרֶה שׁוּב? הִיא צִיְּרָה דָּג גָּדוֹל עַל דַּף וְהִדְבִּיקָה אוֹתוֹ עַל דֶּלֶת הַחֶדֶר שֶׁלָּהּ. בְּכָל בֹּקֶר, כְּשֶׁיָּצְאָה מֵהַחֶדֶר, הַדָּג הִזְכִּיר לָהּ.\nכְּשֶׁגְּבֶרֶת כֹּהֵן חָזְרָה, נֹעָה סִפְּרָה לָהּ אֶת הָאֱמֶת, גַּם עַל הַיּוֹם שֶׁשָּׁכְחָה. הַשְּׁכֵנָה אָמְרָה: כֻּלָּנוּ שׁוֹכְחִים לִפְעָמִים. מָה שֶׁחָשׁוּב הוּא שֶׁמָּצָאת דֶּרֶךְ לִזְכֹּר, וְשֶׁסִּפַּרְתְּ לִי.",
 qs:[
  ["מָה בִּקְּשָׁה גְּבֶרֶת כֹּהֵן מִנֹּעָה?","לְהַאֲכִיל אֶת הַדָּגִים שֶׁלָּהּ פַּעַם בְּיוֹם",["לְהַשְׁקוֹת אֶת הָעֲצִיצִים","לְטַיֵּל עִם הַכֶּלֶב","לִשְׁמֹר עַל הַנְּכָדִים"]],
  ["לְכַמָּה זְמַן נָסְעָה הַשְּׁכֵנָה?","לְשָׁבוּעַ",["לְיוֹם אֶחָד","לְחֹדֶשׁ","לְשָׁנָה"]],
  ["לָמָּה שָׁכְחָה נֹעָה אֶת הַדָּגִים בְּיוֹם חֲמִישִׁי?","כִּי הָיְתָה בְּיוֹם הֻלֶּדֶת וְיָשְׁנָה אֵצֶל חֲבֵרָה",["כִּי הָיְתָה חוֹלָה","כִּי אִבְּדָה אֶת הַמַּפְתֵּחַ","כִּי לֹא רָצְתָה לְהַאֲכִיל אוֹתָם"]],
  ["מָה הִזְכִּיר לְנֹעָה אֶת הַדָּגִים?","הַמַּפְתֵּחַ שֶׁעַל הַשִּׁדָּה",["טֶלֶפוֹן מֵהַשְּׁכֵנָה","אִמָּא שֶׁלָּהּ","חֲלוֹם"]],
  ["מָה פֵּרוּשׁ הַבִּטּוּי הַלֵּב שֶׁלָּהּ נָפַל?","הִיא נִבְהֲלָה מְאוֹד",["הִיא שָׂמְחָה","הִיא נָפְלָה עַל הָרִצְפָּה","הִיא הָיְתָה רְעֵבָה"]],
  ["מָה מָצְאָה נֹעָה בַּדִּירָה?","הַדָּגִים הָיוּ חַיִּים",["הָאַקְוַרְיוּם הָיָה רֵיק","הַדֶּלֶת הָיְתָה פְּתוּחָה","הַשְּׁכֵנָה כְּבָר חָזְרָה"]],
  ["מָה עָשְׂתָה נֹעָה כְּדֵי לֹא לִשְׁכֹּחַ שׁוּב?","הִדְבִּיקָה צִיּוּר שֶׁל דָּג עַל דֶּלֶת הַחֶדֶר",["בִּקְּשָׁה מֵאִמָּא לְהַאֲכִיל","לָקְחָה אֶת הַדָּגִים אֵלֶיהָ","כָּתְבָה עַל הַיָּד"]],
  ["מָה הָיָה חָשׁוּב לַשְּׁכֵנָה?","שֶׁנֹּעָה מָצְאָה דֶּרֶךְ לִזְכֹּר וְסִפְּרָה אֶת הָאֱמֶת",["שֶׁנֹּעָה לֹא שָׁכְחָה אַף פַּעַם","שֶׁהַדָּגִים גָּדְלוּ","שֶׁהַמַּפְתֵּחַ חָזַר"]]
 ]},
{id:"heart", icon:"❤️", title:"הַלֵּב שֶׁלָּנוּ",
 text:"שִׂימוּ יָד עַל הֶחָזֶה, קְצָת שְׂמֹאלָה. מַרְגִּישִׁים דְּפִיקוֹת? זֶה הַלֵּב שֶׁלָּכֶם.\nהַלֵּב הוּא שְׁרִיר, וְהוּא בְּגֹדֶל שֶׁל הָאֶגְרוֹף שֶׁלָּכֶם. הַתַּפְקִיד שֶׁלּוֹ הוּא לִדְחֹף אֶת הַדָּם לְכָל הַגּוּף. הוּא עוֹבֵד כְּמוֹ מַשְׁאֵבָה: מִתְכַּוֵּץ וְנִרְפֶּה, מִתְכַּוֵּץ וְנִרְפֶּה, בְּלִי הַפְסָקָה.\nהַדָּם זוֹרֵם בְּתוֹךְ צִנּוֹרוֹת דַּקִּים שֶׁנִּקְרָאִים כְּלֵי דָּם. הוּא מֵבִיא לְכָל חֵלֶק בַּגּוּף חַמְצָן וּמָזוֹן, וְאוֹסֵף מִשָּׁם פְּסֹלֶת.\nהַלֵּב שֶׁל יֶלֶד פּוֹעֵם בְּעֵרֶךְ תִּשְׁעִים פְּעָמִים בְּדַקָּה. כְּשֶׁרָצִים אוֹ קוֹפְצִים, הַשְּׁרִירִים צְרִיכִים יוֹתֵר חַמְצָן, וְלָכֵן הַלֵּב פּוֹעֵם מַהֵר יוֹתֵר. כְּשֶׁיְּשֵׁנִים, הוּא פּוֹעֵם לְאַט יוֹתֵר.\nהַלֵּב אֵינוֹ נָח אַף פַּעַם, גַּם לֹא בַּלַּיְלָה. הוּא הִתְחִיל לִפְעֹם עוֹד לִפְנֵי שֶׁנּוֹלַדְתֶּם.\nכְּמוֹ כָּל שְׁרִיר, גַּם הַלֵּב מִתְחַזֵּק כְּשֶׁמְּאַמְּנִים אוֹתוֹ. רִיצָה, שְׂחִיָּה, רְכִיבָה עַל אוֹפַנַּיִם וּמִשְׂחֲקֵי כַּדּוּר טוֹבִים לַלֵּב. גַּם אֹכֶל בָּרִיא, כְּמוֹ יְרָקוֹת וּפֵרוֹת, שׁוֹמֵר עָלָיו.\nהָרוֹפֵא מַקְשִׁיב לַלֵּב בְּעֶזְרַת מַכְשִׁיר שֶׁנִּקְרָא סְטֵתוֹסְקוֹפּ.",
