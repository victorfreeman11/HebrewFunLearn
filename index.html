/* Each round is a rocket trip to the moon: every first-try answer moves it one step, five steps land it.
   Guessing does not pay:  a wrong answer costs one star, slides the rocket back a step, breaks the streak,
   freezes the answers for a moment, and that question no longer earns a star.
   Thinking does:  three first-try answers in a row light a streak that doubles the stars. */
const TYPED = ["calc", "two", "times", "missing"];                // in these games the child types the answer on a keypad instead of picking it
function mathGame(kind, T){                                      // T is set only for the timed mock test
  const GOAL = 5; let done = 0, q = null, missed = false, locked = false, frozen = false, combo = 0, typed = false, entry = "";
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow center"><div class="track" id="track"></div></div>
      ${T ? clockHTML : `<div class="stars" id="combo" style="visibility:hidden"></div>${starsHTML()}`}</div>
    <div class="grow center card" id="stage" style="direction:ltr"></div>
    <div class="row" id="opts" style="justify-content:center;direction:ltr;gap:calc(var(--u)*3);padding-bottom:calc(var(--u)*1.5);transition:opacity .2s"></div>`);
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const near = (ans, k, min) => { const s = new Set([ans]); while (s.size < k) { const v = ans + ri(-3, 3); if (v >= min) s.add(v); } return shuffle(Array.from(s)); };   // plausible wrong answers
  const objs = (n, e) => `<div class="objs">${e.repeat(n)}</div>`;
  function track(){
    if (T) { $("#track").innerHTML = `<b>${Math.min(T.i + 1, T.kinds.length)} / ${T.kinds.length}</b>`; return; }
    $("#track").innerHTML = Array.from({length: GOAL + 1}, (_, k) => k === done ? `<b>🚀</b>` : k === GOAL ? `<b>🌙</b>` : `<i></i>`).join("");
    const c = $("#combo"); c.style.visibility = combo >= 2 ? "visible" : "hidden"; c.textContent = "🔥 " + combo;
  }
  function make(){                                               // ranges grow with the child's level
    const lv = T ? T.lv : level(), e = rand(["🍎","⭐","🐟","🎈","🍪","🌷","🚗","🐞"]);
    if (kind === "count") { const n = ri(1, [5, 10, 20][lv - 1]); return {html: objs(n, e), ans: n, opts: near(n, lv === 1 ? 3 : 4, 1), ask: "כַּמָּה יֵשׁ?"}; }
    if (kind === "calc") {
      const max = [10, 20, 100][lv - 1], minus = Math.random() < .5;
      let a, b; if (minus) { a = ri(2, max); b = ri(1, a - 1); } else { a = ri(1, max - 1); b = ri(1, max - a); }
      const ans = minus ? a - b : a + b;
      return {html: `<div class="q">${a} ${minus ? "−" : "+"} ${b} = <span id="slot">?</span></div>` +
                (lv === 1 && !minus ? `<div class="row">${objs(a, e)}<div style="font-size:calc(var(--u)*5)">+</div>${objs(b, e)}</div>` : ""),   // easiest sums show objects to count
              ans, opts: near(ans, 4, 0), ask: `כַּמָּה זֶה ${a} ${minus ? "פָּחוֹת" : "וְעוֹד"} ${b}?`};
    }
    if (kind === "times") {                                      // level 1: the 1, 2, 5 and 10 tables; level 2: up to 5 x 10; level 3: up to 10 x 10
      const a = lv === 1 ? rand([1, 2, 5, 10]) : ri(1, lv === 2 ? 5 : 10), b = ri(1, 10), ans = a * b;
      const s = new Set([ans]), tries = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 1, ans - 1, ans + 2, ans + 10];   // slips a child really makes
      for (const v of shuffle(tries)) { if (s.size < 4 && v >= 0 && v <= 110) s.add(v); }
      const [x, y] = Math.random() < .5 ? [a, b] : [b, a];
      return {html: `<div class="q">${x} × ${y} = <span id="slot">?</span></div>`, ans, opts: shuffle(Array.from(s)), ask: `כַּמָּה זֶה ${x} כָּפוּל ${y}?`};
    }

      // level 1: a two-digit number with a one-digit number or a round ten, nothing to carry
      // level 2: two two-digit numbers, nothing to carry or borrow

// The monster only eats things whose name starts with the target letter.
function monster(){
  let target = null, left = 0, missed = false;
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow"></div>
      <button class="btn target" id="tg"></button><div class="grow"></div>${starsHTML()}</div>
    <div class="grow center"><div class="mon" id="mon">👾</div></div>
    <div class="tray l" id="food" style="padding-bottom:calc(var(--u)*1.5)"></div>`);
  const mon = $("#mon");
  const announce = o => say(`הַמִּפְלֶצֶת רוֹצָה ${target.name}`, o);
  function round(first){
    const lv = level(), groups = {};
    WORDS.forEach(w => { (groups[w.plain[0]] = groups[w.plain[0]] || []).push(w); });
    const ids = Object.keys(groups).filter(c => groups[c].length >= 3).map(c => "letter:" + c);
    target = letter(pick(ids, target && "letter:" + target.id).slice(7));
    const good = shuffle(groups[target.id]).slice(0, lv === 1 ? 2 : 3);
    const bad = shuffle(WORDS.filter(w => w.plain[0] !== target.id)).slice(0, lv === 1 ? 3 : 4);
    left = good.length; missed = false;
    $("#tg").innerHTML = `🔊 <b>${target.id}</b>`;
    $("#food").innerHTML = shuffle(good.concat(bad)).map(w => `<div class="btn white food" data-w="${w.id}">${w.pic}</div>`).join("");
    $$("#food .food").forEach(el => { const w = WORDS.find(x => x.id === el.dataset.w);
      draggable(el, {onTap: () => say(w.nikud, {asset:"word_" + w.id}), onDrop: (x, y) => { if (inside(mon, x, y)) feed(el, w); }}); });
    announce({interrupt: first});
  }
  function feed(el, w){
    say(w.nikud, {asset:"word_" + w.id});                              // always name the food, so the first sound is heard
    if (w.plain[0] !== target.id) { missed = true; nope(); mon.textContent = "😝"; shake(mon); later(() => { mon.textContent = "👾"; }, 700); return; }
    el.style.visibility = "hidden"; left--; thud();
    mon.animate([{transform:"scale(1)"}, {transform:"scale(1.25,.8)"}, {transform:"scale(.9,1.15)"}, {transform:"scale(1)"}], {duration:450});
    if (!left) { answer("letter:" + target.id, !missed); addStars(2); burst(mon); yay(); praise(); later(() => round(false), 1900); }
  }
  on("#x", arcade); on("#tg", () => announce());
  round(true);
}

function story(n){
  const st = STORIES[n], paid = new Set(); let i = 0, chosen = null, reading = 0, ended = false;
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow center"><div class="dots rtl" id="dots"></div></div>${starsHTML()}</div>
    <div class="grow col card" id="page" style="justify-content:center;gap:calc(var(--u)*3)"></div>
    <div class="row" style="justify-content:center;gap:calc(var(--u)*4);padding-bottom:calc(var(--u)*1.5);direction:ltr">
      <button class="btn ic big" id="fwd" style="--c:var(--olive)">⬅️</button><button class="btn ic big" id="read" style="--c:var(--saffron)">🔊</button>
      <button class="btn ic big" id="back" style="--c:var(--cobalt)">➡️</button></div>`);
  cleanup.push(() => { reading++; if ("speechSynthesis" in window) speechSynthesis.cancel(); });
  const fill = t => chosen ? t.replace("{p}", chosen[0]).replace("{w}", chosen[1]) : t;
  const words = t => `<div class="line">${fill(t).split(" ").map(w => `<span>${w}</span>`).join("")}</div>`;
  // Read one word, then call back. A timer backs up devices whose voice never reports that it finished.
  function speakThen(text, cb){
    let fired = false; const t0 = Date.now();
    const fin = () => { if (fired) return; fired = true; setTimeout(cb, Math.max(0, 450 - (Date.now() - t0))); };
    const guard = setTimeout(fin, 2000);
    if (!("speechSynthesis" in window) || !voice || (P && P.mute)) return;   // silent: the timer above still moves the highlight along
    const u = new SpeechSynthesisUtterance(text.replace(/[.!?,]/g, "")); u.lang = "he-IL"; if (voice) u.voice = voice; u.rate = .7;
    u.onend = u.onerror = () => { clearTimeout(guard); fin(); };
    speechSynthesis.speak(u);
  }
  function readAll(){                                             // word by word, highlighting each as it is spoken
    const spans = $$("#page .line span"), mine = ++reading; let k = 0;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    const step = () => {
      spans.forEach(s => s.classList.remove("hl"));
      if (mine !== reading || k >= spans.length) return;
      const sp = spans[k++]; sp.classList.add("hl"); speakThen(sp.textContent, step);
    };
    step();
  }
  function draw(){
    reading++;
    const pg = st.pages[i], page = $("#page"); delete page.dataset.done;
    $("#dots").innerHTML = st.pages.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("");
    const gate = pg.pick || pg.ask;                               // choice and question pages must be answered to go on
    $("#fwd").style.visibility = gate ? "hidden" : "visible"; $("#back").style.visibility = i ? "visible" : "hidden";
    if (pg.text) page.innerHTML = `<div class="spic">${fill(pg.pic)}</div>${words(pg.text)}`;
    else if (pg.pick) page.innerHTML = `${words(pg.pick)}<div class="row rtl" style="gap:calc(var(--u)*5)">${pg.opts.map((o, k) => `<button class="btn white opt" data-k="${k}"><span>${o[0]}</span><div class="he">${o[1]}</div></button>`).join("")}</div>`;
    else page.innerHTML = `${words(pg.ask)}<div class="row" style="gap:calc(var(--u)*4)">${shuffle(pg.opts).map(o => `<button class="btn white opt" data-o="${o}" style="height:calc(var(--u)*17)"><span>${o}</span></button>`).join("")}</div>`;
    $$("#page .line span").forEach(sp => sp.addEventListener("click", () => {       // tap a word to hear it slowly
      reading++; $$("#page .line span").forEach(s => s.classList.remove("hl")); sp.classList.add("hl"); tick(); say(sp.textContent.replace(/[.!?,]/g, ""), {slow:true}); }));
    on("#page .opt[data-k]", el => { chosen = pg.opts[+el.dataset.k]; say(chosen[1]); thud(); go(1); });
    on("#page .opt[data-o]", el => {
      const right = pg.ans === "pick" ? chosen[0] : pg.opts[pg.ans];
      if (page.dataset.done) return;                              // one reward per question
      if (el.dataset.o !== right) { nope(); shake(el); return; }
      page.dataset.done = "1"; burst(el); yay(); if (!paid.has(i)) { paid.add(i); addStars(1); } later(() => go(1), 900);
    });
    later(readAll, 350);
  }
  function go(d){
    if (i + d >= st.pages.length) {                               // the end: reward once, however often the arrow is tapped
      if (!ended) { ended = true; reading++; confetti(); praise(); addStars(3); later(storyMenu, 2200); }
      return;
    }
    i += d;
    draw();
  }
  on("#x", storyMenu); on("#read", readAll); on("#fwd", () => go(1)); on("#back", () => go(-1));
  draw();
}

function scene(){

    <div class="tray" id="tray" style="min-height:calc(var(--u)*8.5);padding-bottom:calc(var(--u)*1)"></div>`);
  const board = $("#board");
  const where = (x, y) => { const r = board.getBoundingClientRect(); return [(x - r.left) / r.width, (y - r.top) / r.height]; };
  function draw(){
    board.style.background = SCENES[P.scene.bg % SCENES.length];

        onDrop: (x, y) => { if (inside(board, x, y)) { [it.x, it.y] = where(x, y); } else P.scene.items.splice(+el.dataset.k, 1);   // dragged off the picture = removed
                            save(); thud(); draw(); }}); });

  $$("#tray .st[data-s]").forEach(el => draggable(el, {
    onTap: () => say(stickerName(el.dataset.s)),

  on("#back", prizes); on("#bg", () => { P.scene.bg++; save(); draw(); }); on("#wipe", () => { P.scene.items = []; save(); draw(); });
  draw();
}

    <div><div class="sec card"><h2>Letter tracing: times traced out of ${goal} (print / cursive)</h2><div class="mg">${ALL.map(l => { const a = P.reps["print:" + l.id] || 0, k = P.reps["ktav:" + l.id] || 0, f = Math.min(1, a / goal);
          return `<div class="rl" data-l="${l.id}" style="flex-direction:column;height:calc(var(--u)*7.6);cursor:pointer;background:rgba(111,143,58,${.12 + .75 * f});color:${f >= .6 ? "#fff" : "inherit"}">${l.id}<small style="font-size:calc(var(--u)*1.5);font-weight:500;direction:ltr">${a} / ${k}</small></div>`; }).join("")}</div>
        <p style="opacity:.6;margin:calc(var(--u)*1.2) 0 0">Hints fade as the count grows. Tap a letter to reset its count and bring the hints back.</p></div>
      <div class="sec card" id="report"><h2>Time in the app, last 7 days: ${weekSum} min</h2>
        <div style="display:flex;gap:calc(var(--u)*1.5);align-items:flex-end;height:calc(var(--u)*13)">${week.map(w => `<div style="flex:1;text-align:center"><small>${w.mins || ""}</small>
          <div style="height:calc(var(--u)*${(.3 + 8 * w.mins / weekMax).toFixed(2)});background:${w.mins ? "var(--cobalt)" : "rgba(43,43,46,.12)"};border-radius:calc(var(--u)*.6)"></div><small style="opacity:.6">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][w.d.getDay()]}</small></div>`).join("")}</div>
        <h2 style="margin-top:calc(var(--u)*2.4)">Accuracy by activity (first-try answers)</h2>
        ${acts.length ? acts.map(a => bar(a[0], a[1][0], a[1][1])).join("") : `<p style="opacity:.6;margin:0">Nothing answered yet.</p>`}</div>
      <div class="sec card" id="tests"><h2>Timed mock tests</h2>
        ${tests.length ? `<table style="border-collapse:collapse;width:100%"><tr style="text-align:left;opacity:.6"><th>Date</th><th>Score</th><th>Time used</th><th>Level</th></tr>${tests.map(t => { const d = new Date(t.t);
            return `<tr><td>${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}</td><td style="font-weight:800;color:${tone3(t.right / t.n)}">${t.right} / ${t.n}</td><td>${clockText(t.secs)}</td><td>${t.lv || ""}</td></tr>`; }).join("")}</table>
          <h2 style="margin-top:calc(var(--u)*2.4)">By question type, all ${P.tests.length} test${P.tests.length === 1 ? "" : "s"}</h2>${Object.keys(tby).sort((x, y) => tby[x][0] / tby[x][1] - tby[y][0] / tby[y][1]).map(k => bar(names[k] || k, tby[k][0], tby[k][1])).join("")}`
          : `<p style="opacity:.6;margin:0">No test taken yet. The test button is at the top of the Thinking menu.</p>`}
        <h2 style="margin-top:calc(var(--u)*2.4)">Test set-up for ${esc(P.name)}</h2>
        <p>Test length <select id="tm">${[5, 10, 15, 20, 30, 45, 60].map(n => `<option ${(P.testMin || 15) === n ? "selected" : ""}>${n}</option>`).join("")}</select> minutes
          &nbsp; Difficulty <select id="tl">${["Child's current level","Easy","Medium","Hard"].map((t, i) => `<option value="${i}" ${P.test.lv === i ? "selected" : ""}>${t}</option>`).join("")}</select></p>
        <p><label><input type="checkbox" id="tc" ${P.test.custom ? "checked" : ""}> Choose the questions myself (unticked: ${TEST_N} questions: one long passage, the rest shared equally between the games that are switched on)</label></p>
        <div id="tmix" style="display:${P.test.custom ? "grid" : "none"};grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.8) calc(var(--u)*2.5)">${TEST_KINDS.map(k =>
          `<label style="display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1)">${k === "longread" ? `Long passages (${LONG_QS} questions each)` : names[k] || k} <select class="tq" data-k="${k}">${Array.from({length: k === "longread" ? LONG_MAX + 1 : 11}, (_, n) => `<option ${Math.min(P.test.mix[k] || 0, k === "longread" ? LONG_MAX : 10) === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>`).join("")}
          <div style="grid-column:1/-1;font-weight:800">Total: <span id="ttot"></span></div></div></div>
      ${weak.length ? `<div class="sec card"><h2>Needs practice</h2><div class="row" style="flex-wrap:wrap">${weak.map(r => `<div style="background:rgba(226,103,63,.15);padding:calc(var(--u)*1) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.4);text-align:center"><div class="he" style="font-size:calc(var(--u)*3);font-weight:700">${label(r.id)}</div>${r.wrong} missed</div>`).join("")}</div></div>` : ""}
      <div class="sec card"><h2>Parts of the app for ${esc(P.name)}</h2>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--u)*.6) calc(var(--u)*3)">${PARTS.map(p =>
          `<div><label style="font-weight:700"><input type="checkbox" class="pt" data-id="${p[0]}" ${off(p[0]) ? "" : "checked"}> ${p[1]}</label>${(p[2] || []).map(g =>
            `<div style="margin-left:calc(var(--u)*3)"><label><input type="checkbox" class="pt" data-id="${p[0]}.${g[0]}" ${off(p[0] + "." + g[0]) ? "" : "checked"}> ${g[1]}</label></div>`).join("")}</div>`).join("")}</div>
        <p style="opacity:.6;margin:calc(var(--u)*1.2) 0 0">Unticked parts are hidden from this child. Other children keep their own choices.</p></div>
      <div class="sec card"><h2>Settings</h2>
        <p><label><input type="checkbox" id="snd" ${P.mute ? "" : "checked"}> Sound (voice and effects)</label></p>
        <p><label><input type="checkbox" id="nk" ${P.showNikud ? "checked" : ""}> Show nikud on words</label></p>
        <p><label><input type="checkbox" id="ty" ${P.typing ? "checked" : ""}> Type the answer on a keypad in add, subtract, multiply and missing-number games (off: pick from choices)</label></p>
        <p>Times to trace each letter <select id="rg">${[5, 10, 15, 20, 30, 40, 50].map(n => `<option ${goal === n ? "selected" : ""}>${n}</option>`).join("")}</select></p>
        <p>Difficulty <select id="df">${["Automatic","Easy","Medium","Hard"].map((t, i) => `<option value="${i}" ${P.difficulty === i ? "selected" : ""}>${t}</option>`).join("")}</select></p>
        ${voice ? "" : `<p style="color:#b3261e">No Hebrew voice found on this device, so speech is off (the app never reads Hebrew with another language's voice). On iPad: Settings › Accessibility › Spoken Content › Voices › Hebrew. On Windows: Settings › Time &amp; language › Speech › add Hebrew.</p>`}
        <p><button class="t danger" id="reset">Reset progress</button> <button class="t danger" id="del">Delete this profile</button></p></div>
      <div class="sec card" id="backup"><h2>Backup (all children on this device)</h2>
        <p style="${stale ? "color:#b3261e" : ""}">Last backup: ${db.backupAt ? new Date(db.backupAt).toLocaleDateString() : "never"}. Progress is stored only on this device, so save a backup now and then.</p>
        <p><button class="t" id="bsave">Save backup file</button> <button class="t" id="bload">Restore from a backup file</button> <button class="t" id="btext">Backup as text</button>
          <input type="file" id="bfile" accept=".json,.txt,application/json,text/plain" style="display:none"></p>
        <div id="btbox" style="display:none"><p style="opacity:.6">If the file buttons do not work on this device: copy this text and keep it somewhere safe (notes, e-mail). To restore, paste a saved text here and press Restore.</p>
          <textarea id="bta" spellcheck="false" style="width:100%;height:calc(var(--u)*12);font:inherit;font-size:calc(var(--u)*1.5);direction:ltr"></textarea>
          <p><button class="t" id="bcopy">Copy</button> <button class="t danger" id="bpaste">Restore from this text</button></p></div></div></div>`);
  app.className = "parent";
  on("#x", hub);
  $("#nk").addEventListener("change", e => { P.showNikud = e.target.checked; save(); });
  $("#ty").addEventListener("change", e => { P.typing = e.target.checked; save(); });
  $("#snd").addEventListener("change", e => { P.mute = !e.target.checked; save(); });
  $$(".pt").forEach(c => c.addEventListener("change", () => { P.off = P.off || {}; if (c.checked) delete P.off[c.dataset.id]; else P.off[c.dataset.id] = true; save(); }));
  $("#df").addEventListener("change", e => { P.difficulty = +e.target.value; save(); parents(); });
  $("#rg").addEventListener("change", e => { P.repGoal = +e.target.value; save(); parents(); });
  on(".rl", el => { const l = el.dataset.l; if (confirm(`Reset the tracing count for ${l}?`)) { delete P.reps["print:" + l]; delete P.reps["ktav:" + l]; save(); parents(); } });
  on("#reset", () => { if (confirm(`Erase all stars and learning progress for ${P.name}?`)) { P.stars = 0; P.best = 0; P.streak = 0; P.mastery = {}; P.reps = {}; P.read = {}; P.days = {}; P.tests = []; save(); parents(); } });
  $("#tm").addEventListener("change", e => { P.testMin = +e.target.value; save(); });
  $("#tl").addEventListener("change", e => { P.test.lv = +e.target.value; save(); });
  const mixTotal = () => { const n = TEST_KINDS.reduce((a, k) => a + (k === "longread" ? Math.min(LONG_MAX, P.test.mix[k] || 0) * LONG_QS : P.test.mix[k] || 0), 0); $("#ttot").textContent = n ? n + " questions" : "0 questions, so the automatic 20 are used"; }; mixTotal();
  $("#tc").addEventListener("change", e => { P.test.custom = e.target.checked; save(); $("#tmix").style.display = P.test.custom ? "grid" : "none"; });
  $$(".tq").forEach(el => el.addEventListener("change", () => { const n = +el.value; if (n) P.test.mix[el.dataset.k] = n; else delete P.test.mix[el.dataset.k]; save(); mixTotal(); }));
  on("#bsave", saveBackup); on("#bload", () => $("#bfile").click());
  $("#bfile").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restoreBackup(String(r.result)); r.readAsText(f); e.target.value = ""; });
  on("#btext", () => { const b = $("#btbox"); b.style.display = b.style.display === "none" ? "" : "none"; $("#bta").value = backupText(); b.scrollIntoView(false); });
  on("#bcopy", () => { const t = $("#bta"); t.focus(); t.select(); try { if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(() => {}); else document.execCommand("copy"); } catch (e) {} db.backupAt = Date.now(); save(); });
  on("#bpaste", () => restoreBackup($("#bta").value));
  on("#del", () => { if (confirm(`Delete the profile ${P.name}? This cannot be undone.`)) { db.profiles = db.profiles.filter(p => p !== P); save(); profiles(); } });
}

/* ================================================================== backup
   Everything lives in this browser's storage, which iPadOS can clear. A backup is one small file (or text) with all profiles. */
const backupText = () => JSON.stringify({app: "HebrewFunLearn", saved: new Date().toISOString(), data: {profiles: db.profiles}});
function saveBackup(){
  const text = backupText(), name = "HebrewFunLearn-backup-" + today() + ".json", done = () => { db.backupAt = Date.now(); save(); parents(); };
  try {                                                           // iPad: the share sheet (Save to Files, AirDrop, Mail); elsewhere: a normal download
    const f = new File([text], name, {type: "application/json"});
    if (navigator.maxTouchPoints > 1 && !/Windows/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [f]})) { navigator.share({files: [f]}).then(done).catch(() => {}); return; }
  } catch (e) {}
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); done();
}
function restoreBackup(text){
  let d = null; try { d = JSON.parse(text); } catch (e) {}
  if (d && d.data) d = d.data;
  const list = d && Array.isArray(d.profiles) ? d.profiles.filter(p => p && typeof p === "object" && typeof p.name === "string") : [];
  if (!list.length) { alert("This is not a HebrewFunLearn backup."); return; }
  if (!confirm(`Replace everything on this device with the backup?\n\nBackup: ${list.map(p => p.name + " (" + (Number.isFinite(p.stars) ? p.stars : 0) + " stars)").join(", ")}\nNow on this device: ${db.profiles.map(p => p.name + " (" + p.stars + " stars)").join(", ")}`)) return;
  db = {profiles: list, backupAt: db.backupAt}; repairData(); save(); P = null; profiles();
}
// Time in the app: ten seconds are added to today's total while the app is on screen and was touched within the last minute.
let touched = Date.now();
document.addEventListener("pointerdown", () => { touched = Date.now(); }, true);
setInterval(() => {
  if (!P || document.hidden || app.className === "parent" || db.profiles.indexOf(P) < 0 || Date.now() - touched > 60000) return;
  const d = today(); P.days[d] = (P.days[d] || 0) + 10; save();
}, 10000);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});      // asks the browser not to clear the saved progress

/* ================================================================== start */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());                 // no pinch zoom on iPad
document.addEventListener("touchstart", () => {}, {passive: true});                // lets buttons show their pressed state on iPad
if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) navigator.serviceWorker.register("sw.js").catch(() => {});
repairData();
profiles();
</script>
</body>
</html>
