<!DOCTYPE html>
<html lang="he" translate="no">
<head>
<meta charset="utf-8">
<title>HebrewFunLearn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HebrewFunLearn">
<meta name="theme-color" content="#FAF8F5">
<meta name="google" content="notranslate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --cream:#FAF8F5; --ink:#2B2B2E; --cobalt:#2546D9; --terra:#E2673F; --olive:#6F8F3A; --saffron:#F4B63F;
  --u:min(1vw,1.333vh);            /* one layout unit: the screen is treated as 100 x 75 units */
}
@supports (height:1dvh){:root{--u:min(1vw,1.333dvh)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
  font-family:-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;padding:calc(var(--u)*2.5);padding-top:max(calc(var(--u)*2.5),env(safe-area-inset-top));padding-bottom:max(calc(var(--u)*2.5),env(safe-area-inset-bottom));
  padding-left:max(calc(var(--u)*2.5),env(safe-area-inset-left));padding-right:max(calc(var(--u)*2.5),env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:calc(var(--u)*2);font-size:calc(var(--u)*2.4)}
.row{display:flex;align-items:center;gap:calc(var(--u)*1.6)}
.col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.8)}
.grow{flex:1;min-width:0;min-height:0}
.center{display:flex;align-items:center;justify-content:center}
.rtl{direction:rtl}
.he{direction:rtl;unicode-bidi:isolate}

/* soft-3D button: a face on a darker ledge that it presses into */
.btn{--c:var(--cobalt);border:0;margin:0;font:inherit;color:#fff;background:var(--c);cursor:pointer;
  border-radius:calc(var(--u)*2.6);box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.28);box-shadow:0 calc(var(--u)*.8) 0 color-mix(in srgb,var(--c) 72%,#000);
  transition:transform .12s,box-shadow .12s;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn:active,.btn.down{transform:translateY(calc(var(--u)*.6));box-shadow:0 calc(var(--u)*.2) 0 rgba(0,0,0,.28);box-shadow:0 calc(var(--u)*.2) 0 color-mix(in srgb,var(--c) 72%,#000)}
.btn.white{--c:#fff;color:var(--ink)}
.btn.off{--c:#bdbbb7}
.ic{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:50%;font-size:calc(var(--u)*3);flex:none}
.ic.big{width:calc(var(--u)*8.4);height:calc(var(--u)*8.4);font-size:calc(var(--u)*4)}
.stars{background:#fff;border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*2);font-size:calc(var(--u)*2.8);display:flex;gap:calc(var(--u)*.8);align-items:center}
.card{background:#fff;border-radius:calc(var(--u)*4);box-shadow:0 calc(var(--u)*1) calc(var(--u)*2.4) rgba(43,43,46,.10)}
.dots{display:flex;gap:calc(var(--u)*.8)}
.dots i{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;background:rgba(43,43,46,.15)}
.dots i.on{background:var(--olive)}

/* profiles + hub */
.hello{font-size:calc(var(--u)*8);text-align:center;margin-top:calc(var(--u)*4)}
.grid{display:grid;gap:calc(var(--u)*3.4) calc(var(--u)*2.8)}
.pf{width:calc(var(--u)*17);height:calc(var(--u)*17);flex-direction:column;gap:calc(var(--u)*.6);font-size:calc(var(--u)*2.8)}
.pf span{font-size:calc(var(--u)*7.5);line-height:1.1}
.tile{height:calc(var(--u)*19);flex-direction:column;gap:calc(var(--u)*1);font-size:calc(var(--u)*3.6)}
.tile span{font-size:calc(var(--u)*7);line-height:1}
.tile.locked{opacity:.45}
.chip{background:#fff;border-radius:99px;padding:calc(var(--u)*.8) calc(var(--u)*2);display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*2.8);cursor:pointer}
.chip span{font-size:calc(var(--u)*4)}

/* studio */
#cv{width:100%;height:100%;max-width:calc(var(--u)*66);max-height:calc(var(--u)*68);touch-action:none}
.rail .btn{touch-action:pan-y}
.rail{display:grid;grid-template-columns:repeat(2,calc(var(--u)*6.6));gap:calc(var(--u)*1.9) calc(var(--u)*1.3);align-content:start;direction:rtl;
  max-height:100%;overflow-y:auto;touch-action:pan-y;padding:calc(var(--u)*.5) calc(var(--u)*.5) calc(var(--u)*1.5)}
.lt{width:calc(var(--u)*6.6);height:calc(var(--u)*5.8);border-radius:calc(var(--u)*1.7);font-size:calc(var(--u)*3.6)}

/* tiles used by the lab and the spelling game */
.blk{width:calc(var(--u)*7.2);height:calc(var(--u)*7);line-height:1.2;border-radius:calc(var(--u)*1.8);font-size:calc(var(--u)*4);position:relative}
.blk.v{--c:var(--terra);width:calc(var(--u)*8.2);font-size:calc(var(--u)*4.4)}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.8) calc(var(--u)*1.2);direction:rtl}
.tray.l{max-width:calc(var(--u)*94)}
.machine{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5)}
.syl{font-size:calc(var(--u)*19);line-height:1.5;direction:rtl}
.slot{border:calc(var(--u)*.45) dashed rgba(43,43,46,.28);border-radius:calc(var(--u)*1.8)}

/* bubbles */
#sky{position:relative;overflow:hidden}
.bub{position:absolute;left:0;top:0;width:calc(var(--u)*13);height:calc(var(--u)*13);margin:calc(var(--u)*-6.5);border-radius:50%;
  background:rgba(37,70,217,.13);border:calc(var(--u)*.45) solid rgba(37,70,217,.55);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*6.6);touch-action:none;cursor:pointer;will-change:transform}
.bub::after{content:"";position:absolute;left:18%;top:16%;width:17%;height:17%;border-radius:50%;background:rgba(255,255,255,.85)}
.target{--c:var(--saffron);color:var(--ink);padding:0 calc(var(--u)*2.4);height:calc(var(--u)*7.4);gap:calc(var(--u)*1.4);font-size:calc(var(--u)*3)}
.target b{font-size:calc(var(--u)*5.6)}

/* memory */
.mem{display:grid;gap:calc(var(--u)*1.6);align-content:center;justify-content:center}
.mc{width:calc(var(--u)*13);height:calc(var(--u)*17);perspective:calc(var(--u)*80);cursor:pointer}
.mem.wide .mc{width:calc(var(--u)*10.4);height:calc(var(--u)*14)}
.mc>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.mc.up>div{transform:rotateY(180deg)}
.mc b,.mc u{position:absolute;top:0;left:0;right:0;bottom:0;white-space:nowrap;overflow:hidden;border-radius:calc(var(--u)*2.2);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;text-decoration:none}
.mc b{background:var(--cobalt);color:rgba(255,255,255,.6);font-size:calc(var(--u)*5)}
.mc u{background:#fff;transform:rotateY(180deg);border:calc(var(--u)*.5) solid rgba(43,43,46,.12);font-size:calc(var(--u)*3.6);direction:rtl}
.mc u.pic{font-size:calc(var(--u)*6.5)}
.mem.wide .mc u{font-size:calc(var(--u)*2.9)} .mem.wide .mc u.pic{font-size:calc(var(--u)*5.4)}
.mc.ok u{border-color:var(--olive)}

/* spelling */
.pic{font-size:calc(var(--u)*17);line-height:1.15}
.slots{display:flex;gap:calc(var(--u)*1.6);direction:rtl}
.sl{width:calc(var(--u)*9.5);height:calc(var(--u)*10);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*6);color:rgba(43,43,46,.16)}
.sl.full{border-style:solid;border-color:var(--olive);background:#fff;color:var(--ink)}
.word{font-size:calc(var(--u)*7);direction:rtl;min-height:calc(var(--u)*10);color:var(--olive)}

/* parents */
.parent{font-weight:500;overflow-y:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text;direction:ltr;font-size:calc(var(--u)*1.9)}
.parent h1{font-size:calc(var(--u)*3.4);margin:0;font-weight:800} .parent h2{font-size:calc(var(--u)*2.3);margin:0 0 calc(var(--u)*1.4);font-weight:800}
.sec{padding:calc(var(--u)*2.4);margin-bottom:calc(var(--u)*2.2);border-radius:calc(var(--u)*2.6)}
.stat{flex:1;padding:calc(var(--u)*2);border-radius:calc(var(--u)*2.4)} .stat b{display:block;font-size:calc(var(--u)*3.6);font-weight:800}
.mg{display:grid;grid-template-columns:repeat(9,1fr);gap:calc(var(--u)*1);direction:rtl}
.mg div{height:calc(var(--u)*5.4);border-radius:calc(var(--u)*1.4);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*3);font-weight:700}
.parent input[type=checkbox]{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);vertical-align:middle;margin-right:calc(var(--u)*.8)}
.parent label{display:inline-block;padding:calc(var(--u)*.5) 0}
.parent select,.parent button.t{font:inherit;padding:calc(var(--u)*.8) calc(var(--u)*1.6);border-radius:calc(var(--u)*1.2);border:1px solid rgba(43,43,46,.3);background:#fff;color:var(--ink);cursor:pointer}
.parent button.t.danger{color:#b3261e;border-color:#b3261e}
.keys{display:grid;grid-template-columns:repeat(3,calc(var(--u)*9));gap:calc(var(--u)*2.2) calc(var(--u)*1.6)}
.keys .btn{height:calc(var(--u)*7);font-size:calc(var(--u)*3.2);border-radius:calc(var(--u)*2)}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(43,43,46,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal>div{padding:calc(var(--u)*4);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4)}
.modal input{font:inherit;font-size:calc(var(--u)*3.2);text-align:center;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*1.8);border:0;background:var(--cream);width:calc(var(--u)*34);-webkit-user-select:text;user-select:text}
.faces{display:grid;grid-template-columns:repeat(6,auto);gap:calc(var(--u)*1.4)}
.faces button{border:0;font-size:calc(var(--u)*4.4);width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:var(--cream);cursor:pointer}
.faces button.on{background:var(--saffron)}
.spark{position:fixed;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border-radius:50%;pointer-events:none;z-index:200}
#rotate{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--cream);z-index:300;align-items:center;justify-content:center;font-size:22vw}
@media (orientation:portrait){#rotate{display:flex}}
/* math */
.q{font-size:calc(var(--u)*11);direction:ltr;line-height:1.2}
.objs{font-size:calc(var(--u)*5.5);max-width:calc(var(--u)*50);text-align:center;line-height:1.3;letter-spacing:calc(var(--u)*.4)}
.num{width:calc(var(--u)*15);height:calc(var(--u)*11);font-size:calc(var(--u)*6.4)}
/* prizes */
.present{border:0;background:none;font-size:calc(var(--u)*24);line-height:1;cursor:pointer;animation:wobble .9s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.08)}}
.prize{font-size:calc(var(--u)*30);line-height:1.1;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.album{display:grid;grid-template-columns:repeat(9,auto);gap:calc(var(--u)*1.6);justify-content:center;align-content:center}
.album div{width:calc(var(--u)*8.6);height:calc(var(--u)*8.6);border-radius:calc(var(--u)*2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*5.4);cursor:pointer}
.album div.no{background:rgba(43,43,46,.06);color:rgba(43,43,46,.2);font-size:calc(var(--u)*3.4);cursor:default}
.bonus{position:fixed;left:50%;top:45%;font-size:calc(var(--u)*16);pointer-events:none;z-index:250;white-space:nowrap;direction:ltr}
.fall{position:fixed;top:-3vh;width:calc(var(--u)*1.4);height:calc(var(--u)*2.2);border-radius:calc(var(--u)*.3);pointer-events:none;z-index:240}

.rail.k .lt{font-family:Ktav;font-size:calc(var(--u)*4.2)}
/* monster */
.mon{font-size:calc(var(--u)*26);line-height:1.1}
.food{width:calc(var(--u)*11.5);height:calc(var(--u)*11);font-size:calc(var(--u)*6.8);border-radius:calc(var(--u)*2.4)}
/* stories */
.spic{font-size:calc(var(--u)*15);line-height:1.2;direction:ltr}
.line{direction:rtl;display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*.6) calc(var(--u)*1.2);font-size:calc(var(--u)*6);padding:0 calc(var(--u)*3)}
.line span{padding:calc(var(--u)*.4) calc(var(--u)*1.2);border-radius:calc(var(--u)*1.6);cursor:pointer;transition:background .15s}
.line span.hl{background:var(--saffron)}
.opt{flex-direction:column;gap:calc(var(--u)*.6);width:calc(var(--u)*24);height:calc(var(--u)*21);font-size:calc(var(--u)*4)}
.opt span{font-size:calc(var(--u)*9.5);line-height:1.1}
/* sticker scene */
#board{position:relative;overflow:hidden}
.st,.placed{font-size:calc(var(--u)*6.4);line-height:1;touch-action:none;cursor:grab}
.st{width:calc(var(--u)*8);height:calc(var(--u)*8);display:flex;align-items:center;justify-content:center}
.tray.many{gap:calc(var(--u)*.3)}
.tray.many .st{width:calc(var(--u)*5);height:calc(var(--u)*5);font-size:calc(var(--u)*4)}
.placed{position:absolute;font-size:calc(var(--u)*9);width:calc(var(--u)*10);height:calc(var(--u)*10);margin:calc(var(--u)*-5) 0 0 calc(var(--u)*-5);display:flex;align-items:center;justify-content:center}
.txtq{font-size:calc(var(--u)*4.6);line-height:1.7;direction:rtl;text-align:center;max-width:calc(var(--u)*66)}
.txtq.ana{font-size:calc(var(--u)*6.4);line-height:1.8}
.num.txt{width:auto;min-width:calc(var(--u)*19);padding:0 calc(var(--u)*2.4);height:calc(var(--u)*10);font-size:calc(var(--u)*3.8);direction:rtl}
#opts{flex-wrap:wrap}
#opts.pad{gap:calc(var(--u)*1.2) !important}
#opts.pad .num{width:calc(var(--u)*6.3);height:calc(var(--u)*9.5);font-size:calc(var(--u)*4.6);padding:0}
#opts.long{gap:calc(var(--u)*1.6) calc(var(--u)*2) !important}
#opts.long .num.txt{width:calc(var(--u)*44);height:calc(var(--u)*7.4);font-size:calc(var(--u)*3)}
.lr{width:calc(var(--u)*17.6);height:calc(var(--u)*12.6);font-size:calc(var(--u)*2.1);gap:calc(var(--u)*.2)}
.lr span{font-size:calc(var(--u)*3.4)}
.lr .he{line-height:1.15}
.lr small{font-size:calc(var(--u)*1.8);min-height:calc(var(--u)*2.2);direction:ltr}
.ptext{flex:1.35;min-width:0;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(var(--u)*2.4) calc(var(--u)*3);font-size:calc(var(--u)*3);line-height:1.75;text-align:right;direction:rtl;font-weight:600}
.ptext b{display:block;font-size:calc(var(--u)*3.8);color:var(--cobalt);margin-bottom:calc(var(--u)*.8)}

const WAIT = [0, 60, 600, 86400, 3 * 86400, 7 * 86400];          // seconds until an item in box N is due again

function answer(id, ok){
  const r = P.mastery[id] || (P.mastery[id] = {box:0, correct:0, wrong:0, due:0});
  if (ok) { r.correct++; r.box = Math.min(r.box + 1, 5); P.streak++; }
  else { r.wrong++; r.box = Math.max(r.box - 1, 0); P.streak = 0; }
  r.due = Date.now() + WAIT[r.box] * 1000; save();
}
function pick(ids, exclude){                      // weighted: due and weak items come up most
  let pool = ids.filter(i => i !== exclude); if (!pool.length) pool = ids;
  const w = pool.map(id => { const r = P.mastery[id]; if (!r) return 3; return r.due <= Date.now() ? 4 + (5 - r.box) : 1; });
  let roll = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { if (roll < w[i]) return pool[i]; roll -= w[i]; }
  return pool[pool.length - 1];
}

/* ================================================================== letter tracing */
const G = {
  len(p){ let t = 0; for (let i = 1; i < p.length; i++) t += Math.hypot(p[i][0] - p[i-1][0], p[i][1] - p[i-1][1]); return t; },
  at(p, f){                                                   // point at fraction f along a polyline
    if (p.length < 2) return p[0];
    let rem = clamp(f, 0, 1) * G.len(p);
    for (let i = 1; i < p.length; i++) {
      const a = p[i-1], b = p[i], s = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (s > 0 && rem <= s) return [a[0] + (b[0] - a[0]) * rem / s, a[1] + (b[1] - a[1]) * rem / s];
      rem -= s;
    }
    return p[p.length - 1];
  },
  resample(p, step){ const n = Math.max(2, Math.ceil(G.len(p) / step) + 1); return Array.from({length:n}, (_, i) => G.at(p, i / (n - 1))); },
  d: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]),
  nearest(pt, s){ let bi = 0, bd = 1e9; s.forEach((q, i) => { const d = G.d(pt, q); if (d < bd) { bd = d; bi = i; } }); return bi; }
};
/* A stroke passes when it (1) starts and ends near the target's ends, (2) covers 85% of the target,
   (3) stays near the target for 80% of its own length, and (4) runs in the target's direction. */
function strokeOK(user, target, tol){
  if (user.length < 2) return false;
  const T = G.resample(target, .03), U = G.resample(user, .02);
  if (G.d(U[0], T[0]) > tol * 2 || G.d(U[U.length - 1], T[T.length - 1]) > tol * 2) return false;
  if (T.filter(t => U.some(u => G.d(u, t) <= tol)).length / T.length < .85) return false;
  if (U.filter(u => T.some(t => G.d(u, t) <= tol * 1.5)).length / U.length < .80) return false;
  return G.nearest(U[Math.floor(U.length / 4)], T) < G.nearest(U[Math.floor(U.length * 3 / 4)], T);
}

function studio(){
  let cur = LETTERS[0], idx = 0, ink = [], drawing = false, cursive = false, kInk = [];
  let geo = null;                                                 // where the squares are on screen, set by the draw loop
  show(`<div class="row grow" style="align-items:stretch">
    <div class="col" style="width:calc(var(--u)*14);justify-content:center">
      <button class="btn ic" id="home" style="--c:var(--ink)">🏠</button>
      <button class="btn ic off" id="ktav" style="font-family:Ktav;font-size:calc(var(--u)*4.4)">א</button><div class="grow"></div>${starsHTML()}<div class="stars" id="reps" style="font-size:calc(var(--u)*2.2)"></div><div class="dots rtl" id="dots"></div>
      <button class="btn ic" id="hear" style="--c:var(--saffron)">🔊</button><button class="btn ic" id="redo" style="--c:var(--terra)">↺</button>
      <button class="btn ic" id="next" style="--c:var(--olive)">⏭</button><div class="grow"></div></div>
    <div class="grow center" style="align-self:stretch"><canvas id="cv" class="card"></canvas></div>
    <div class="rail">${ALL.map(l => `<button class="btn lt" data-l="${l.id}">${l.id}</button>`).join("")}</div></div>`);
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const strokes = () => STROKES[cur.id];
  const hear = () => say(cur.name, {asset: "letter_" + cur.key});
  /* The page is a practice sheet: the letter appears P.repGoal times (default 30, set by a parent), one per square,
     filled in from the top right like a Hebrew notebook. The hints fade across the sheet:
     first third of the squares - grey letter, dashed path, start dot and moving guide dot
     middle third               - fainter grey letter and start dot
     last third                 - start dot and a barely visible letter, checked a little more forgivingly
     The number of finished squares is saved per letter, so the sheet is still there next time. */
  const rk = () => (cursive ? "ktav:" : "print:") + cur.id, goal = () => P.repGoal || 30, reps = () => Math.min(goal(), P.reps[rk()] || 0);
  const full = () => reps() >= goal(), fadeOf = k => k / goal();
  const clear = () => { idx = 0; ink = []; kInk = []; drawing = false; };
  function finished(){
    const n = (P.reps[rk()] = reps() + 1); save(); clear();        // the next square becomes the active one
    yay(); hear();
    if (n % 10 === 0) answer((cursive ? "ktav:" : "letter:") + cur.id, true);          // feeds the spaced-repetition level only every 10th time
    if (n === goal()) { confetti(); praise(); addStars(1); }                            // only a finished sheet earns the star
  }
  function refresh(){
    $("#reps").textContent = (full() ? "✓ " : "") + reps() + "/" + goal();
    $("#dots").innerHTML = cursive || full() ? "" : strokes().map((_, i) => `<i class="${i < idx ? "on" : ""}"></i>`).join("");
    $("#ktav").classList.toggle("off", !cursive); $(".rail").classList.toggle("k", cursive);
    $$(".lt").forEach(b => { const l = b.dataset.l; b.style.setProperty("--c", l === cur.id ? "var(--terra)" : (P.reps[(cursive ? "ktav:" : "print:") + l] || 0) >= goal() ? "var(--olive)" : "var(--cobalt)"); });
    $("#next").classList.toggle("big", full());
  }
  function select(l){ cur = l; clear(); refresh(); hear(); }
  on("#home", hub); on("#hear", hear); on("#redo", () => { clear(); refresh(); });      // redo clears the current square only
  on("#ktav", () => { cursive = !cursive; clear(); refresh(); });
  on("#next", () => select(letter(pick(ALL.map(l => l.id), cur.id))));
  on(".lt", b => select(letter(b.dataset.l)));
  if (document.fonts) document.fonts.load("40px Ktav", "א");

  // Small squares are hard to hit with a finger, so the checks loosen as the squares shrink (1 = large square, 1.6 = small).
  const ease = () => geo ? clamp(200 / geo.s, 1, 1.6) : 1;

  /* Cursive (ktav) mode traces the real letterform from the font instead of hand-made stroke paths.
     There is no stroke order here: a stroke is rejected if too much of it lies outside the letter,
     and the square is finished once the ink covers most of the letter. */
  const glyph = (c, size, color, outline) => {
    c.font = `${size * .7}px Ktav`; c.textAlign = "center"; c.textBaseline = "middle";
    if (outline) { c.lineWidth = outline; c.lineJoin = "round"; c.strokeStyle = color; c.strokeText(cur.id, size / 2, size / 2); }
    c.fillStyle = color; c.fillText(cur.id, size / 2, size / 2);
  };
  function kStroke(drawn){
    const N = 160, e = ease(), mk = () => { const c = document.createElement("canvas"); c.width = c.height = N; return c.getContext("2d", {willReadFrequently:true}); };
    const bits = c => { const d = c.getImageData(0, 0, N, N).data, a = new Uint8Array(N * N); for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] > 100 ? 1 : 0; return a; };
    const m = mk(); glyph(m, N, "#000"); const M = bits(m);                       // the letter
    const f = mk(); glyph(f, N, "#000", N * .13 * e); const F = bits(f);           // the letter, fattened: where ink is allowed
    const paint = list => { const k = mk(); k.lineCap = k.lineJoin = "round"; k.lineWidth = N * .08 * e;
      list.forEach(p => { k.beginPath(); p.forEach((q, i) => i ? k.lineTo(q[0] * N, q[1] * N) : k.moveTo(q[0] * N, q[1] * N)); k.stroke(); }); return bits(k); };
    const one = paint([drawn]); let inkN = 0, out = 0;
    for (let i = 0; i < one.length; i++) if (one[i]) { inkN++; if (!F[i]) out++; }
    if (inkN && out / inkN > .35) { nope(); shake(cv); return; }
    kInk.push(drawn);
    const all = paint(kInk); let mN = 0, cov = 0;
    for (let i = 0; i < all.length; i++) if (M[i]) { mN++; if (all[i]) cov++; }
    if (mN && cov / mN >= .8 - (e - 1) * .15) { burst(cv); finished(); refresh(); } else thud();
  }

  // Pointer position inside the active square, as 0..1 coordinates; null when the touch starts in another square.
  const cellPos = (e, mustBeInside) => {
    if (!geo) return null;
    const r = cv.getBoundingClientRect(), k = reps(), col = k % geo.cols, row = Math.floor(k / geo.cols);
    const x = (e.clientX - r.left - (geo.ox + (geo.cols - 1 - col) * geo.s)) / geo.s, y = (e.clientY - r.top - (geo.oy + row * geo.s)) / geo.s;
    return mustBeInside && (x < 0 || x > 1 || y < 0 || y > 1) ? null : [x, y];
  };
  cv.addEventListener("pointerdown", e => { if (full()) return; const p = cellPos(e, true); if (!p) return; drawing = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} ink = [p]; });
  cv.addEventListener("pointermove", e => { if (drawing) { const p = cellPos(e); if (p) ink.push(p); } });
  const up = () => {
    if (!drawing) return; drawing = false;
    const drawn = ink; ink = [];
    if (G.len(drawn) < .05) return;                           // ignore stray taps
    if (cursive) { kStroke(drawn); return; }
    const tol = [.12, .10, .08][level() - 1] * ease() * (fadeOf(reps()) >= 2 / 3 ? 1.25 : 1);
    if (!strokeOK(drawn, strokes()[idx], tol)) { nope(); shake(cv); return; }
    idx++;
    if (idx >= strokes().length) { burst(cv); finished(); } else thud();
    refresh();
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

  loop(t => {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
    if (!W || !H) return;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const N = goal(), n = reps(), cols = Math.ceil(Math.sqrt(N * W / H)), rows = Math.ceil(N / cols);
    const pad = W * .02, s = Math.min((W - 2 * pad) / cols, (H - 2 * pad) / rows), ox = (W - cols * s) / 2, oy = (H - rows * s) / 2;
    geo = {cols, s: s / dpr, ox: ox / dpr, oy: oy / dpr};
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); ctx.lineCap = "round"; ctx.lineJoin = "round";
    const line = (p, color, w, dash) => { ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0] * s, q[1] * s) : ctx.moveTo(q[0] * s, q[1] * s)); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); };
    const dot = (q, rad, color) => { ctx.beginPath(); ctx.arc(q[0] * s, q[1] * s, rad, 0, 7); ctx.fillStyle = color; ctx.fill(); };
    for (let k = 0; k < N; k++) {
      const col = k % cols, row = Math.floor(k / cols), f = fadeOf(k), active = k === n;
      ctx.setTransform(1, 0, 0, 1, ox + (cols - 1 - col) * s, oy + row * s);          // squares run right to left
      ctx.setLineDash([]); ctx.lineWidth = active ? s * .03 : s * .012; ctx.strokeStyle = active ? "#F4B63F" : "rgba(43,43,46,.10)";
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(s * .04, s * .04, s * .92, s * .92, s * .1); else ctx.rect(s * .04, s * .04, s * .92, s * .92); ctx.stroke();
      const grey = a => `rgba(43,43,46,${a.toFixed(3)})`;
      if (cursive) {
        glyph(ctx, s, k < n ? "#6F8F3A" : grey(.035 + .13 * (1 - f)));
        if (active) { kInk.forEach(p => line(p, "#E2673F", s * .05)); if (ink.length > 1) line(ink, "#E2673F", s * .05); }
        continue;
      }
      if (k < n) { strokes().forEach(p => line(p, "#6F8F3A", s * .11)); continue; }       // finished squares
      strokes().forEach(p => line(p, grey(.022 + .085 * (1 - f)), s * .11));               // grey letter, fainter in later squares
      if (!active) continue;
      strokes().slice(0, idx).forEach(p => line(p, "#2546D9", s * .11));                    // strokes traced so far
      const tg = strokes()[idx];
      if (f < 1 / 3) line(tg, grey(.45), s * .012, [s * .006, s * .04]);
      dot(tg[0], s * .045, "#6F8F3A");
      if (f < 1 / 3) dot(G.at(tg, (t % 1800) / 1800), s * .036, "#F4B63F");
      if (ink.length > 1) line(ink, "#E2673F", s * .05);
    }
  });
  refresh(); hear();
}

/* ================================================================== nikud sound lab */
function lab(){
  let challenge = false, L = null, V = null, tL = null, tV = null, lets = LETTERS, vows = NIKUD;
  show(`<div class="row"><button class="btn ic" id="home" style="--c:var(--ink)">🏠</button><div class="grow"></div>
      <button class="btn ic" id="free">🎛️</button><button class="btn ic" id="quiz">👂</button><div class="grow"></div>${starsHTML()}</div>
    <div class="machine card" id="machine"></div>
    <div class="tray" id="vt"></div><div class="tray l" id="lt" style="padding-bottom:calc(var(--u)*1)"></div>`);
  const machine = $("#machine");
  const sayTarget = o => say(syllable(tL, tV), Object.assign({slow:true, asset:`syl_${tL.key}_${tV.id}`}, o || {}));
  function drawMachine(){
    const u = "calc(var(--u)*";
    machine.innerHTML = (challenge ? `<button class="btn ic big" id="again" style="--c:var(--saffron)">🔊</button>` : "") +
      (L ? `<div class="col" style="gap:0"><div class="syl">${syllable(L, V)}</div>${V ? "" : `<div class="slot" style="width:${u}13);height:${u}3.6)"></div>`}</div>`
         : `<div class="col"><div class="slot" style="width:${u}13);height:${u}13)"></div><div class="slot" style="width:${u}13);height:${u}4.4)"></div></div>`);
    on("#again", () => sayTarget(), machine);
    const syl = $(".syl", machine); if (syl) syl.addEventListener("click", () => say(syllable(L, V), {slow:true}));
  }
  function drawTrays(){
    $("#free").classList.toggle("off", challenge); $("#quiz").classList.toggle("off", !challenge);
    $("#vt").innerHTML = vows.map(v => `<div class="btn blk v" data-v="${v.id}">${vowelTile(v)}</div>`).join("");
    $("#lt").innerHTML = lets.map(l => `<div class="btn blk" data-l="${l.id}">${l.base}</div>`).join("");
    $$("#vt .blk").forEach(el => { const v = NIKUD.find(n => n.id === el.dataset.v);
      draggable(el, {onTap: () => say(v.name, {asset:"nikud_" + v.id}), onDrop: (x, y) => { if (inside(machine, x, y)) dropVowel(v); }}); });
    $$("#lt .blk").forEach(el => { const l = letter(el.dataset.l);
      draggable(el, {onTap: () => say(l.name, {asset:"letter_" + l.key}), onDrop: (x, y) => { if (inside(machine, x, y)) { L = l; thud(); resolve(); } }}); });
  }
  function dropVowel(v){ if (!L) { nope(); shake(machine); return; } V = v; thud(); resolve(); }   // a vowel needs a letter to sit under
  function newRound(interrupt){
    const lv = level(), cons = unlocked().filter(l => !l.final);
    tL = rand(cons.filter(l => l !== tL).length ? cons.filter(l => l !== tL) : cons);
    vows = shuffle(challengeVowels(lv)); const vid = pick(vows.map(v => "nikud:" + v.id)); tV = vows.find(v => "nikud:" + v.id === vid);
    lets = shuffle([tL].concat(shuffle(cons.filter(l => l.sound !== tL.sound)).slice(0, 3)));     // distractors never share the target's sound
    L = V = null; drawMachine(); drawTrays(); sayTarget({interrupt});
  }
  function resolve(){
    drawMachine();
    if (!challenge) { say(syllable(L, V), {slow:true}); return; }
    if (!V) return;
    if (L === tL && V.sound === tV.sound) {              // kamatz/patach sound alike, so either counts
      answer("nikud:" + tV.id, true); addStars(1); burst(machine); yay(); praise();
      later(() => newRound(false), 1500);
    } else {
      answer("nikud:" + tV.id, false); nope(); shake(machine);
      later(() => { L = V = null; drawMachine(); sayTarget(); }, 900);
    }
  }
  function mode(c){ challenge = c; L = V = null; if (c) newRound(true); else { lets = LETTERS; vows = NIKUD; drawMachine(); drawTrays(); } }
  on("#home", hub); on("#free", () => mode(false)); on("#quiz", () => mode(true));
  mode(false);
}

/* ================================================================== spelling: see the picture, drag the letters */
function spell(){
  let word = null, filled = [], missed = false;
  show(`<div class="row"><button class="btn ic" id="home" style="--c:var(--ink)">🏠</button><div class="grow"></div>${starsHTML()}</div>
    <div class="grow col card" id="stage" style="justify-content:center">
      <div class="row"><button class="btn ic big" id="hear" style="--c:var(--saffron)">🔊</button><div class="pic" id="pic"></div></div>
      <div class="slots" id="slots"></div></div>
    <div class="tray l" id="tiles" style="min-height:calc(var(--u)*9);padding-bottom:calc(var(--u)*1)"></div>`);
  const hear = o => say(word.nikud, Object.assign({asset:"word_" + word.id}, o || {}));
  on("#home", hub); on("#hear", () => hear());
  function next(){
    const lv = level(), max = [3, 4, 99][lv - 1];                       // longer words as the child improves
    const pool = WORDS.filter(w => w.plain.length <= max).map(w => "word:" + w.id);
    const wid = pick(pool, word && "word:" + word.id); word = WORDS.find(w => "word:" + w.id === wid);
    // Each tile is a letter together with its nikud (כֶּ, לֶ, ב), so the assembled word is fully vowelled.
    const chars = (P.showNikud ? word.nikud : word.plain).match(/[\u05D0-\u05EA][\u0591-\u05C7]*/g);
    const bases = chars.map(c => c[0]); filled = chars.map(() => false); missed = false;
    let extra = [];
    if (lv >= 2) bases.forEach(c => { const l = letter(c); extra = extra.concat(l.alike); if (l.final) extra.push(l.finalOf); });   // look-alikes, and the non-final twin
    extra = shuffle(extra.filter(c => !bases.includes(c)));
    const others = shuffle(LETTERS.map(l => l.id).filter(c => !bases.includes(c) && !extra.includes(c)));
    const dress = c => P.showNikud && !letter(c).final ? c + rand(["\u05B8","\u05B7","\u05B4","\u05B5","\u05B6"]) : c;      // wrong tiles get a vowel too, so they don't stand out
    const tiles = shuffle(chars.concat(Array.from(new Set(extra.concat(others))).slice(0, 1 + lv).map(dress)));
    $("#pic").textContent = word.pic;
    $("#slots").innerHTML = chars.map((c, i) => `<div class="slot sl" data-i="${i}"></div>`).join("");                          // empty slots: no hints
    $("#tiles").innerHTML = tiles.map(c => `<div class="btn blk" data-c="${c}">${c}</div>`).join("");
    $$("#tiles .blk").forEach(el => draggable(el, {onTap: () => sayTile(el.dataset.c), onDrop: (x, y) => drop(el, x, y, chars)}));
    hear({interrupt:false});
  }
  function drop(el, x, y, chars){
    const slots = $$("#slots .sl");
    if (!inside($("#stage"), x, y) || !slots.length || filled.every(Boolean)) return;       // nothing to do once the word is complete
    let i = slots.findIndex(s => inside(s, x, y));
    if (i < 0 || filled[i]) i = filled.indexOf(false);                  // dropped near the word: aim for the next empty slot
    if (chars[i] !== el.dataset.c) { missed = true; nope(); shake(el); return; }
    filled[i] = true; slots[i].textContent = chars[i]; slots[i].classList.add("full"); el.style.visibility = "hidden"; thud();
    if (filled.every(Boolean)) {
      answer("word:" + word.id, !missed); addStars(2); burst($("#slots")); yay();
      $("#slots").innerHTML = `<div class="word">${P.showNikud ? word.nikud : word.plain}</div>`;
      hear(); later(next, 2200);
    } else sayTile(chars[i]);
  }
  // a vowelled tile is read as its sound; a bare letter by its name
  function sayTile(c){ const l = letter(c[0]); if (c.length > 1) say(c, {slow:true}); else say(l.name, {asset:"letter_" + l.key}); }
  next();
}

    <div class="grow center"><div class="row rtl" style="gap:calc(var(--u)*5)">

      <button class="btn tile" id="m" style="--c:var(--terra);width:calc(var(--u)*26);height:calc(var(--u)*26)"><span>🃏</span><div class="he">זִכָּרוֹן</div></button>

  on("#home", hub); on("#b", bubbles); on("#m", memory); on("#f", monster);

}

function bubbles(){
  const GOAL = 5; let target = null, others = [], popped = 0, lv = 1, list = [];
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow"></div>
      <button class="btn target" id="tg"></button><div class="dots" id="dots"></div><div class="grow"></div>${starsHTML()}</div>
    <div class="grow" id="sky"></div>`);
  const sky = $("#sky");
  const announce = o => say(`אֵיפֹה הָאוֹת ${target.name}?`, o);
  const dots = () => { $("#dots").innerHTML = Array.from({length:GOAL}, (_, i) => `<i class="${i < popped ? "on" : ""}"></i>`).join(""); };
  function round(first){
    const pool = unlocked(); lv = level();
    target = letter(pick(pool.map(l => l.id).map(i => "letter:" + i), target && "letter:" + target.id).slice(7));
    const alike = lv >= 2 ? shuffle(target.alike.map(letter)) : [];                                // look-alikes join from level 2
    others = alike.concat(shuffle(pool.filter(l => l !== target && !alike.includes(l)))).slice(0, 2 + lv);
    popped = 0; list.forEach(b => b.el.remove()); list = [];
    $("#tg").innerHTML = "🔊" + (lv === 1 ? ` <b>${target.id}</b>` : "");                           // later levels: by ear only
    dots(); announce({interrupt: first});
  }
  function pop(b){
    if (popped >= GOAL) return;
    if (b.letter !== target) { answer("letter:" + target.id, false); nope(); shake(b.el.firstChild); say(b.letter.name); return; }   // name the letter they touched
    burst(b.el); b.el.remove(); list = list.filter(q => q !== b); popped++; thud(); dots();
    if (popped >= GOAL) { answer("letter:" + target.id, true); addStars(2); yay(); praise(); later(() => round(false), 1400); }
  }
  every(() => {
    if (list.length >= 9 || popped >= GOAL) return;
    const l = Math.random() < .45 || !others.length ? target : rand(others);
    const el = document.createElement("div"); el.className = "bub"; el.innerHTML = `<span>${l.id}</span>`;
    const b = {el, letter:l, x: .08 + Math.random() * .84, born: performance.now(), speed: [.11, .15, .19][lv - 1] * (.9 + Math.random() * .25), phase: Math.random() * 6};
    el.addEventListener("pointerdown", () => pop(b)); sky.appendChild(el); list.push(b);
  }, 850);
  loop(now => {
    const w = sky.clientWidth, h = sky.clientHeight;
    list = list.filter(b => {
      const t = (now - b.born) / 1000, rise = t * b.speed;
      if (rise > 1.3) { b.el.remove(); return false; }
      b.el.style.transform = `translate(${w * b.x + Math.sin(t * 1.5 + b.phase) * 18}px,${h * (1.12 - rise)}px)`; return true;
    });
  });
  on("#x", arcade); on("#tg", () => announce());
  round(true);
}

function memory(){
  let cards = [], first = null, busy = false;
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow center"><button class="btn ic big" id="re" style="--c:var(--olive);visibility:hidden">↻</button></div>${starsHTML()}</div>
    <div class="grow mem" id="mem"></div>`);
  function deal(){
    const pairs = level() === 1 ? 6 : 8;                                                          // 12 or 16 cards, two rows
    const words = shuffle(shuffle(WORDS).sort((a, b) => box("word:" + a.id) - box("word:" + b.id)).slice(0, pairs * 2)).slice(0, pairs);   // weakest words first
    cards = shuffle(words.map(w => ({w, pic:true})).concat(words.map(w => ({w, pic:false}))));
    first = null; busy = false; $("#re").style.visibility = "hidden";
    const mem = $("#mem"); mem.classList.toggle("wide", pairs === 8); mem.style.gridTemplateColumns = `repeat(${pairs},auto)`;
    mem.innerHTML = cards.map((c, i) => `<div class="mc" data-i="${i}"><div><b>?</b><u class="${c.pic ? "pic" : ""}">${c.pic ? c.w.pic : (P.showNikud ? c.w.nikud : c.w.plain)}</u></div></div>`).join("");
    $$(".mc u:not(.pic)").forEach(fitText);
    $$(".mc").forEach(el => el.addEventListener("click", () => flip(el)));
  }
  function flip(el){
    const c = cards[+el.dataset.i];
    if (busy || el.classList.contains("up")) return;
    el.classList.add("up"); tick(); say(c.w.nikud, {asset:"word_" + c.w.id});
    if (!first) { first = {el, c}; return; }
    const a = first; first = null;
    if (a.c.w === c.w) {
      a.el.classList.add("ok"); el.classList.add("ok"); answer("word:" + c.w.id, true); burst(el); yay();
      if ($$(".mc.ok").length === cards.length) { addStars(3); praise(); $("#re").style.visibility = "visible"; }
    } else { busy = true; later(() => { a.el.classList.remove("up"); el.classList.remove("up"); busy = false; }, 1100); }
  }
  on("#x", arcade); on("#re", deal);
  deal();
}

// One shape, drawn as SVG.  s: kind, c: colour index, r: rotation in degrees, n: dots / polygon sides / star points,
// k: quarters filled in a pie, f: fill style (0 solid, 1 outline, 2 light), z: size (1 = full), big:false = small.

  else if (o.s === "square") body = `<rect x="15" y="15" width="70" height="70" rx="7" ${st}/>`;

  else if (o.s === "dots") { const grid = {1:[[50,50]], 2:[[30,50],[70,50]], 3:[[50,26],[28,70],[72,70]], 4:[[30,30],[70,30],[30,70],[70,70]], 5:[[28,28],[72,28],[50,50],[28,72],[72,72]], 6:[[30,22],[70,22],[30,50],[70,50],[30,78],[70,78]]};

/* Shape series: "which shape is missing?". The rule is one of:
   level 1  a repeating pair or triple (shape, colour or both), or dots that grow by one
   level 2  adds A-A-B rhythms, an arrow turning a quarter turn, shapes gaining a side, a circle filling by quarters,
            stars gaining a point
   level 3  adds two rules at once: shape and colour (or size and colour) on different rhythms, eighth turns,
            and stars that gain a point while the fill cycles solid / outline / light
   From level 2 the missing shape can be in the middle of the row, not only at the end. */
function shapeQuestion(lv){
  const S = ["circle", "square", "tri", "diamond", "star", "hex"], some = (a, n) => shuffle(a).slice(0, n);
  const type = rand(lv === 1 ? ["ab", "ab", "abc", "count"] : lv === 2 ? ["ab", "aab", "abc", "rot", "sides", "pie", "count", "points"] : ["two", "sizecolor", "rot45", "aab", "sides", "pie", "countcolor", "pointsfill", "pointsfill"]);
  const cycle = (units, len) => Array.from({length:len}, (_, i) => units[i % units.length]);

    const sh = some(S, 3), co = some([0, 1, 2, 3, 4], 3), mode = rand(["shape", "color", "both"]);
    const u = i => ({s: mode === "color" ? sh[0] : sh[i], c: mode === "shape" ? co[0] : co[i]}), A = u(0), B = u(1), C = u(2);

    seq = [0, 1, 2, 3, 4].map(i => ({s: "dots", n: st + i, c: type === "countcolor" ? co[i % 2] : co[0]}));
    pool = [1, 2, 3, 4, 5, 6].flatMap(n => (type === "countcolor" ? co : [co[0]]).map(c => ({s: "dots", n, c})));
  } else if (type === "points" || type === "pointsfill") {       // each star has one more point; at level 3 the fill also cycles
    const st = rand([3, 4]), c = rand([0, 1, 2, 4]), fills = type === "pointsfill" ? shuffle([0, 1, 2]) : [0, 0, 0];
    seq = [0, 1, 2, 3, 4].map(i => ({s: "star", n: st + i, c, f: fills[i % 3]}));
    pool = [3, 4, 5, 6, 7, 8, 9].flatMap(n => (type === "pointsfill" ? [0, 1, 2] : [0]).map(f => ({s: "star", n, c, f})));
  } else if (type === "rot" || type === "rot45") {

    const c = rand([0, 1, 2, 4]); seq = [0, 1, 2, 3, 4].map(k => ({s: "pie", k, c})); if (Math.random() < .4) seq.reverse();
    pool = seq.slice();

    const sh = some(S, 2), co = some([0, 1, 2, 3, 4], 3);

/* Matrix: a 3 x 3 grid where every row follows the same rule; one square is empty.

/* Pattern piece: a tiled pattern with a square cut out; which piece fits?

  const board = full => { let s = ""; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if (full || x < hx || x >= hx + k || y < hy || y >= hy + k) s += tile(v(x, y), x, y); }

    return `<svg viewBox="0 0 ${W * 10} ${H * 10}" class="pat">${s}</svg>`; };
  return {items: items.map(piece), keys: items.map(w => w.join("")), rightKey: right.join(""), ans: items.indexOf(right), html: board(false), full: board(true)};
}

    ["מָה מְכִינוֹת הַדְּבוֹרִים?","דְּבַשׁ",["חָלָב","לֶחֶם","מִיץ"]],

  {title:"יוֹם בַּחוֹף", text:"בְּיוֹם שִׁשִּׁי נָסְעָה מִשְׁפַּחַת לֵוִי לַיָּם. אַבָּא הֵבִיא שִׁמְשִׁיָּה גְּדוֹלָה. הַיְּלָדִים בָּנוּ אַרְמוֹן מֵחוֹל. פִּתְאוֹם בָּא גַּל גָּדוֹל וְהָרַס אֶת הָאַרְמוֹן. הַיְּלָדִים צָחֲקוּ וּבָנוּ אַרְמוֹן חָדָשׁ.", qs:[
    ["לְאָן נָסְעָה הַמִּשְׁפָּחָה?","לַיָּם",["לַיַּעַר","לָעִיר","לְגַן הַחַיּוֹת"]],
    ["מָה הָרַס אֶת הָאַרְמוֹן?","גַּל גָּדוֹל",["רוּחַ חֲזָקָה","כֶּלֶב","אַבָּא"]],
    ["מָה עָשׂוּ הַיְּלָדִים אַחֲרֵי שֶׁהָאַרְמוֹן נֶהֱרַס?","בָּנוּ אַרְמוֹן חָדָשׁ",["בָּכוּ וְהָלְכוּ הַבַּיְתָה","נִכְנְסוּ לַמַּיִם","אָכְלוּ אֲבַטִּיחַ"]]]},
  {title:"הַצָּב", text:"הַצָּב הוֹלֵךְ לְאַט מְאוֹד. עַל גַּבּוֹ יֵשׁ שִׁרְיוֹן קָשֶׁה. כְּשֶׁהַצָּב מְפַחֵד, הוּא מַכְנִיס אֶת הָרֹאשׁ וְאֶת הָרַגְלַיִם לְתוֹךְ הַשִּׁרְיוֹן. צַבִּים יְכוֹלִים לִחְיוֹת שָׁנִים רַבּוֹת.", qs:[
    ["אֵיךְ הוֹלֵךְ הַצָּב?","לְאַט מְאוֹד",["מַהֵר מְאוֹד","בִּקְפִיצוֹת","אָחוֹרָה"]],
    ["מָה יֵשׁ לַצָּב עַל הַגַּב?","שִׁרְיוֹן קָשֶׁה",["כְּנָפַיִם","פַּרְוָה רַכָּה","קוֹצִים"]],
    ["מָה עוֹשֶׂה הַצָּב כְּשֶׁהוּא מְפַחֵד?","מִתְחַבֵּא בְּתוֹךְ הַשִּׁרְיוֹן",["רָץ מַהֵר","צוֹעֵק חָזָק","קוֹפֵץ לַמַּיִם"]]]},
  {title:"עוּגָה לְסָבָא", text:"מָחָר יוֹם הַהֻלֶּדֶת שֶׁל סָבָא. תָּמָר וְאִמָּא אָפוּ לוֹ עוּגַת תַּפּוּחִים. תָּמָר שָׁבְרָה אֶת הַבֵּיצִים וְאִמָּא עִרְבְּבָה אֶת הַקֶּמַח. כָּל הַבַּיִת הִתְמַלֵּא בְּרֵיחַ טוֹב.", qs:[
    ["לְמִי אָפוּ אֶת הָעוּגָה?","לְסָבָא",["לְסָבְתָא","לְאַבָּא","לַמּוֹרָה"]],
    ["אֵיזוֹ עוּגָה הֵן אָפוּ?","עוּגַת תַּפּוּחִים",["עוּגַת שׁוֹקוֹלָד","עוּגַת גְּבִינָה","עוּגַת תּוּתִים"]],
    ["מָה עָשְׂתָה תָּמָר?","שָׁבְרָה אֶת הַבֵּיצִים",["עִרְבְּבָה אֶת הַקֶּמַח","אָכְלָה אֶת הָעוּגָה","שָׁטְפָה כֵּלִים"]]]},
  {title:"הַיָּרֵחַ", text:"בַּלַּיְלָה אֲנַחְנוּ רוֹאִים אֶת הַיָּרֵחַ בַּשָּׁמַיִם. לִפְעָמִים הוּא עָגֹל וּמָלֵא, וְלִפְעָמִים הוּא דַּק כְּמוֹ בָּנָנָה. הַיָּרֵחַ רָחוֹק מְאוֹד מֵאִתָּנוּ. אֲנָשִׁים כְּבָר טָסוּ אֵלָיו בַּחֲלָלִית.", qs:[
    ["מָתַי רוֹאִים אֶת הַיָּרֵחַ?","בַּלַּיְלָה",["רַק בַּבֹּקֶר","רַק בַּחֹרֶף","אַף פַּעַם"]],
    ["לְמָה דּוֹמֶה הַיָּרֵחַ כְּשֶׁהוּא דַּק?","לְבָנָנָה",["לְכַדּוּר","לְכּוֹכָב","לְעָנָן"]],
    ["אֵיךְ הִגִּיעוּ אֲנָשִׁים לַיָּרֵחַ?","בַּחֲלָלִית",["בְּמָטוֹס","בָּאֳנִיָּה","בְּרַכֶּבֶת"]]]},
  {title:"הַחֲבֵרָה הַחֲדָשָׁה", text:"לַכִּתָּה שֶׁל דָּנָה הִגִּיעָה יַלְדָּה חֲדָשָׁה. שְׁמָהּ מַיָּה. מַיָּה יָשְׁבָה לְבַד וְהָיְתָה עֲצוּבָה. דָּנָה נִגְּשָׁה אֵלֶיהָ וְהִזְמִינָה אוֹתָהּ לְשַׂחֵק. עַכְשָׁו הֵן חֲבֵרוֹת טוֹבוֹת.", qs:[
    ["מִי הִגִּיעָה לַכִּתָּה?","יַלְדָּה חֲדָשָׁה",["מוֹרָה חֲדָשָׁה","כֶּלֶב קָטָן","אִמָּא שֶׁל דָּנָה"]],
    ["לָמָּה מַיָּה הָיְתָה עֲצוּבָה?","כִּי הִיא יָשְׁבָה לְבַד",["כִּי הִיא נָפְלָה","כִּי יָרַד גֶּשֶׁם","כִּי הִיא הָיְתָה רְעֵבָה"]],
    ["מָה עָשְׂתָה דָּנָה?","הִזְמִינָה אֶת מַיָּה לְשַׂחֵק",["הָלְכָה הַבַּיְתָה","קָרְאָה לַמּוֹרָה","צָחֲקָה עָלֶיהָ"]]]},
  {title:"הַזֶּרַע", text:"אוֹרִי שָׁתַל זֶרַע קָטָן בָּעֲצִיץ. בְּכָל יוֹם הוּא הִשְׁקָה אוֹתוֹ בְּמַיִם וְשָׂם אוֹתוֹ בַּשֶּׁמֶשׁ. אַחֲרֵי שָׁבוּעַ יָצָא מִן הָאֲדָמָה עָלֶה יָרֹק. אוֹרִי שָׂמַח מְאוֹד.", qs:[
    ["אֵיפֹה שָׁתַל אוֹרִי אֶת הַזֶּרַע?","בָּעֲצִיץ",["בַּיָּם","בַּמְּקָרֵר","בַּכִּיס"]],
    ["מָה צָרִיךְ הַזֶּרַע כְּדֵי לִגְדֹּל?","מַיִם וְשֶׁמֶשׁ",["חָלָב וְסֻכָּר","חֹשֶׁךְ וְקֹר","חוֹל וְאֲבָנִים"]],
    ["מָה יָצָא מִן הָאֲדָמָה?","עָלֶה יָרֹק",["פֶּרַח אָדֹם","תּוֹלַעַת","עֵץ גָּדוֹל"]]]},
  {title:"הַסִּפְרִיָּה", text:"בְּיוֹם שְׁלִישִׁי הַכִּתָּה הוֹלֶכֶת לַסִּפְרִיָּה. כָּל יֶלֶד בּוֹחֵר סֵפֶר אֶחָד. בַּסִּפְרִיָּה צָרִיךְ לְדַבֵּר בְּשֶׁקֶט. אַחֲרֵי שָׁבוּעַ מַחֲזִירִים אֶת הַסֵּפֶר וּבוֹחֲרִים סֵפֶר חָדָשׁ.", qs:[
    ["בְּאֵיזֶה יוֹם הוֹלְכִים לַסִּפְרִיָּה?","בְּיוֹם שְׁלִישִׁי",["בְּיוֹם רִאשׁוֹן","בְּיוֹם שִׁשִּׁי","בְּשַׁבָּת"]],
    ["כַּמָּה סְפָרִים בּוֹחֵר כָּל יֶלֶד?","סֵפֶר אֶחָד",["שְׁנֵי סְפָרִים","חֲמִשָּׁה סְפָרִים","אַף סֵפֶר"]],
    ["אֵיךְ צָרִיךְ לְדַבֵּר בַּסִּפְרִיָּה?","בְּשֶׁקֶט",["בְּקוֹל רָם","בְּשִׁירָה","בִּצְעָקוֹת"]]]},
  {title:"הַפִּיל", text:"הַפִּיל הוּא הַחַיָּה הַגְּדוֹלָה בְּיוֹתֵר בַּיַּבָּשָׁה. יֵשׁ לוֹ חֵדֶק אָרֹךְ. בַּחֵדֶק הוּא שׁוֹתֶה מַיִם, מֵרִים אֹכֶל וְגַם מִתְקַלֵּחַ. הַפִּיל אוֹכֵל עָלִים, עֲשָׂבִים וּפֵרוֹת.", qs:[
    ["מָה מְיֻחָד בַּפִּיל?","הוּא הַחַיָּה הַגְּדוֹלָה בַּיַּבָּשָׁה",["הוּא יוֹדֵעַ לָעוּף","הוּא חַי בַּיָּם","הוּא קָטָן מְאוֹד"]],
    ["מָה יֵשׁ לַפִּיל?","חֵדֶק אָרֹךְ",["כְּנָפַיִם גְּדוֹלוֹת","זָנָב שֶׁל דָּג","שִׁרְיוֹן קָשֶׁה"]],
    ["מָה אוֹכֵל הַפִּיל?","עָלִים, עֲשָׂבִים וּפֵרוֹת",["בָּשָׂר וְדָגִים","רַק דְּבַשׁ","אֲבָנִים וְחוֹל"]]]},
  {title:"הָאוֹפַנַּיִם הַחֲדָשׁוֹת", text:"עִדּוֹ קִבֵּל אוֹפַנַּיִם אֲדֻמּוֹת לְיוֹם הַהֻלֶּדֶת. בַּהַתְחָלָה הוּא נָפַל כַּמָּה פְּעָמִים. אַבָּא אָמַר לוֹ: אַל תִּתְיָאֵשׁ, נַסֵּה שׁוּב. עִדּוֹ נִסָּה שׁוּב וָשׁוּב, וּבַסּוֹף הִצְלִיחַ לִרְכֹּב לְבַד.", qs:[
    ["אֵיזֶה צֶבַע הָאוֹפַנַּיִם?","אָדֹם",["כָּחֹל","יָרֹק","צָהֹב"]],
    ["מָה קָרָה בַּהַתְחָלָה?","עִדּוֹ נָפַל כַּמָּה פְּעָמִים",["עִדּוֹ רָכַב מַהֵר","הָאוֹפַנַּיִם נִשְׁבְּרוּ","אַבָּא רָכַב בִּמְקוֹמוֹ"]],
    ["מָה לוֹמְדִים מִן הַסִּפּוּר?","שֶׁכְּדַאי לְנַסּוֹת שׁוּב וְלֹא לְהִתְיָאֵשׁ",["שֶׁאוֹפַנַּיִם הֵן מְסֻכָּנוֹת","שֶׁלֹּא כְּדַאי לַחְגֹּג יוֹם הֻלֶּדֶת","שֶׁאָדֹם הוּא צֶבַע יָפֶה"]]]},
  {title:"אַרְבַּע הָעוֹנוֹת", text:"בַּשָּׁנָה יֵשׁ אַרְבַּע עוֹנוֹת. בַּחֹרֶף קַר וְיוֹרֵד גֶּשֶׁם. בָּאָבִיב הַפְּרָחִים פּוֹרְחִים. בַּקַּיִץ חַם מְאוֹד וְהוֹלְכִים לַיָּם. בַּסְּתָו הֶעָלִים נוֹשְׁרִים מִן הָעֵצִים.", qs:[
    ["כַּמָּה עוֹנוֹת יֵשׁ בַּשָּׁנָה?","אַרְבַּע",["שְׁתַּיִם","שָׁלוֹשׁ","שֶׁבַע"]],
    ["מָתַי הַפְּרָחִים פּוֹרְחִים?","בָּאָבִיב",["בַּחֹרֶף","בַּסְּתָו","בַּלַּיְלָה"]],
    ["מָה קוֹרֶה בַּסְּתָו?","הֶעָלִים נוֹשְׁרִים",["יוֹרֵד שֶׁלֶג","הוֹלְכִים לַיָּם","הַפְּרָחִים פּוֹרְחִים"]]]},
  {title:"הֶחָתוּל עַל הָעֵץ", text:"הֶחָתוּל שֶׁל רוֹנִי טִפֵּס עַל עֵץ גָּבוֹהַּ וְלֹא יָדַע אֵיךְ לָרֶדֶת. הוּא יִלֵּל בְּקוֹל. רוֹנִי קָרְאָה לְאַבָּא. אַבָּא הֵבִיא סֻלָּם, עָלָה וְהוֹרִיד אֶת הֶחָתוּל. הֶחָתוּל לִקֵּק אֶת הַיָּד שֶׁל אַבָּא.", qs:[
    ["לְאָן טִפֵּס הֶחָתוּל?","עַל עֵץ גָּבוֹהַּ",["עַל הַגַּג","עַל הַמִּטָּה","עַל הַשֻּׁלְחָן"]],
    ["לָמָּה הֶחָתוּל יִלֵּל?","כִּי לֹא יָדַע אֵיךְ לָרֶדֶת",["כִּי הָיָה רָעֵב","כִּי רָאָה כֶּלֶב","כִּי רָצָה לְשַׂחֵק"]],
    ["בְּמָה נֶעֱזַר אַבָּא?","בְּסֻלָּם",["בְּחֶבֶל","בְּכִסֵּא","בְּמַקֵּל"]]]},

// One sitting = one passage and its three questions, asked in order. The deck of passages is dealt without repeats.
let readState = null;
function readQuestion(){
  if (!readState || readState.i >= 3) readState = {p: fromBank("read", PASSAGES), i: 0};
  const p = readState.p, [q, right, wrong] = p.qs[readState.i++], words = shuffle([right].concat(wrong));
  return {html: `<div class="txtq passage"><b>${nk(p.title)}</b><div>${nk(p.text)}</div><div class="rq">${nk(q)}</div></div>`,
          ans: words.indexOf(right), opts: [0, 1, 2, 3], show: i => nk(words[i]), txt: true, ask: q, long: true};
}

{id:"water", icon:"💧", title:"הַמַּסָּע שֶׁל טִפַּת הַמַּיִם",
 text:"הַאִם יְדַעְתֶּם שֶׁהַמַּיִם שֶׁבָּעוֹלָם נִמְצָאִים כָּל הַזְּמַן בְּמַסָּע? בּוֹאוּ נַעֲקֹב אַחֲרֵי טִפָּה אַחַת.\nהַטִּפָּה שֶׁלָּנוּ נִמְצֵאת בַּיָּם. הַשֶּׁמֶשׁ מְחַמֶּמֶת אֶת הַמַּיִם, וְהַטִּפָּה הוֹפֶכֶת לְאֵד. הָאֵד קַל מְאוֹד וְאִי אֶפְשָׁר לִרְאוֹת אוֹתוֹ. הוּא עוֹלֶה לְמַעְלָה, אֶל הַשָּׁמַיִם.\nגָּבוֹהַּ בַּשָּׁמַיִם קַר. שָׁם הָאֵד הוֹפֵךְ שׁוּב לְטִפּוֹת קְטַנּוֹת. טִפּוֹת רַבּוֹת מִתְחַבְּרוֹת יַחַד וְיוֹצְרוֹת עָנָן. הָרוּחַ דּוֹחֶפֶת אֶת הֶעָנָן מֵעַל הַיָּם אֶל הַיַּבָּשָׁה.\nכְּשֶׁהַטִּפּוֹת בֶּעָנָן נַעֲשׂוֹת גְּדוֹלוֹת וּכְבֵדוֹת, הֵן נוֹפְלוֹת לְמַטָּה. זֶהוּ הַגֶּשֶׁם. הַטִּפָּה שֶׁלָּנוּ נוֹפֶלֶת עַל הַר. הִיא זוֹרֶמֶת לְנַחַל, הַנַּחַל זוֹרֵם לְנָהָר, וְהַנָּהָר זוֹרֵם חֲזָרָה אֶל הַיָּם.\nוְאָז הַכֹּל מַתְחִיל מֵחָדָשׁ. לַמַּסָּע הַזֶּה קוֹרְאִים מַחֲזוֹר הַמַּיִם.",
 qs:[
  ["מָה קוֹרֶה לַטִּפָּה כְּשֶׁהַשֶּׁמֶשׁ מְחַמֶּמֶת אוֹתָהּ?","הִיא הוֹפֶכֶת לְאֵד",["הִיא קוֹפֵאת","הִיא שׁוֹקַעַת","הִיא הוֹפֶכֶת לְאֶבֶן"]],
  ["לְאָן עוֹלֶה הָאֵד?","אֶל הַשָּׁמַיִם",["אֶל קַרְקָעִית הַיָּם","אֶל הַנָּהָר","אֶל הָאֲדָמָה"]],
  ["מָה קוֹרֶה לָאֵד גָּבוֹהַּ בַּשָּׁמַיִם?","הוּא הוֹפֵךְ שׁוּב לְטִפּוֹת",["הוּא נֶעֱלָם לְתָמִיד","הוּא נִהְיֶה חַם יוֹתֵר","הוּא הוֹפֵךְ לְרוּחַ"]],
  ["מִמָּה עָשׂוּי עָנָן?","מִטִּפּוֹת מַיִם רַבּוֹת",["מֵעָשָׁן","מִצֶּמֶר","מֵאֲוִיר חַם"]],
  ["מָה דּוֹחֵף אֶת הֶעָנָן אֶל הַיַּבָּשָׁה?","הָרוּחַ",["הַשֶּׁמֶשׁ","הַגֶּשֶׁם","הַיָּם"]],
  ["מָתַי יוֹרֵד גֶּשֶׁם?","כְּשֶׁהַטִּפּוֹת נַעֲשׂוֹת גְּדוֹלוֹת וּכְבֵדוֹת",["כְּשֶׁהַשֶּׁמֶשׁ זוֹרַחַת","כְּשֶׁהֶעָנָן נֶעֱלָם","כְּשֶׁהַיָּם מִתְחַמֵּם"]],
  ["מָה הַסֵּדֶר הַנָּכוֹן?","נַחַל, נָהָר, יָם",["יָם, נָהָר, נַחַל","נָהָר, נַחַל, הַר","יָם, הַר, עָנָן"]],
  ["אֵיךְ קוֹרְאִים לַמַּסָּע שֶׁל הַמַּיִם?","מַחֲזוֹר הַמַּיִם",["מַסַּע הַגֶּשֶׁם","דֶּרֶךְ הַיָּם","טִיּוּל הֶעָנָן"]]
 ]},
{id:"race", icon:"🏃", title:"הַמֵּרוֹץ",
 text:"בְּיוֹם הַסְּפּוֹרְט שֶׁל בֵּית הַסֵּפֶר נֶעֱרַךְ מֵרוֹץ לְכָל יַלְדֵי כִּתָּה ב'. יָעֵל לֹא אָהֲבָה לָרוּץ. הִיא תָּמִיד הִגִּיעָה בֵּין הָאַחֲרוֹנִים, וְהִיא פָּחֲדָה שֶׁיִּצְחֲקוּ עָלֶיהָ.\nבַּבֹּקֶר אָמְרָה יָעֵל לְאַבָּא: כּוֹאֶבֶת לִי הַבֶּטֶן, אֲנִי לֹא רוֹצָה לָלֶכֶת. אַבָּא הֵבִין מָה מַפְחִיד אוֹתָהּ. הוּא אָמַר: לֹא חָשׁוּב אִם תַּגִּיעִי רִאשׁוֹנָה אוֹ אַחֲרוֹנָה. חָשׁוּב שֶׁתְּנַסִּי וְשֶׁלֹּא תְּוַתְּרִי.\nהַמֵּרוֹץ הִתְחִיל. יָעֵל רָצָה לְאַט, וְרֹב הַיְּלָדִים עָבְרוּ אוֹתָהּ. בְּאֶמְצַע הַדֶּרֶךְ רָאֲתָה אֶת נֹגַהּ, חֲבֶרְתָּהּ, יוֹשֶׁבֶת עַל הָאֲדָמָה וּבוֹכָה. נֹגַהּ נָפְלָה וְנִפְצְעָה בַּבֶּרֶךְ.\nיָעֵל עָצְרָה. הִיא עָזְרָה לְנֹגַהּ לָקוּם, וְהֵן הָלְכוּ יַחַד, לְאַט, עַד קַו הַסִּיּוּם. הֵן הִגִּיעוּ אַחֲרוֹנוֹת, אֲבָל כָּל הַיְּלָדִים מָחֲאוּ לָהֶן כַּפַּיִם. הַמּוֹרָה נָתְנָה לְיָעֵל מֶדַלְיָה מְיֻחֶדֶת: מֶדַלְיַת הַחֲבֵרוּת.",
 qs:[
  ["לָמָּה יָעֵל לֹא רָצְתָה לָלֶכֶת לְיוֹם הַסְּפּוֹרְט?","הִיא פָּחֲדָה שֶׁיִּצְחֲקוּ עָלֶיהָ",["הִיא הָיְתָה חוֹלָה בֶּאֱמֶת","הִיא שָׁכְחָה אֶת נַעֲלֵי הַסְּפּוֹרְט","הִיא רָצְתָה לִישֹׁן"]],
  ["מָה אָמַר אַבָּא שֶׁחָשׁוּב?","לְנַסּוֹת וְלֹא לְוַתֵּר",["לְהַגִּיעַ רִאשׁוֹנָה","לָרוּץ מַהֵר מִכֻּלָּם","לְהִשָּׁאֵר בַּבַּיִת"]],
  ["מָה קָרָה לְנֹגַהּ?","הִיא נָפְלָה וְנִפְצְעָה בַּבֶּרֶךְ",["הִיא נִצְּחָה בַּמֵּרוֹץ","הִיא הָלְכָה לְאִבּוּד","הִיא הִתְעַיְּפָה וְנִרְדְּמָה"]],
  ["מָה עָשְׂתָה יָעֵל כְּשֶׁרָאֲתָה אֶת נֹגַהּ?","עָצְרָה וְעָזְרָה לָהּ לָקוּם",["הִמְשִׁיכָה לָרוּץ","קָרְאָה לַמּוֹרָה וְרָצָה הָלְאָה","צָחֲקָה עָלֶיהָ"]],
  ["בְּאֵיזֶה מָקוֹם הִגִּיעוּ יָעֵל וְנֹגַהּ?","אַחֲרוֹנוֹת",["רִאשׁוֹנוֹת","שְׁנִיּוֹת","בָּאֶמְצַע"]],
  ["אֵיךְ הֵגִיבוּ הַיְּלָדִים?","מָחֲאוּ לָהֶן כַּפַּיִם",["צָחֲקוּ עֲלֵיהֶן","הָלְכוּ הַבַּיְתָה","לֹא שָׂמוּ לֵב"]],
  ["אֵיזוֹ מֶדַלְיָה קִבְּלָה יָעֵל?","מֶדַלְיַת הַחֲבֵרוּת",["מֶדַלְיַת הַמְּהִירוּת","מֶדַלְיַת זָהָב","מֶדַלְיַת הַמָּקוֹם הָרִאשׁוֹן"]],
  ["מָה אֶפְשָׁר לִלְמֹד מִן הַסִּפּוּר?","לַעֲזֹר לְחָבֵר חָשׁוּב יוֹתֵר מִלְּנַצֵּחַ",["תָּמִיד צָרִיךְ לְנַצֵּחַ","לֹא כְּדַאי לְהִשְׁתַּתֵּף בְּמֵרוֹץ","רַק הַמְּהִירִים מְקַבְּלִים מֶדַלְיָה"]]
 ]},
{id:"ant", icon:"🐜", title:"הַנְּמָלָה וְהַחַרְגּוֹל",
 text:"הָיָה זֶה קַיִץ חַם. הַחַרְגּוֹל יָשַׁב עַל עָלֶה יָרֹק, נִגֵּן וְשָׁר. לְיָדוֹ עָבְרָה נְמָלָה קְטַנָּה. עַל גַּבָּהּ נָשְׂאָה גַּרְעִין כָּבֵד.\nלָמָּה אַתְּ עוֹבֶדֶת קָשֶׁה כָּל כָּךְ? שָׁאַל הַחַרְגּוֹל. בּוֹאִי לָשִׁיר אִתִּי!\nאֲנִי אוֹסֶפֶת אֹכֶל לַחֹרֶף, עָנְתָה הַנְּמָלָה. כְּדַאי שֶׁגַּם אַתָּה תֶּאֱסֹף.\nהַחֹרֶף עוֹד רָחוֹק, צָחַק הַחַרְגּוֹל, וְהִמְשִׁיךְ לָשִׁיר.\nהַיָּמִים עָבְרוּ. הַקַּיִץ נִגְמַר, וְהַחֹרֶף הִגִּיעַ. יָרַד גֶּשֶׁם, וְהָרוּחַ הָיְתָה קָרָה. בַּשָּׂדֶה לֹא נִשְׁאַר אֹכֶל. הַחַרְגּוֹל הָיָה רָעֵב וְרָעַד מִקֹּר.\nהוּא דָּפַק עַל הַדֶּלֶת שֶׁל הַנְּמָלָה. בְּבַקָּשָׁה, אָמַר, תְּנִי לִי מְעַט אֹכֶל.\nהַנְּמָלָה הִסְתַּכְּלָה עָלָיו. הִיא זָכְרָה אֵיךְ צָחַק עָלֶיהָ בַּקַּיִץ. אֲבָל הִיא רִחֲמָה עָלָיו, פָּתְחָה אֶת הַדֶּלֶת וְחִלְּקָה אִתּוֹ אֶת הָאֹכֶל.\nבַּקַּיִץ הַבָּא, הִבְטִיחַ הַחַרְגּוֹל, אֶעֱבֹד יַחַד אִתָּךְ. וּבָעֶרֶב אֲנַגֵּן לָנוּ שִׁירִים.",
 qs:[
  ["מָה עָשָׂה הַחַרְגּוֹל בַּקַּיִץ?","נִגֵּן וְשָׁר",["אָסַף אֹכֶל","בָּנָה בַּיִת","יָשַׁן כָּל הַיּוֹם"]],
  ["מָה נָשְׂאָה הַנְּמָלָה עַל גַּבָּהּ?","גַּרְעִין כָּבֵד",["עָלֶה יָרֹק","טִפַּת מַיִם","אֶבֶן קְטַנָּה"]],
  ["לָמָּה הַנְּמָלָה עָבְדָה קָשֶׁה?","כְּדֵי שֶׁיִּהְיֶה לָהּ אֹכֶל בַּחֹרֶף",["כִּי הִיא אָהֲבָה לָשֵׂאת דְּבָרִים","כִּי הַחַרְגּוֹל בִּקֵּשׁ מִמֶּנָּה","כְּדֵי לְהִתְחַמֵּם"]],
  ["מָה חָשַׁב הַחַרְגּוֹל עַל הַחֹרֶף?","שֶׁהוּא עוֹד רָחוֹק",["שֶׁהוּא יָבוֹא מָחָר","שֶׁהוּא לֹא יָבוֹא אַף פַּעַם","שֶׁהוּא כְּבָר עָבַר"]],
  ["מָה קָרָה לַחַרְגּוֹל בַּחֹרֶף?","הוּא הָיָה רָעֵב וְרָעַד מִקֹּר",["הוּא מָצָא הַרְבֵּה אֹכֶל","הוּא עָף לְאֶרֶץ חַמָּה","הוּא שָׁר בְּשִׂמְחָה"]],
  ["מָה עָשְׂתָה הַנְּמָלָה כְּשֶׁהַחַרְגּוֹל בִּקֵּשׁ אֹכֶל?","חִלְּקָה אִתּוֹ אֶת הָאֹכֶל",["סָגְרָה אֶת הַדֶּלֶת","צָחֲקָה עָלָיו","שָׁלְחָה אוֹתוֹ לַשָּׂדֶה"]],

{id:"bees", icon:"🐝", title:"הַחַיִּים בַּכַּוֶּרֶת",
 text:"בְּכַוֶּרֶת אַחַת חַיּוֹת אַלְפֵי דְּבוֹרִים, וְלְכָל אַחַת מֵהֶן יֵשׁ תַּפְקִיד.\nהַדְּבוֹרָה הַחֲשׁוּבָה בְּיוֹתֵר הִיא הַמַּלְכָּה. הִיא הַגְּדוֹלָה מִכֻּלָּן, וְהַתַּפְקִיד שֶׁלָּהּ הוּא לְהָטִיל בֵּיצִים. בְּכָל כַּוֶּרֶת יֵשׁ רַק מַלְכָּה אַחַת.\nרֹב הַדְּבוֹרִים בַּכַּוֶּרֶת הֵן הַפּוֹעֲלוֹת. הַפּוֹעֲלוֹת הַצְּעִירוֹת מְנַקּוֹת אֶת הַכַּוֶּרֶת וּמַאֲכִילוֹת אֶת הַתִּינוֹקוֹת. הַפּוֹעֲלוֹת הַמְּבֻגָּרוֹת יוֹצְאוֹת הַחוּצָה וּמְחַפְּשׂוֹת פְּרָחִים. מִן הַפְּרָחִים הֵן אוֹסְפוֹת צוּף מָתוֹק.\nכְּשֶׁדְּבוֹרָה מוֹצֵאת שָׂדֶה מָלֵא פְּרָחִים, הִיא חוֹזֶרֶת לַכַּוֶּרֶת וְרוֹקֶדֶת רִקּוּד מְיֻחָד. הָרִקּוּד מַרְאֶה לַחֲבֵרוֹת שֶׁלָּהּ לְאֵיזֶה כִּוּוּן לָעוּף וְכַמָּה רָחוֹק הַשָּׂדֶה.\nבַּכַּוֶּרֶת הַדְּבוֹרִים הוֹפְכוֹת אֶת הַצּוּף לִדְבַשׁ. הֵן שׁוֹמְרוֹת אֶת הַדְּבַשׁ בְּתָאִים קְטַנִּים בַּעֲלֵי שֵׁשׁ צְלָעוֹת, שֶׁהֵן בּוֹנוֹת מִשַּׁעֲוָה. הַדְּבַשׁ הוּא הָאֹכֶל שֶׁלָּהֶן לַחֹרֶף, כְּשֶׁאֵין פְּרָחִים.",

{id:"market", icon:"🧺", title:"בַּשּׁוּק עִם סָבְתָא",
 text:"בְּכָל יוֹם חֲמִישִׁי הוֹלֶכֶת סָבְתָא רוּת לַשּׁוּק, וְהַפַּעַם הִיא לָקְחָה אִתָּהּ אֶת עֹמֶר. הַשּׁוּק הָיָה מָלֵא אֲנָשִׁים, צְבָעִים וְרֵיחוֹת. הַמּוֹכְרִים צָעֲקוּ: עַגְבָנִיּוֹת טְרִיּוֹת! אֲבַטִּיחַ מָתוֹק!\nסָבְתָא נָתְנָה לְעֹמֶר רְשִׁימָה: קִילוֹ עַגְבָנִיּוֹת, שִׁשָּׁה מְלָפְפוֹנִים, צְרוֹר פֶּטְרוֹזִילְיָה וְלֶחֶם. אַתָּה אַחְרַאי עַל הָרְשִׁימָה, אָמְרָה. עֹמֶר הִרְגִּישׁ גָּדוֹל וְחָשׁוּב.\nלְיַד דּוּכַן הַיְּרָקוֹת עָמַד מוֹכֵר מְבֻגָּר בְּשֵׁם דָּוִד. הוּא הִכִּיר אֶת סָבְתָא כְּבָר שָׁנִים רַבּוֹת. דָּוִד שָׁקַל אֶת הָעַגְבָנִיּוֹת וְנָתַן לְעֹמֶר תּוּת אָדֹם בְּמַתָּנָה.\nבַּסּוֹף נִשְׁאַר רַק הַלֶּחֶם. אֲבָל בַּמַּאֲפִיָּה אָמְרוּ שֶׁהַלֶּחֶם נִגְמַר. עֹמֶר הִתְאַכְזֵב. סָבְתָא חִיְּכָה וְקָנְתָה קֶמַח וּשְׁמָרִים. אִם אֵין לֶחֶם, אָמְרָה, נֹאפֶה לֶחֶם בְּעַצְמֵנוּ.\nבָּעֶרֶב יָצָא מִן הַתַּנּוּר לֶחֶם חַם וְרֵיחָנִי. עֹמֶר אָמַר שֶׁזֶּה הַלֶּחֶם הֲכִי טָעִים שֶׁאָכַל בַּחַיִּים.",

{id:"daynight", icon:"🌍", title:"יוֹם וָלַיְלָה",
 text:"בַּבֹּקֶר הַשֶּׁמֶשׁ עוֹלָה, וּבָעֶרֶב הִיא שׁוֹקַעַת. נִרְאֶה לָנוּ שֶׁהַשֶּׁמֶשׁ זָזָה בַּשָּׁמַיִם. אֲבָל בֶּאֱמֶת, מִי שֶׁזָּז הוּא כַּדּוּר הָאָרֶץ!\nכַּדּוּר הָאָרֶץ עָגֹל, כְּמוֹ כַּדּוּר גָּדוֹל מְאוֹד. הוּא מִסְתּוֹבֵב סְבִיב עַצְמוֹ כָּל הַזְּמַן, כְּמוֹ סְבִיבוֹן. סִיבוּב אֶחָד שָׁלֵם נִמְשָׁךְ עֶשְׂרִים וְאַרְבַּע שָׁעוֹת, כְּלוֹמַר יוֹם וָלַיְלָה.\nהַשֶּׁמֶשׁ מְאִירָה רַק עַל חֵצִי מִכַּדּוּר הָאָרֶץ. בַּחֵצִי שֶׁפּוֹנֶה אֶל הַשֶּׁמֶשׁ יֵשׁ אוֹר, וְשָׁם יוֹם. בַּחֵצִי הַשֵּׁנִי חֹשֶׁךְ, וְשָׁם לַיְלָה. כְּשֶׁאֶצְלֵנוּ בֹּקֶר, בְּצַד הַשֵּׁנִי שֶׁל הָעוֹלָם יְלָדִים הוֹלְכִים לִישֹׁן.\nאֲנַחְנוּ לֹא מַרְגִּישִׁים שֶׁכַּדּוּר הָאָרֶץ מִסְתּוֹבֵב, כִּי הוּא מִסְתּוֹבֵב בְּצוּרָה חֲלָקָה, וְכָל מָה שֶׁסְּבִיבֵנוּ מִסְתּוֹבֵב אִתָּנוּ.\nכַּדּוּר הָאָרֶץ גַּם נָע בְּמַסְלוּל גָּדוֹל סְבִיב הַשֶּׁמֶשׁ. סִיבוּב אֶחָד כָּזֶה נִמְשָׁךְ שָׁנָה שְׁלֵמָה.",

{id:"puppy", icon:"🐶", title:"הַגּוּר מֵהַגִּנָּה",
 text:"בְּדֶרֶךְ הַבַּיְתָה מֵהַחוּג שָׁמְעוּ שִׁירָה וְאָחִיהָ יוֹתָם יְלָלָה חַלָּשָׁה. הֵם הִתְקָרְבוּ אֶל הַשִּׂיחִים שֶׁבַּגִּנָּה וְרָאוּ גּוּר כְּלָבִים קָטָן וְלָבָן. הוּא רָעַד מִקֹּר, וְלֹא הָיָה לוֹ קוֹלָר.\nשִׁירָה עָטְפָה אֶת הַגּוּר בַּסְּוֶדֶר שֶׁלָּהּ, וְהֵם הֵבִיאוּ אוֹתוֹ הַבַּיְתָה. אִמָּא נָתְנָה לוֹ מַיִם וְאָמְרָה: אוּלַי מִישֶׁהוּ מְחַפֵּשׂ אוֹתוֹ. קֹדֶם כֹּל צָרִיךְ לִבְדֹּק.\nלְמָחֳרָת לָקְחוּ אֶת הַגּוּר לָרוֹפֵא הַוֵּטֵרִינָר. הָרוֹפֵא בָּדַק אוֹתוֹ וְאָמַר שֶׁהוּא בָּרִיא, אֲבָל רָעֵב מְאוֹד. אַחַר כָּךְ הֵכִינוּ הַיְּלָדִים מוֹדָעוֹת עִם תְּמוּנָה שֶׁל הַגּוּר וְתָלוּ אוֹתָן בַּשְּׁכוּנָה.\nעָבְרוּ שְׁבוּעַיִם, וְאַף אֶחָד לֹא הִתְקַשֵּׁר. בֵּינְתַיִם הַגּוּר גָּדַל, לָמַד לָשֶׁבֶת וְלָתֵת יָד, וְיָשַׁן כָּל לַיְלָה לְיַד הַמִּטָּה שֶׁל יוֹתָם.\nבְּיוֹם שִׁשִּׁי אָמַר אַבָּא: נִרְאֶה לִי שֶׁהוּא כְּבָר חֵלֶק מֵהַמִּשְׁפָּחָה. הַיְּלָדִים קָפְצוּ מִשִּׂמְחָה וְקָרְאוּ לַגּוּר שֶׁלֶג.",
 qs:[
  ["אֵיפֹה מָצְאוּ הַיְּלָדִים אֶת הַגּוּר?","בֵּין הַשִּׂיחִים בַּגִּנָּה",["בַּחֲצַר בֵּית הַסֵּפֶר","לְיַד הַדֶּלֶת שֶׁל הַבַּיִת","בַּחֲנוּת"]],
  ["אֵיךְ יָדְעוּ שֶׁיֵּשׁ שָׁם גּוּר?","הֵם שָׁמְעוּ יְלָלָה",["הֵם רָאוּ מוֹדָעָה","אִמָּא סִפְּרָה לָהֶם","הַגּוּר רָץ אֲלֵיהֶם"]],
  ["בְּמָה עָטְפָה שִׁירָה אֶת הַגּוּר?","בַּסְּוֶדֶר שֶׁלָּהּ",["בִּשְׂמִיכָה","בְּמַגֶּבֶת","בַּתִּיק"]],
  ["מָה אָמַר הָרוֹפֵא עַל הַגּוּר?","שֶׁהוּא בָּרִיא אֲבָל רָעֵב מְאוֹד",["שֶׁהוּא חוֹלֶה מְאוֹד","שֶׁהוּא זָקֵן","שֶׁהוּא שַׁיָּךְ לִשְׁכֵנִים"]],
  ["לָמָּה תָּלוּ הַיְּלָדִים מוֹדָעוֹת?","כְּדֵי לִמְצֹא אֶת הַבְּעָלִים שֶׁל הַגּוּר",["כְּדֵי לִמְכֹּר אֶת הַגּוּר","כְּדֵי לְהַזְמִין חֲבֵרִים","כְּדֵי לִמְצֹא רוֹפֵא"]],
  ["כַּמָּה זְמַן חִכּוּ שֶׁמִּישֶׁהוּ יִתְקַשֵּׁר?","שְׁבוּעַיִם",["יוֹמַיִם","חֹדֶשׁ","שָׁנָה"]],

  ["מָה קָרָה בַּסּוֹף?","הַגּוּר נִשְׁאַר אֵצֶל הַמִּשְׁפָּחָה",["הַבְּעָלִים בָּאוּ לָקַחַת אוֹתוֹ","הַגּוּר בָּרַח","הָרוֹפֵא לָקַח אוֹתוֹ"]]

{id:"birds", icon:"🕊️", title:"הַצִּפּוֹרִים הַנּוֹדְדוֹת",
 text:"בְּכָל סְתָו קוֹרֶה בַּשָּׁמַיִם דָּבָר מַדְהִים: מִילְיוֹנֵי צִפּוֹרִים עָפוֹת יַחַד לְמַסָּע אָרֹךְ. לַצִּפּוֹרִים הָאֵלֶּה קוֹרְאִים צִפּוֹרִים נוֹדְדוֹת.\nבַּקַּיִץ הַצִּפּוֹרִים חַיּוֹת בְּאֵירוֹפָּה. שָׁם הֵן בּוֹנוֹת קִנִּים וּמְגַדְּלוֹת גּוֹזָלִים. אֲבָל בַּחֹרֶף קַר שָׁם מְאוֹד, וְקָשֶׁה לִמְצֹא אֹכֶל. לָכֵן הֵן עָפוֹת דָּרוֹמָה, אֶל אַפְרִיקָה הַחַמָּה.\nהַדֶּרֶךְ אֲרֻכָּה, וְהַצִּפּוֹרִים עוֹבְרוֹת בָּהּ אַלְפֵי קִילוֹמֶטְרִים. רַבּוֹת מֵהֶן עוֹבְרוֹת מֵעַל יִשְׂרָאֵל. הֵן עוֹצְרוֹת כָּאן לָנוּחַ, לִשְׁתּוֹת וְלֶאֱכֹל, וְאָז מַמְשִׁיכוֹת בַּדֶּרֶךְ. בְּעֵמֶק הַחוּלָה אֶפְשָׁר לִרְאוֹת בַּסְּתָו אַלְפֵי עֲגוּרִים וַחֲסִידוֹת.\nחֵלֶק מֵהַצִּפּוֹרִים עָפוֹת בְּמִבְנֶה שֶׁדּוֹמֶה לָאוֹת וִי בְּאַנְגְּלִית. כָּךְ קַל לָהֶן יוֹתֵר לָעוּף, כִּי הַצִּפּוֹר שֶׁבָּרֹאשׁ חוֹתֶכֶת אֶת הָרוּחַ. כְּשֶׁהִיא מִתְעַיֶּפֶת, צִפּוֹר אַחֶרֶת מַחְלִיפָה אוֹתָהּ.\nבָּאָבִיב, כְּשֶׁמִּתְחַמֵּם, הַצִּפּוֹרִים חוֹזְרוֹת צָפוֹנָה, אֶל הַקִּנִּים שֶׁלָּהֶן.",
 qs:[
  ["בְּאֵיזוֹ עוֹנָה יוֹצְאוֹת הַצִּפּוֹרִים לַמַּסָּע דָּרוֹמָה?","בַּסְּתָו",["בָּאָבִיב","בַּקַּיִץ","בְּאֶמְצַע הַחֹרֶף"]],

  ["לָמָּה הַצִּפּוֹרִים עָפוֹת בְּמִבְנֶה מְיֻחָד?","כִּי כָּךְ קַל לָהֶן יוֹתֵר לָעוּף",["כְּדֵי לְהֵרָאוֹת יָפוֹת","כְּדֵי לֹא לָלֶכֶת לְאִבּוּד","כְּדֵי לְהַפְחִיד צִפּוֹרִים אֲחֵרוֹת"]],

{id:"cake", icon:"🎂", title:"הָעוּגָה שֶׁנִּשְׂרְפָה",
 text:"מָחָר יוֹם הַהֻלֶּדֶת שֶׁל אִמָּא, וְלִיאוֹר וְאָחִיו הַקָּטָן בֵּן הֶחְלִיטוּ לְהַפְתִּיעַ אוֹתָהּ. הֵם יֹאפוּ לָהּ עוּגַת שׁוֹקוֹלָד, לְגַמְרֵי לְבַד!\nאַבָּא הִסְכִּים לַעֲזֹר רַק עִם הַתַּנּוּר. לִיאוֹר קָרָא אֶת הַמַּתְכּוֹן בְּקוֹל, וּבֵן הֵבִיא אֶת הַמִּצְרָכִים: קֶמַח, סֻכָּר, בֵּיצִים, שֶׁמֶן וְקָקָאוֹ. הֵם עִרְבְּבוּ הַכֹּל בִּקְעָרָה גְּדוֹלָה. קְצָת קֶמַח הִתְפַּזֵּר עַל הָרִצְפָּה, וְהָאַף שֶׁל בֵּן נִצְבַּע בְּחוּם.\nאַבָּא הִכְנִיס אֶת הָעוּגָה לַתַּנּוּר וְאָמַר: בְּעוֹד אַרְבָּעִים דַּקּוֹת צָרִיךְ לְהוֹצִיא אוֹתָהּ. הַיְּלָדִים הָלְכוּ לְשַׂחֵק בַּחֶדֶר. הַמִּשְׂחָק הָיָה מְעַנְיֵן כָּל כָּךְ, שֶׁהֵם שָׁכְחוּ לְהִסְתַּכֵּל עַל הַשָּׁעוֹן.\nפִּתְאוֹם הֵרִיחוּ רֵיחַ מוּזָר. הָעוּגָה! הֵם רָצוּ לַמִּטְבָּח. אַבָּא הוֹצִיא מִן הַתַּנּוּר עוּגָה שְׁחוֹרָה וִיבֵשָׁה. בֵּן הִתְחִיל לִבְכּוֹת.\nלִיאוֹר חִבֵּק אוֹתוֹ וְאָמַר: יֵשׁ לָנוּ עוֹד בֵּיצִים וְעוֹד קֶמַח. נָכִין עוּגָה חֲדָשָׁה, וְהַפַּעַם נְכַוֵּן שָׁעוֹן מְעוֹרֵר. הָעוּגָה הַשְּׁנִיָּה יָצְאָה גְּבוֹהָה וְרַכָּה, וְאִמָּא אָמְרָה שֶׁזּוֹ הַמַּתָּנָה הַיָּפָה בְּיוֹתֵר שֶׁקִּבְּלָה.",
 qs:[
  ["לִכְבוֹד מָה אָפוּ הַיְּלָדִים עוּגָה?","לְיוֹם הַהֻלֶּדֶת שֶׁל אִמָּא",["לְיוֹם הַהֻלֶּדֶת שֶׁל בֵּן","לִכְבוֹד שַׁבָּת","לִמְסִבַּת כִּתָּה"]],

{id:"camel", icon:"🐪", title:"הַגָּמָל, סְפִינַת הַמִּדְבָּר",
 text:"בַּמִּדְבָּר חַם מְאוֹד בַּיּוֹם, קַר בַּלַּיְלָה, וְכִמְעַט אֵין שָׁם מַיִם. רֹב הַחַיּוֹת לֹא יְכוֹלוֹת לִחְיוֹת שָׁם. אֲבָל הַגָּמָל מַרְגִּישׁ בַּמִּדְבָּר כְּמוֹ בַּבַּיִת.\nעַל גַּבּוֹ שֶׁל הַגָּמָל יֵשׁ דַּבֶּשֶׁת. אֲנָשִׁים רַבִּים חוֹשְׁבִים שֶׁיֵּשׁ בָּהּ מַיִם, אֲבָל זוֹ טָעוּת. בַּדַּבֶּשֶׁת יֵשׁ שֻׁמָּן. כְּשֶׁאֵין לַגָּמָל אֹכֶל, הַגּוּף שֶׁלּוֹ מִשְׁתַּמֵּשׁ בַּשֻּׁמָּן הַזֶּה.\nהַגָּמָל יָכוֹל לָלֶכֶת יָמִים רַבִּים בְּלִי לִשְׁתּוֹת. אֲבָל כְּשֶׁהוּא מוֹצֵא מַיִם, הוּא שׁוֹתֶה כַּמּוּת עֲצוּמָה בְּבַת אַחַת, יוֹתֵר מִמֵּאָה לִיטְרִים!\nהַגּוּף שֶׁל הַגָּמָל מַתְאִים לַחוֹל. יֵשׁ לוֹ רִיסִים אֲרֻכִּים שֶׁשּׁוֹמְרִים עַל הָעֵינַיִם מִפְּנֵי חוֹל, וְהוּא יָכוֹל לִסְגֹּר אֶת הַנְּחִירַיִם שֶׁלּוֹ בִּזְמַן סוּפָה. כַּפּוֹת הָרַגְלַיִם שֶׁלּוֹ רְחָבוֹת, וְלָכֵן הוּא אֵינוֹ שׁוֹקֵעַ בַּחוֹל.\nבְּמֶשֶׁךְ אַלְפֵי שָׁנִים עָזְרוּ הַגְּמַלִּים לִבְנֵי הָאָדָם לַחֲצוֹת אֶת הַמִּדְבָּר וְלָשֵׂאת מַשָּׂאוֹת כְּבֵדִים. לָכֵן קוֹרְאִים לַגָּמָל סְפִינַת הַמִּדְבָּר.",
 qs:[

  ["מָה יֵשׁ בַּדַּבֶּשֶׁת שֶׁל הַגָּמָל?","שֻׁמָּן",["מַיִם","חָלָב","אֲוִיר"]],
  ["מָה הַטָּעוּת שֶׁל אֲנָשִׁים רַבִּים?","הֵם חוֹשְׁבִים שֶׁבַּדַּבֶּשֶׁת יֵשׁ מַיִם",["הֵם חוֹשְׁבִים שֶׁהַגָּמָל אֵינוֹ שׁוֹתֶה","הֵם חוֹשְׁבִים שֶׁהַגָּמָל חַי בַּיָּם","הֵם חוֹשְׁבִים שֶׁהַגָּמָל קָטָן"]],

  ["לָמָּה הַגָּמָל אֵינוֹ שׁוֹקֵעַ בַּחוֹל?","כִּי כַּפּוֹת רַגְלָיו רְחָבוֹת",["כִּי הוּא קַל מְאוֹד","כִּי הוּא הוֹלֵךְ מַהֵר","כִּי יֵשׁ לוֹ דַּבֶּשֶׁת"]],

  ["לָמָּה קוֹרְאִים לַגָּמָל סְפִינַת הַמִּדְבָּר?","כִּי הוּא נוֹשֵׂא אֲנָשִׁים וּמַשָּׂאוֹת בַּמִּדְבָּר",["כִּי הוּא יוֹדֵעַ לִשְׂחוֹת","כִּי הוּא עָשׂוּי מֵעֵץ","כִּי הוּא חַי לְיַד הַיָּם"]]
 ]},
{id:"tent", icon:"⛺", title:"לַיְלָה בָּאֹהֶל",
 text:"בְּחֻפְשַׁת הַקַּיִץ נָסְעָה מִשְׁפַּחַת בַּרְקַאי לְטִיּוּל בַּגָּלִיל. זוֹ הָיְתָה הַפַּעַם הָרִאשׁוֹנָה שֶׁהִלָּה יְשֵׁנָה בְּאֹהֶל, וְהִיא הִתְרַגְּשָׁה מְאוֹד.\nאַחֲרֵי הַצָּהֳרַיִם הֵקִימוּ אֶת הָאֹהֶל לְיַד נַחַל קָטָן. הִלָּה הֶחְזִיקָה אֶת הַמּוֹטוֹת, וְאָחִיהָ הַגָּדוֹל נָדָב תָּקַע אֶת הַיְּתֵדוֹת בָּאֲדָמָה. אַבָּא הִדְלִיק מְדוּרָה קְטַנָּה, וְכֻלָּם צָלוּ תַּפּוּחֵי אֲדָמָה.\nכְּשֶׁיָּרַד הַחֹשֶׁךְ, נִכְנְסוּ לָאֹהֶל. מִבַּחוּץ נִשְׁמְעוּ קוֹלוֹת מוּזָרִים: רִשְׁרוּשׁ, נְקִישׁוֹת וִילָלָה רְחוֹקָה. הִלָּה נִצְמְדָה לְאִמָּא. מָה זֶה? לָחֲשָׁה.\nאִמָּא הִדְלִיקָה פַּנָּס וְהִסְבִּירָה: הָרִשְׁרוּשׁ הוּא הָרוּחַ בֶּעָלִים. הַנְּקִישׁוֹת הֵן צְפַרְדְּעִים בַּנַּחַל. וְהַיְלָלָה הִיא שֶׁל תַּן, שֶׁקּוֹרֵא לַחֲבֵרָיו רָחוֹק מִכָּאן.\nכְּשֶׁהִלָּה הֵבִינָה מָה הֵם הַקּוֹלוֹת, הִיא כְּבָר לֹא פָּחֲדָה. הִיא הוֹצִיאָה אֶת הָרֹאשׁ מִן הָאֹהֶל וְרָאֲתָה שָׁמַיִם מְלֵאִים כּוֹכָבִים. בָּעִיר, חָשְׁבָה, אַף פַּעַם לֹא רוֹאִים כָּל כָּךְ הַרְבֵּה כּוֹכָבִים.",
 qs:[
  ["לְאָן נָסְעָה הַמִּשְׁפָּחָה?","לַגָּלִיל",["לַנֶּגֶב","לְאֵילַת","לִירוּשָׁלַיִם"]],
  ["לָמָּה הִלָּה הִתְרַגְּשָׁה?","כִּי זוֹ הַפַּעַם הָרִאשׁוֹנָה שֶׁלָּהּ בְּאֹהֶל",["כִּי הָיָה לָהּ יוֹם הֻלֶּדֶת","כִּי הִיא פָּגְשָׁה חֲבֵרָה","כִּי הִיא קִבְּלָה פַּנָּס חָדָשׁ"]],
  ["מָה עָשָׂה נָדָב?","תָּקַע אֶת הַיְּתֵדוֹת בָּאֲדָמָה",["הִדְלִיק מְדוּרָה","הֶחְזִיק אֶת הַמּוֹטוֹת","צָד צְפַרְדְּעִים"]],
  ["מָה צָלוּ עַל הַמְּדוּרָה?","תַּפּוּחֵי אֲדָמָה",["נַקְנִיקִיּוֹת","דָּגִים","תִּירָס"]],
  ["לָמָּה הִלָּה נִצְמְדָה לְאִמָּא?","כִּי הִיא פָּחֲדָה מֵהַקּוֹלוֹת",["כִּי הָיָה לָהּ קַר","כִּי הִיא הָיְתָה עֲיֵפָה","כִּי הָאֹהֶל הָיָה קָטָן"]],
  ["מָה הָיוּ הַנְּקִישׁוֹת?","צְפַרְדְּעִים בַּנַּחַל",["הָרוּחַ בֶּעָלִים","תַּן","טִפּוֹת גֶּשֶׁם"]],

  ["מָה רָאֲתָה הִלָּה כְּשֶׁהוֹצִיאָה אֶת הָרֹאשׁ מִן הָאֹהֶל?","שָׁמַיִם מְלֵאִים כּוֹכָבִים",["תַּן קָרוֹב","גֶּשֶׁם","אֶת אוֹרוֹת הָעִיר"]]

{id:"bread", icon:"🍞", title:"מֵהַשָּׂדֶה אֶל הַשֻּׁלְחָן",
 text:"בַּבֹּקֶר אֲנַחְנוּ אוֹכְלִים פְּרוּסַת לֶחֶם. אֲבָל הַאִם חֲשַׁבְתֶּם פַּעַם מֵאֵיפֹה הַלֶּחֶם מַגִּיעַ?\nהַכֹּל מַתְחִיל בַּשָּׂדֶה. בַּסְּתָו הַחַקְלַאי זוֹרֵעַ גַּרְעִינֵי חִטָּה בָּאֲדָמָה. הַגֶּשֶׁם מַשְׁקֶה אוֹתָם, וּבַחֹרֶף הֵם נוֹבְטִים וּגְדֵלִים. בָּאָבִיב הַשָּׂדֶה יָרֹק, וּבִתְחִלַּת הַקַּיִץ הוּא הוֹפֵךְ לְצָהֹב כְּמוֹ זָהָב. אָז הַחִטָּה מוּכָנָה.\nהַחַקְלַאי קוֹצֵר אֶת הַחִטָּה בִּמְכוֹנָה גְּדוֹלָה שֶׁנִּקְרֵאת קוֹמְבַּיְן. הַמְּכוֹנָה מַפְרִידָה אֶת הַגַּרְעִינִים מִן הַקַּשׁ.\nאֶת הַגַּרְעִינִים שׁוֹלְחִים לְטַחֲנַת קֶמַח. שָׁם טוֹחֲנִים אוֹתָם עַד שֶׁהֵם הוֹפְכִים לְאַבְקָה לְבָנָה וְרַכָּה. זֶהוּ הַקֶּמַח.\nהָאוֹפֶה מְעַרְבֵּב אֶת הַקֶּמַח עִם מַיִם, מֶלַח וּשְׁמָרִים, וְלָשׁ אֶת הַכֹּל לְבָצֵק. הַשְּׁמָרִים גּוֹרְמִים לַבָּצֵק לִתְפֹּחַ וּלְהִתְנַפֵּחַ. אַחֲרֵי שֶׁהַבָּצֵק תָּפַח, הָאוֹפֶה מַכְנִיס אוֹתוֹ לַתַּנּוּר הַחַם.\nכַּעֲבֹר זְמַן קָצָר יוֹצֵא מִן הַתַּנּוּר לֶחֶם חַם וְרֵיחָנִי, וּמִשָּׁם הוּא מַגִּיעַ לַחֲנוּת וְלַשֻּׁלְחָן שֶׁלָּנוּ.",
 qs:[
  ["מָתַי זוֹרֵעַ הַחַקְלַאי אֶת הַחִטָּה?","בַּסְּתָו",["בַּקַּיִץ","בָּאָבִיב","בְּאֶמְצַע הַחֹרֶף"]],
  ["מָה מַשְׁקֶה אֶת הַגַּרְעִינִים?","הַגֶּשֶׁם",["הַחַקְלַאי בְּדְלִי","הַנָּהָר","הַטַּל בִּלְבַד"]],
  ["אֵיךְ יוֹדְעִים שֶׁהַחִטָּה מוּכָנָה?","הַשָּׂדֶה הוֹפֵךְ לְצָהֹב",["הַשָּׂדֶה הוֹפֵךְ לְיָרֹק","יוֹרֵד שֶׁלֶג","הַגַּרְעִינִים נוֹבְטִים"]],
  ["מָה עוֹשָׂה מְכוֹנַת הַקּוֹמְבַּיְן?","קוֹצֶרֶת וּמַפְרִידָה אֶת הַגַּרְעִינִים מִן הַקַּשׁ",["טוֹחֶנֶת קֶמַח","אוֹפָה לֶחֶם","זוֹרַעַת גַּרְעִינִים"]],
  ["אֵיפֹה הוֹפְכִים הַגַּרְעִינִים לְקֶמַח?","בְּטַחֲנַת קֶמַח",["בַּמַּאֲפִיָּה","בַּשָּׂדֶה","בַּחֲנוּת"]],
  ["מָה גּוֹרֵם לַבָּצֵק לִתְפֹּחַ?","הַשְּׁמָרִים",["הַמֶּלַח","הַמַּיִם","הַתַּנּוּר"]],
  ["מָה הַסֵּדֶר הַנָּכוֹן?","חִטָּה, קֶמַח, בָּצֵק, לֶחֶם",["קֶמַח, חִטָּה, לֶחֶם, בָּצֵק","בָּצֵק, קֶמַח, חִטָּה, לֶחֶם","לֶחֶם, בָּצֵק, קֶמַח, חִטָּה"]],
  ["אֵיזֶה שֵׁם אַחֵר מַתְאִים לַקֶּטַע?","אֵיךְ מַכִּינִים לֶחֶם",["הַחַקְלַאי וְהַגֶּשֶׁם","הַתַּנּוּר שֶׁל הָאוֹפֶה","מְכוֹנוֹת בַּשָּׂדֶה"]]
 ]},
{id:"neighbor", icon:"🏠", title:"הַשָּׁכֵן הֶחָדָשׁ",
 text:"לַדִּירָה שֶׁמּוּל הַדִּירָה שֶׁל אֲבִיגַיִל עָבְרָה מִשְׁפָּחָה חֲדָשָׁה. הֵם הִגִּיעוּ מֵאֶרֶץ רְחוֹקָה, מֵאַרְגֶּנְטִינָה. בַּמִּשְׁפָּחָה הָיָה יֶלֶד בְּגִילָהּ, וּשְׁמוֹ מַטֵּאוֹ.\nמַטֵּאוֹ לֹא יָדַע עִבְרִית. בַּכִּתָּה הוּא יָשַׁב בְּשֶׁקֶט וְלֹא הֵבִין מָה הַמּוֹרָה אוֹמֶרֶת. בַּהַפְסָקוֹת עָמַד לְבַד לְיַד הַגָּדֵר וְהִסְתַּכֵּל עַל הַיְּלָדִים שֶׁמְּשַׂחֲקִים.\nאֲבִיגַיִל רָצְתָה לְדַבֵּר אִתּוֹ, אֲבָל לֹא יָדְעָה אֵיךְ. הִיא לֹא יוֹדַעַת סְפָרַדִּית, וְהוּא לֹא יוֹדֵעַ עִבְרִית. וְאָז הָיָה לָהּ רַעְיוֹן. הִיא הֵבִיאָה כַּדּוּר, הִצְבִּיעָה עָלָיו וְאָמְרָה: כַּדּוּר. מַטֵּאוֹ חִיֵּךְ וְאָמַר: פֵּלוֹטָה.\nמֵאוֹתוֹ יוֹם הֵם לִמְּדוּ זֶה אֶת זֶה מִלָּה חֲדָשָׁה בְּכָל הַפְסָקָה. אֲבִיגַיִל הֵכִינָה מַחְבֶּרֶת קְטַנָּה וְצִיְּרָה בָּהּ צִיּוּרִים. לְיַד כָּל צִיּוּר כָּתְבוּ אֶת הַמִּלָּה בִּשְׁתֵּי הַשָּׂפוֹת.\nאַחֲרֵי כַּמָּה חֳדָשִׁים מַטֵּאוֹ כְּבָר דִּבֵּר עִבְרִית, וַאֲבִיגַיִל יָדְעָה לִסְפֹּר עַד מֵאָה בִּסְפָרַדִּית. וְהַדָּבָר הֶחָשׁוּב בְּיוֹתֵר: לִשְׁנֵיהֶם הָיָה חָבֵר חָדָשׁ.",
 qs:[
  ["מֵאֵיפֹה הִגִּיעָה הַמִּשְׁפָּחָה הַחֲדָשָׁה?","מֵאַרְגֶּנְטִינָה",["מִצָּרְפַת","מֵרוּסְיָה","מֵעִיר אַחֶרֶת בָּאָרֶץ"]],
  ["לָמָּה מַטֵּאוֹ יָשַׁב בְּשֶׁקֶט בַּכִּתָּה?","כִּי הוּא לֹא יָדַע עִבְרִית",["כִּי הוּא הָיָה עָיֵף","כִּי הַמּוֹרָה בִּקְּשָׁה","כִּי הוּא לֹא אָהַב אֶת הַיְּלָדִים"]],
  ["אֵיפֹה עָמַד מַטֵּאוֹ בַּהַפְסָקוֹת?","לְבַד לְיַד הַגָּדֵר",["בְּמִגְרַשׁ הַכַּדּוּרֶגֶל","בַּסִּפְרִיָּה","לְיַד הַמּוֹרָה"]],
  ["מָה הָיְתָה הַבְּעָיָה שֶׁל אֲבִיגַיִל?","הֵם לֹא יָדְעוּ אֶת אוֹתָהּ שָׂפָה",["הִיא פָּחֲדָה מִמֶּנּוּ","לֹא הָיָה לָהּ כַּדּוּר","הַמּוֹרָה אָסְרָה לְדַבֵּר"]],
  ["מָה הָיָה הָרַעְיוֹן שֶׁל אֲבִיגַיִל?","לְהַצְבִּיעַ עַל דְּבָרִים וְלוֹמַר אֶת שְׁמָם",["לִקְנוֹת לוֹ מִלּוֹן","לְבַקֵּשׁ מֵאִמָּא לְתַרְגֵּם","לִכְתֹּב לוֹ מִכְתָּב"]],
  ["מָה פֵּרוּשׁ הַמִּלָּה פֵּלוֹטָה?","כַּדּוּר",["שָׁלוֹם","חָבֵר","מַחְבֶּרֶת"]],
  ["מָה הָיָה בַּמַּחְבֶּרֶת הַקְּטַנָּה?","צִיּוּרִים וּמִלִּים בִּשְׁתֵּי שָׂפוֹת",["תַּרְגִּילֵי חֶשְׁבּוֹן","סִפּוּרִים אֲרֻכִּים","שְׁמוֹת הַיְּלָדִים בַּכִּתָּה"]],
  ["מָה הַדָּבָר הֶחָשׁוּב בְּיוֹתֵר לְפִי הַסִּפּוּר?","שֶׁלִּשְׁנֵיהֶם הָיָה חָבֵר חָדָשׁ",["שֶׁאֲבִיגַיִל לָמְדָה לִסְפֹּר","שֶׁמַּטֵּאוֹ קִבֵּל כַּדּוּר","שֶׁהַמּוֹרָה שָׂמְחָה"]]
 ]},
{id:"whale", icon:"🐳", title:"הַלִּוְיָתָן הַכָּחֹל",
 text:"הַחַיָּה הַגְּדוֹלָה בְּיוֹתֵר בָּעוֹלָם אֵינָהּ הַפִּיל, וְגַם לֹא דִּינוֹזָאוּר. זֶהוּ הַלִּוְיָתָן הַכָּחֹל. אָרְכּוֹ יָכוֹל לְהַגִּיעַ לִשְׁלוֹשִׁים מֶטְרִים, כְּמוֹ שְׁלוֹשָׁה אוֹטוֹבּוּסִים שֶׁעוֹמְדִים זֶה אַחֲרֵי זֶה.\nלַמְרוֹת הַגֹּדֶל הֶעָצוּם שֶׁלּוֹ, הַלִּוְיָתָן הַכָּחֹל אוֹכֵל יְצוּרִים זְעִירִים, שֶׁדּוֹמִים לְחַסִּילוֹנִים קְטַנִּים. הוּא פּוֹתֵחַ אֶת פִּיו הַגָּדוֹל, בּוֹלֵעַ כַּמּוּת עֲנָקִית שֶׁל מַיִם, וּמְסַנֵּן מֵהֶם אֶת הָאֹכֶל. בְּיוֹם אֶחָד הוּא אוֹכֵל כַּמָּה טוֹנוֹת!\nהַלִּוְיָתָן חַי בַּיָּם, אֲבָל הוּא אֵינוֹ דָּג. הוּא יוֹנֵק, וְהוּא נוֹשֵׁם אֲוִיר. כְּשֶׁהוּא עוֹלֶה אֶל פְּנֵי הַמַּיִם, הוּא נוֹשֵׁף סִילוֹן גָּבוֹהַּ, שֶׁאֶפְשָׁר לִרְאוֹת מֵרָחוֹק.\nהַגּוּר שֶׁל הַלִּוְיָתָן נוֹלָד כְּשֶׁהוּא כְּבָר אָרֹךְ כְּמוֹ שְׁתֵּי מְכוֹנִיּוֹת, וְהוּא שׁוֹתֶה חָלָב מֵאִמּוֹ.\nהַלִּוְיָתָנִים שָׁרִים שִׁירִים בְּקוֹל נָמוּךְ וְעָמֹק. אֶת הַשִּׁירִים שֶׁלָּהֶם אֶפְשָׁר לִשְׁמֹעַ בַּמַּיִם מִמֶּרְחָק שֶׁל מֵאוֹת קִילוֹמֶטְרִים. בֶּעָבָר צָדוּ לִוְיָתָנִים רַבִּים, וְהַיּוֹם שׁוֹמְרִים עֲלֵיהֶם כְּדֵי שֶׁלֹּא יֵעָלְמוּ.",
 qs:[
  ["מָה הִיא הַחַיָּה הַגְּדוֹלָה בְּיוֹתֵר בָּעוֹלָם?","הַלִּוְיָתָן הַכָּחֹל",["הַפִּיל","הַגִּ'ירָפָה","הַכָּרִישׁ"]],
  ["לְמָה מַשְׁוִים אֶת אֹרֶךְ הַלִּוְיָתָן?","לִשְׁלוֹשָׁה אוֹטוֹבּוּסִים",["לִשְׁלוֹשׁ מְכוֹנִיּוֹת","לְבַיִת אֶחָד","לְעֶשֶׂר סִירוֹת"]],
  ["מָה אוֹכֵל הַלִּוְיָתָן הַכָּחֹל?","יְצוּרִים זְעִירִים",["כְּרִישִׁים","דָּגִים גְּדוֹלִים","אַצּוֹת בִּלְבַד"]],
  ["אֵיךְ הוּא אוֹכֵל?","בּוֹלֵעַ מַיִם וּמְסַנֵּן מֵהֶם אֶת הָאֹכֶל",["רוֹדֵף אַחֲרֵי דָּגִים וְנוֹשֵׁךְ","אוֹסֵף אֹכֶל מִקַּרְקָעִית הַיָּם","אוֹכֵל רַק בַּלַּיְלָה"]],
  ["מָה מוֹכִיחַ שֶׁהַלִּוְיָתָן אֵינוֹ דָּג?","הוּא נוֹשֵׁם אֲוִיר וְהַגּוּר שׁוֹתֶה חָלָב",["הוּא גָּדוֹל מְאוֹד","הוּא חַי בַּיָּם","הוּא שׂוֹחֶה מַהֵר"]],
  ["מָה אֹרֶךְ הַגּוּר כְּשֶׁהוּא נוֹלָד?","כְּמוֹ שְׁתֵּי מְכוֹנִיּוֹת",["כְּמוֹ חָתוּל","כְּמוֹ אוֹטוֹבּוּס","כְּמוֹ כַּדּוּר"]],
  ["מֵאֵיזֶה מֶרְחָק אֶפְשָׁר לִשְׁמֹעַ אֶת שִׁירֵי הַלִּוְיָתָנִים?","מִמֵּאוֹת קִילוֹמֶטְרִים",["מִכַּמָּה מֶטְרִים","רַק מִקָּרוֹב מְאוֹד","אִי אֶפְשָׁר לִשְׁמֹעַ אוֹתָם"]],
  ["לָמָּה שׁוֹמְרִים הַיּוֹם עַל הַלִּוְיָתָנִים?","כְּדֵי שֶׁלֹּא יֵעָלְמוּ מִן הָעוֹלָם",["כִּי הֵם מְסֻכָּנִים","כְּדֵי שֶׁיָּשִׁירוּ יוֹתֵר","כִּי הֵם אוֹכְלִים יוֹתֵר מִדַּי"]]

{id:"play", icon:"🎭", title:"הַהַצָּגָה",

{id:"teeth", icon:"🦷", title:"הַשִּׁנַּיִם שֶׁלָּנוּ",

{id:"treasure", icon:"🗺️", title:"הָאוֹצָר שֶׁל סָבָא",
 text:"בְּחֻפְשַׁת הַפֶּסַח בָּאוּ עֵדֶן וְאוֹרִי לְבַקֵּר אֶת סָבָא אַבְרָהָם בַּמּוֹשָׁב. עַל הַשֻּׁלְחָן בַּמִּטְבָּח חִכְּתָה לָהֶם מַעֲטָפָה חוּמָה. בִּפְנִים הָיְתָה מַפָּה מְצֻיֶּרֶת בְּיַד, וְעָלֶיהָ כָּתוּב: מִי שֶׁיִּמְצָא אֶת הָאוֹצָר, יִזְכֶּה בּוֹ.\nהַמַּפָּה הֶרְאֲתָה אֶת הֶחָצֵר שֶׁל סָבָא. חֵץ אָדֹם הוֹבִיל מֵהַדֶּלֶת אֶל עֵץ הַלִּימוֹן. לְיַד הָעֵץ מָצְאוּ הַיְּלָדִים פֶּתֶק: לְכוּ עֶשֶׂר פְּסִיעוֹת לְכִוּוּן הַלּוּל.\nהֵם סָפְרוּ עֶשֶׂר פְּסִיעוֹת וְהִגִּיעוּ לְאֶבֶן גְּדוֹלָה. מִתַּחַת לָאֶבֶן הָיָה פֶּתֶק נוֹסָף: הָאוֹצָר נִמְצָא בַּמָּקוֹם שֶׁבּוֹ הַמַּיִם יְשֵׁנִים.\nאוֹרִי חָשַׁב שֶׁזֶּה הַבֶּרֶז. עֵדֶן חָשְׁבָה שֶׁזּוֹ הַבְּאֵר הַיְּשָׁנָה שֶׁבִּקְצֵה הֶחָצֵר, שֶׁכְּבָר שָׁנִים לֹא שׁוֹאֲבִים מִמֶּנָּה. הֵם רָצוּ אֶל הַבְּאֵר, וּלְיָדָהּ מָצְאוּ קֻפְסַת פַּח יְשָׁנָה.\nבַּקֻּפְסָה לֹא הָיָה זָהָב. הָיוּ בָּהּ תְּמוּנוֹת יְשָׁנוֹת שֶׁל סָבָא כְּשֶׁהָיָה יֶלֶד, גֻּלּוֹת צִבְעוֹנִיּוֹת וּמַצְפֵּן קָטָן. סָבָא חִיֵּךְ וְאָמַר: זֶה הָאוֹצָר שֶׁלִּי מֵהַיַּלְדוּת, וְעַכְשָׁו הוּא שֶׁלָּכֶם.",

// One passage: the text stays on the right and scrolls; the questions come one at a time on the left.
// Same rules as the other thinking games: a first-try answer earns a star, a wrong answer costs one and freezes the answers briefly.
function longRead(n){
  const p = LONG_READS[n], total = p.qs.length; let i = 0, firstTry = 0, missed = false, frozen = false, locked = false;
  show(`<div class="row"><button class="btn ic" id="x" style="--c:var(--ink)">✕</button><div class="grow center"><div class="dots rtl" id="dots"></div></div>${starsHTML()}</div>
    <div class="row grow" style="align-items:stretch;gap:calc(var(--u)*2);direction:rtl">
      <div class="card ptext" id="ptext"><b>${nk(p.title)}</b>${p.text.split("\n").map(t => `<p>${nk(t)}</p>`).join("")}</div>
      <div class="col qside" id="qside"></div></div>`);
  const dots = () => { $("#dots").innerHTML = p.qs.map((_, k) => `<i class="${k < i ? "on" : ""}"></i>`).join(""); };
  function draw(){
    missed = false; locked = false; dots();
    const [q, right, wrong] = p.qs[i], opts = shuffle([right].concat(wrong));
    $("#qside").innerHTML = `<div class="row" style="direction:rtl;align-items:flex-start"><div class="lq">${nk(q)}</div><button class="btn ic" id="hear" style="--c:var(--saffron)">🔊</button></div>` +
      opts.map(o => `<button class="btn white lopt" data-ok="${o === right ? 1 : 0}">${nk(o)}</button>`).join("");
    on("#hear", () => say(q));
    $$(".lopt").forEach(el => el.addEventListener("click", () => {
      if (locked || frozen || el.classList.contains("off")) return;
      if (el.dataset.ok !== "1") {
        missed = true; el.classList.add("off"); nope(); shake(el);
        if (P.stars > 0) { addStars(-1); floatText("−1 ⭐"); }
        frozen = true; later(() => { frozen = false; }, 1500);
        return;
      }
      locked = true; el.style.setProperty("--c", "var(--olive)"); el.style.color = "#fff"; burst(el); yay();
      if (!missed) { firstTry++; addStars(1); }
      later(() => { i++; if (i >= total) finish(); else draw(); }, 1300);
    }));
  }
  function finish(){
    dots(); P.read[p.id] = Math.max(P.read[p.id] || 0, firstTry); save();
    answer("read:" + p.id, firstTry >= total - 1);
    const great = firstTry >= total - 1;
    $("#qside").innerHTML = `<div class="pic" style="font-size:calc(var(--u)*10);text-align:center">${great ? "🏆" : "📖"}</div><div style="font-size:calc(var(--u)*5);direction:ltr;text-align:center">⭐ ${firstTry} / ${total}</div>
      <div class="row" style="justify-content:center;gap:calc(var(--u)*3)"><button class="btn ic big" id="again" style="--c:var(--terra)">↻</button><button class="btn ic big" id="list" style="--c:var(--olive)">📚</button></div>`;
    if (great) { confetti(); praise(); addStars(3); }
    on("#again", () => longRead(n)); on("#list", longReadMenu);
  }
  on("#x", longReadMenu);
  draw();
}
